name: doccell
input_schema:
  directory:
    type: string
    required: true
    description: "Path to the cell directory to document"

sequence:
  # Step 1: Pass inputs through
  - id: input_collector
    op: input
    inputs: {}
    outputs:
      directory: "{{ .outputs.directory }}"
      
  # Step 2: Collect source files using git file collector
  - id: file_collector
    op: git_file_collector
    inputs:
      context_dir: "{{ .input_collector.outputs.directory }}"
      include_untracked: true
      use_gitignore: true
      max_file_size: 100000
      exclude_patterns: ["*.test.go", "*_test.go", "*.md"]

  # Step 3: Generate VIBETHIS.md using LLM
  - id: generate_doc  
    op: llm_inference
    inputs:
      provider: "Gemini"
      model: "gemini-2.0-flash-exp"
      files: "{{ .file_collector.outputs.files }}"
      system_prompt: |
        You are a technical documentation expert creating VIBETHIS.md documentation for LLM consumption.
        Analyze the provided source files and generate clear, concise documentation.
        
        Focus on:
        - Clear functionality description
        - Key interfaces and APIs
        - Usage examples
        - No repetition or unnecessary text
        - Direct, actionable information
      prompt: |
        Analyze the provided source files and generate a VIBETHIS.md documentation file.
        
        Create documentation with these sections:
        1. # Overview (2-3 sentences about what this cell does)
        2. ## Architecture (key components and their relationships)
        3. ## Key Interfaces (main APIs/functions with signatures)
        4. ## Usage Examples (practical code examples)
        5. ## Configuration (if applicable)
        
        Focus on what an LLM needs to know to use this code effectively.
        Be concise but complete. Include actual function signatures and type definitions.
    outputs:
      documentation: "{{ .outputs.response }}"