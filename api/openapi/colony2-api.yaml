openapi: 3.0.3
info:
  title: VibeThis API
  description: "HTTP API for graph visualization plus project/cell/ticket CRUD and recipe input extensions (HTTP + SSE)."
  version: 1.1.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Graph
    description: Operations related to the dependency graph
  - name: Projects
    description: CRUD for projects and git repository mappings
  - name: Cells
    description: CRUD and dependency management for managed cells
  - name: Tickets
    description: CRUD and search for ticket workflow items
  - name: UserInputs
    description: Extension handlers for recipe input management and SSE streaming
  - name: Recipes
    description: List and view recipes discovered in a project repository
  - name: Workflows
    description: Workflow execution listing and detail retrieval

paths:
  /api/projects/{projectId}/graph:
    get:
      tags: [Graph]
      summary: Get complete dependency graph
      description: Retrieves the complete graph structure of all cells and their dependencies for the specified project.
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project identifier
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'
              example:
                cells:
                  - id: cell1
                    name: Example Cell
                    path: /path/to/cell1
                    type: module
                    dependencies: [cell2, cell3]
                  - id: cell2
                    name: Another Cell
                    path: /path/to/cell2
                    type: library
                    dependencies: []
                edges:
                  - id: edge1
                    source: cell1
                    target: cell2
                  - id: edge2
                    source: cell1
                    target: cell3
        '500':
          description: Failed to build graph
          content:
            text/plain:
              schema:
                type: string
              example: "Failed to build graph: error reading directory"

  /api/projects:
    get:
      tags: [Projects]
      summary: List projects
      description: Lists projects with optional filters.
      parameters:
        - name: ids
          in: query
          description: Filter by project IDs
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: names
          in: query
          description: Filter by exact project names
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: nameContains
          in: query
          description: Case-insensitive substring match on project name
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Projects list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      tags: [Projects]
      summary: Create project
      description: Creates a new project with a git repository path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid input
          content:
            text/plain:
              schema:
                type: string

  /api/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Project identifier
        schema:
          type: string
    get:
      tags: [Projects]
      summary: Get project
      description: Retrieves a single project by ID.
      responses:
        '200':
          description: Project found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Project not found
          content:
            text/plain:
              schema:
                type: string
    patch:
      tags: [Projects]
      summary: Update project
      description: Updates project name or git repository path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid input
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Project not found
          content:
            text/plain:
              schema:
                type: string
    delete:
      tags: [Projects]
      summary: Delete project
      description: Deletes a project by ID.
      responses:
        '204':
          description: Project deleted
        '404':
          description: Project not found
          content:
            text/plain:
              schema:
                type: string

  /api/projects/{projectId}/cells:
    get:
      tags: [Cells]
      summary: List managed cells
      description: Lists managed cells for the specified project with optional filters.
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project identifier
          schema:
            type: string
        - name: ids
          in: query
          description: Filter by cell IDs
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: names
          in: query
          description: Filter by cell names
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: nameContains
          in: query
          description: Case-insensitive substring match on cell name
          schema:
            type: string
        - name: pathPrefix
          in: query
          description: Filter by working path prefix
          schema:
            type: string
        - name: includeDeleted
          in: query
          description: Include soft-deleted cells
          schema:
            type: boolean
            default: false
        - name: dependsOn
          in: query
          description: Return cells that depend on any provided cell IDs
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: populator
          in: query
          description: Filter by populator name
          schema:
            type: string
        - name: populatorIds
          in: query
          description: Filter by populator external IDs
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: Cells list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManagedCell'
    post:
      tags: [Cells]
      summary: Create cell
      description: Creates a managed cell within the specified project.
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CellCreateRequest'
      responses:
        '201':
          description: Cell created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedCell'
        '400':
          description: Invalid input
          content:
            text/plain:
              schema:
                type: string

  /api/projects/{projectId}/cells/{cellId}:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Project identifier
        schema:
          type: string
      - name: cellId
        in: path
        required: true
        description: Cell identifier
        schema:
          type: string
    get:
      tags: [Cells]
      summary: Get cell
      description: Retrieves a managed cell by ID.
      responses:
        '200':
          description: Cell found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedCell'
        '404':
          description: Cell not found
          content:
            text/plain:
              schema:
                type: string
    patch:
      tags: [Cells]
      summary: Update cell
      description: Updates mutable fields on a managed cell.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CellUpdateRequest'
      responses:
        '200':
          description: Cell updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedCell'
        '400':
          description: Invalid input
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Cell not found
          content:
            text/plain:
              schema:
                type: string
    delete:
      tags: [Cells]
      summary: Soft delete cell
      description: Marks a cell as deleted (soft delete).
      responses:
        '204':
          description: Cell marked deleted
        '404':
          description: Cell not found
          content:
            text/plain:
              schema:
                type: string

  /api/projects/{projectId}/cells/{cellId}/dependencies:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Project identifier
        schema:
          type: string
      - name: cellId
        in: path
        required: true
        description: Cell identifier
        schema:
          type: string
    put:
      tags: [Cells]
      summary: Replace cell dependencies
      description: Replaces outbound dependencies for the given cell.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CellDependenciesRequest'
      responses:
        '204':
          description: Dependencies updated
        '400':
          description: Invalid dependency list
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Cell not found
          content:
            text/plain:
              schema:
                type: string

  /api/projects/{projectId}/cells/sync:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Project identifier
        schema:
          type: string
    post:
      tags: [Cells]
      summary: Synchronize cells from a provider
      description: Runs the configured cell populator (default `graph/moon` using the Moon project graph) to upsert cells and dependencies for the project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CellSyncRequest'
      responses:
        '200':
          description: Synchronization result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CellSyncResult'
        '400':
          description: Invalid project or populator
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Project not found
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Synchronization failed
          content:
            text/plain:
              schema:
                type: string

  /api/projects/{projectId}/tickets:
    get:
      tags: [Tickets]
      summary: Search tickets
      description: Searches tickets within the specified project by stage, state, actor, cell filters, and time bounds.
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project identifier
          schema:
            type: string
        - name: stages
          in: query
          description: Filter tickets matching any stage
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: stageNotIn
          in: query
          description: Exclude tickets with these stages
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: states
          in: query
          description: Filter by ticket states
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TicketState'
          style: form
          explode: true
        - name: actors
          in: query
          description: Filter by actor types
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ActorType'
          style: form
          explode: true
        - name: cells
          in: query
          description: Filter by cell names
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: updatedAfter
          in: query
          description: Return tickets updated after this timestamp (RFC3339)
          schema:
            type: string
            format: date-time
        - name: updatedBefore
          in: query
          description: Return tickets updated before this timestamp (RFC3339)
          schema:
            type: string
            format: date-time
        - name: createdAfter
          in: query
          description: Return tickets created after this timestamp (RFC3339)
          schema:
            type: string
            format: date-time
        - name: createdBefore
          in: query
          description: Return tickets created before this timestamp (RFC3339)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Tickets list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
    post:
      tags: [Tickets]
      summary: Create ticket
      description: Creates a new ticket tied to the specified project and cell.
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreateRequest'
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: Invalid input
          content:
            text/plain:
              schema:
                type: string

  /api/projects/{projectId}/tickets/stages:
    get:
      tags: [Tickets]
      summary: List stages
      description: Returns distinct stages for tickets in the specified project matching the provided filters.
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project identifier
          schema:
            type: string
        - name: stages
          in: query
          description: Include only these stages
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: stageNotIn
          in: query
          description: Exclude these stages
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: states
          in: query
          description: Filter by states
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TicketState'
          style: form
          explode: true
        - name: actors
          in: query
          description: Filter by actor types
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ActorType'
          style: form
          explode: true
        - name: cells
          in: query
          description: Filter by cell names
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: updatedAfter
          in: query
          schema:
            type: string
            format: date-time
        - name: updatedBefore
          in: query
          schema:
            type: string
            format: date-time
        - name: createdAfter
          in: query
          schema:
            type: string
            format: date-time
        - name: createdBefore
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Stage list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /api/projects/{projectId}/tickets/states:
    get:
      tags: [Tickets]
      summary: List built-in states
      description: Returns built-in ticket states.
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project identifier
          schema:
            type: string
      responses:
        '200':
          description: State list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketState'

  /api/projects/{projectId}/tickets/{ticketId}:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Project identifier
        schema:
          type: string
      - name: ticketId
        in: path
        required: true
        description: Ticket identifier
        schema:
          type: string
    get:
      tags: [Tickets]
      summary: Get ticket
      description: Retrieves a ticket by ID.
      responses:
        '200':
          description: Ticket found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          description: Ticket not found
          content:
            text/plain:
              schema:
                type: string
    patch:
      tags: [Tickets]
      summary: Update ticket
      description: Updates stage, state, description, or actor on a ticket with optional optimistic version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketUpdateRequest'
      responses:
        '200':
          description: Ticket updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: Invalid update payload
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Ticket not found
          content:
            text/plain:
              schema:
                type: string

  /api/projects/{projectId}/tickets/{ticketId}/at:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Project identifier
        schema:
          type: string
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
        description: Ticket identifier
      - name: at
        in: query
        required: true
        description: Timestamp (RFC3339) to fetch the ticket state at
        schema:
          type: string
          format: date-time
    get:
      tags: [Tickets]
      summary: Get ticket snapshot
      description: Retrieves the ticket state at a specific timestamp.
      responses:
        '200':
          description: Ticket snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          description: Ticket not found
          content:
            text/plain:
              schema:
                type: string

  /api/projects/{projectId}/tickets/{ticketId}/events:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Project identifier
        schema:
          type: string
      - name: ticketId
        in: path
        required: true
        description: Ticket identifier
        schema:
          type: string
    get:
      tags: [Tickets]
      summary: List ticket events
      description: Returns all events associated with a ticket, including workflow executions, ticket updates, document attachments, and changesets.
      parameters:
        - name: kind
          in: query
          required: false
          description: Filter by event kind
          schema:
            $ref: '#/components/schemas/TicketEventKind'
        - name: since
          in: query
          required: false
          description: Only return events after this timestamp
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          description: Only return events before this timestamp
          schema:
            type: string
            format: date-time
        - name: includeReset
          in: query
          required: false
          description: Include events that have been reset/invalidated
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of ticket events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketEvent'
        '404':
          description: Ticket not found
          content:
            text/plain:
              schema:
                type: string

  /api/projects/{projectId}/workflows:
    get:
      tags: [Workflows]
      summary: List workflows for a project
      description: Returns workflows scoped to the project (filtered by tenant field in swf-go)
      operationId: getApiProjectsWorkflows
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/WorkflowStatus'
          style: form
          explode: true
        - name: ticket_id
          in: query
          schema:
            type: string
        - name: cell_id
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of workflow summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowSummary'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Workflows]
      summary: Start a workflow run for a recipe in the project
      description: Launches a workflow job using the specified recipe, inputs, and target cell within the project.
      operationId: postApiProjectsWorkflows
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartWorkflowRequest'
      responses:
        '201':
          description: Workflow job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSummary'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project, cell, or recipe not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Workflow engine unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{projectId}/workflows/{workflowId}:
    get:
      tags: [Workflows]
      summary: Get workflow detail
      description: Returns workflow detail. Validates workflow belongs to project via tenant field.
      operationId: getApiProjectsWorkflows1
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
        - name: includeRawJobData
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Workflow detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDetail'
        '403':
          description: Workflow does not belong to this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{projectId}/workflows/{workflowId}/chapters/{chapterNumber}/artifacts/{artifactName}:
    get:
      tags: [Workflows]
      summary: Retrieve a specific artifact from a workflow chapter
      description: |
        Downloads a specific artifact file produced by a chapter in a workflow.
        Returns the artifact content as application/octet-stream (artifacts do not have associated mime types).
      operationId: getWorkflowArtifact
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
          description: Project ID
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
          description: Workflow ID
        - name: chapterNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
          description: Chapter number (0-indexed)
        - name: artifactName
          in: path
          required: true
          schema:
            type: string
          description: Artifact name
      responses:
        '200':
          description: Artifact content (binary download)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Suggested filename for download
        '404':
          description: Artifact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{projectId}/jobs/{jobId}/outcome:
    get:
      tags: [Workflows]
      summary: Get consolidated workflow outcome for a job
      description: |
        Returns the latest known outcome for a workflow job using engine `GetJobRun` data only
        (no Strata reads). Aggregates the final status, the last attempt output or error, and all
        produced artifacts across attempts.
      operationId: getWorkflowOutcome
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Consolidated workflow outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowOutcome'
        '404':
          description: Job not found in project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '425':
          description: Job still running; no terminal outcome yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{projectId}/jobs/{jobId}/tasks/{taskOrdinal}/artifacts/{artifactName}:
    get:
      tags: [Workflows]
      summary: Download an artifact via engine by task ordinal and name
      description: |
        Streams artifact bytes directly from the workflow engine using `GetArtifact`. Uses the
        task ordinal and artifact name to build the `ArtifactKey`; does not rely on Strata.
      operationId: getJobArtifact
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: taskOrdinal
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: artifactName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Artifact content (binary)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Artifact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{projectId}/recipes:
    get:
      summary: List recipes
      description: List all recipes in a project with optional status filtering
      operationId: listRecipes
      tags:
        - Recipes
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
          description: Project ID
          example: "proj_123"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, published, unpublished]
            default: all
          description: Filter by publish status
      responses:
        '200':
          description: List of recipes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeListResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create recipe
      description: Create a new recipe (optionally auto-publish)
      operationId: createRecipe
      tags:
        - Recipes
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
          description: Project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecipeRequest'
      responses:
        '201':
          description: Recipe created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeVersion'
        '400':
          description: Invalid request or recipe validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/RecipeValidationResponse'
        '409':
          description: Recipe already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{projectId}/recipes/validate:
    post:
      summary: Validate recipe
      description: Validate recipe content and return structured validation errors
      operationId: validateRecipe
      tags:
        - Recipes
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
          description: Project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRecipeRequest'
      responses:
        '200':
          description: Recipe validation succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeValidationResponse'
        '400':
          description: Recipe validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeValidationResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{projectId}/recipes/{recipeName}:
    get:
      summary: Get recipe
      description: Get a recipe with content (published version or specific ref)
      operationId: getRecipe
      tags:
        - Recipes
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
          description: Project ID
        - name: recipeName
          in: path
          required: true
          schema:
            type: string
          description: Recipe name (can include slashes, URL-encoded)
          example: "workflows%2Fci%2Fbuild"
        - name: ref
          in: query
          required: false
          schema:
            type: string
          description: Git reference (commit, tag, branch). Empty = published version
          example: "v1.0.0"
      responses:
        '200':
          description: Recipe details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeWithContent'
        '404':
          description: Recipe not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Recipe exists but not published (when ref is empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update recipe
      description: Update an existing recipe (create new version)
      operationId: updateRecipe
      tags:
        - Recipes
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
          description: Project ID
        - name: recipeName
          in: path
          required: true
          schema:
            type: string
          description: Recipe name (URL-encoded if contains slashes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecipeRequest'
      responses:
        '200':
          description: Recipe updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeVersion'
        '400':
          description: Invalid request or recipe validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/RecipeValidationResponse'
        '404':
          description: Recipe not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete recipe
      description: Delete a recipe and all its history
      operationId: deleteRecipe
      tags:
        - Recipes
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
          description: Project ID
        - name: recipeName
          in: path
          required: true
          schema:
            type: string
          description: Recipe name (URL-encoded if contains slashes)
      responses:
        '204':
          description: Recipe deleted
        '404':
          description: Recipe not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{projectId}/recipes/{recipeName}/publish:
    post:
      summary: Publish recipe
      description: Mark a specific version as published
      operationId: publishRecipe
      tags:
        - Recipes
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
          description: Project ID
        - name: recipeName
          in: path
          required: true
          schema:
            type: string
          description: Recipe name (URL-encoded if contains slashes)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRecipeRequest'
      responses:
        '200':
          description: Recipe published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedRecipe'
        '400':
          description: Recipe validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeValidationResponse'
        '404':
          description: Recipe or commit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{projectId}/recipes/{recipeName}/unpublish:
    post:
      summary: Unpublish recipe
      description: Remove published status from a recipe
      operationId: unpublishRecipe
      tags:
        - Recipes
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
          description: Project ID
        - name: recipeName
          in: path
          required: true
          schema:
            type: string
          description: Recipe name (URL-encoded if contains slashes)
      responses:
        '204':
          description: Recipe unpublished
        '404':
          description: Recipe not found or not published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{projectId}/recipes/{recipeName}/history:
    get:
      summary: Get recipe history
      description: Get version history for a recipe
      operationId: getRecipeHistory
      tags:
        - Recipes
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
          description: Project ID
        - name: recipeName
          in: path
          required: true
          schema:
            type: string
          description: Recipe name (URL-encoded if contains slashes)
      responses:
        '200':
          description: Recipe version history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeHistoryResponse'
        '404':
          description: Recipe not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{projectId}/user-inputs/pending:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Project identifier
        schema:
          type: string
    get:
      tags: [UserInputs]
      summary: List pending input jobs
      description: Returns all pending user input requests from the workflow engine for the specified project.
      responses:
        '200':
          description: Pending input list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingInput'

  /api/projects/{projectId}/user-inputs/{jobId}:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Project identifier
        schema:
          type: string
      - name: jobId
        in: path
        required: true
        description: Input job identifier
        schema:
          type: string
    get:
      tags: [UserInputs]
      summary: Get input request details
      description: Returns details for a pending user input request in the specified project.
      responses:
        '200':
          description: Input request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInputDetails'
        '404':
          description: Input request not found
          content:
            text/plain:
              schema:
                type: string

  /api/projects/{projectId}/user-inputs/{jobId}/respond:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Project identifier
        schema:
          type: string
      - name: jobId
        in: path
        required: true
        description: Input job identifier
        schema:
          type: string
    post:
      tags: [UserInputs]
      summary: Submit input response
      description: Completes a pending input request with user-provided fields in the specified project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormResponse'
      responses:
        '200':
          description: Response accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          description: Invalid request
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Input request not found
          content:
            text/plain:
              schema:
                type: string

  /api/projects/{projectId}/user-inputs/{jobId}/cancel:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Project identifier
        schema:
          type: string
      - name: jobId
        in: path
        required: true
        description: Input job identifier
        schema:
          type: string
    post:
      tags: [UserInputs]
      summary: Cancel input request
      description: Cancels a pending input request in the specified project and broadcasts an SSE event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Human-readable cancellation reason
      responses:
        '200':
          description: Cancellation acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '404':
          description: Input request not found
          content:
            text/plain:
              schema:
                type: string

  /api/projects/{projectId}/user-inputs/stream:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Project identifier
        schema:
          type: string
    get:
      tags: [UserInputs]
      summary: User input SSE stream
      description: "Server-Sent Events stream emitting input lifecycle events for the specified project. Clients receive an initial `connected` event, a snapshot of `input_pending` items, heartbeat events, lifecycle updates such as `input_cancelled`, and error notifications. Event payloads match the InputSSEEvent schema."
      responses:
        '200':
          description: SSE stream established
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/InputSSEEvent'
              example: |
                event: connected
                data: {"client_id":"client-123"}

                event: input_pending
                data: {"id":"job-abc"}

                event: heartbeat
                data: {"timestamp":"2024-01-15T10:30:00Z"}

components:
  schemas:
    Cell:
      type: object
      properties:
        dependencies:
          description: List of cell IDs this cell depends on
          type: array
          items:
            type: string
        id:
          description: Unique identifier for the cell
          type: string
        name:
          description: Display name of the cell
          type: string
        path:
          description: File system path to the cell directory
          type: string
        type:
          description: Type of cell (e.g., module, library)
          type: string
      required: [id, name, path, type, dependencies]

    Edge:
      type: object
      properties:
        id:
          description: Unique identifier for the edge
          type: string
        source:
          description: Cell ID of the source (from)
          type: string
        target:
          description: Cell ID of the target (to)
          type: string
      required: [id, source, target]

    Graph:
      type: object
      properties:
        cells:
          description: List of all cells in the graph
          type: array
          items:
            $ref: '#/components/schemas/Cell'
        edges:
          description: List of all edges (dependencies) in the graph
          type: array
          items:
            $ref: '#/components/schemas/Edge'
      required: [cells, edges]

    Project:
      type: object
      properties:
        id:
          type: string
          description: Project identifier (KSUID)
        version:
          type: integer
          format: int64
          description: Optimistic lock version
        name:
          type: string
          description: Project display name (unique)
        gitRepoPath:
          type: string
          description: Filesystem path to the git repository
        gitRepoBranch:
          type: string
          description: Git branch to use for operations (optional, defaults to repository default branch)
        defaultTicketRecipe:
          type: string
          description: Default recipe name to use when creating new tickets (optional)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, version, name, gitRepoPath, createdAt, updatedAt]

    ProjectCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: Project name
        gitRepoPath:
          type: string
          description: Filesystem path to the git repository
      required: [name, gitRepoPath]

    ProjectUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: Project display name
        gitRepoPath:
          type: string
          description: Filesystem path to the git repository
        gitRepoBranch:
          type: string
          description: Git branch to use for operations
        defaultTicketRecipe:
          type: string
          description: Default recipe name for new tickets

    ManagedCell:
      type: object
      properties:
        id:
          type: string
          description: Cell identifier (KSUID)
        version:
          type: integer
          format: int64
          description: Optimistic lock version
        projectId:
          type: string
        name:
          type: string
        description:
          type: string
        workingPath:
          type: string
        populator:
          type: string
          description: Source system that created or updated the cell
        populatorId:
          type: string
          description: External identifier from the populator
        dependencies:
          type: array
          description: Outbound dependency cell IDs
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - version
        - projectId
        - name
        - workingPath
        - createdAt
        - updatedAt

    CellSyncRequest:
      type: object
      properties:
        populator:
          type: string
          description: Populator to use for synchronization (defaults to graph/moon).
          default: graph/moon
        pruneMissing:
          type: boolean
          description: Soft-delete cells not returned by the populator.
          default: false

    CellSyncResult:
      type: object
      properties:
        populator:
          type: string
        created:
          type: integer
          format: int32
        updated:
          type: integer
          format: int32
        restored:
          type: integer
          format: int32
        deleted:
          type: integer
          format: int32
        skipped:
          type: integer
          format: int32
        dependenciesUpdated:
          type: integer
          format: int32
        affectedIds:
          type: array
          items:
            type: string
      required:
        - populator
        - created
        - updated
        - restored
        - deleted
        - skipped
        - dependenciesUpdated

    CellCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: Logical cell name
        description:
          type: string
        workingPath:
          type: string
          description: Filesystem path backing the cell
        populator:
          type: string
        populatorId:
          type: string
      required: [name, workingPath]

    CellUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        workingPath:
          type: string

    CellDependenciesRequest:
      type: object
      properties:
        dependencies:
          type: array
          items:
            type: string
          description: Ordered list of dependency cell IDs (duplicates or self references ignored)
      required: [dependencies]

    ActorType:
      type: string
      enum: [user, agent]

    ActorUser:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    ActorAgent:
      type: object
      properties:
        cell:
          type: string
          description: Name of the agent cell
        workflow_name:
          type: string
        execution_id:
          type: string
        invocation_hash:
          type: string
      required: [cell, workflow_name, execution_id, invocation_hash]

    Actor:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ActorType'
        user:
          $ref: '#/components/schemas/ActorUser'
        agent:
          $ref: '#/components/schemas/ActorAgent'
      required: [type]
      description: "Actor performing the action. Provide `user` when type=user, or `agent` when type=agent."

    ActorPatch:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ActorType'
        user:
          $ref: '#/components/schemas/ActorUser'
        agent:
          $ref: '#/components/schemas/ActorAgent'

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    TicketState:
      type: string
      enum: [waiting_user, waiting_dependency, waiting_capacity, working]
      description: Built-in ticket states

    Ticket:
      type: object
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
        projectId:
          type: string
        cellId:
          type: string
        cellName:
          type: string
        title:
          type: string
        description:
          type: string
        stage:
          type: string
          description: Logical stage label (e.g., triage, review, __completed__)
        state:
          $ref: '#/components/schemas/TicketState'
        creator:
          $ref: '#/components/schemas/Actor'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        lastResetId:
          type: string
          nullable: true
        lastResetAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - version
        - projectId
        - cellId
        - cellName
        - title
        - stage
        - state
        - creator
        - createdAt
        - updatedAt
        - validFrom
        - validUntil

    TicketCreateRequest:
      type: object
      properties:
        cell:
          type: string
          description: Cell name within the project
        title:
          type: string
        description:
          type: string
        stage:
          type: string
        state:
          $ref: '#/components/schemas/TicketState'
        actor:
          $ref: '#/components/schemas/Actor'
      required: [cell, title, stage, state, actor]

    TicketUpdateRequest:
      type: object
      properties:
        expectedVersion:
          type: integer
          format: int64
          description: Optimistic version expected by the client
        stage:
          type: string
        state:
          $ref: '#/components/schemas/TicketState'
        completedAt:
          type: string
          format: date-time
        description:
          type: string
        actor:
          $ref: '#/components/schemas/ActorPatch'

    TicketEventKind:
      type: string
      enum: [ticket, workflow, markdown_doc, changeset, reset]
      description: Type of event associated with a ticket

    WorkflowEventType:
      type: string
      enum: [running, completed, failed]
      description: Workflow execution status

    MarkdownEventType:
      type: string
      enum: [attached, overridden, removed]
      description: Markdown document operation type

    ChangeSetEventType:
      type: string
      enum: [attached, overridden, removed]
      description: ChangeSet operation type

    WorkflowEventPayload:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/WorkflowEventType'
        workflowId:
          type: string
          description: Workflow/job identifier
        runId:
          type: string
          description: Workflow run identifier
      required: [type, workflowId, runId]

    MarkdownEventPayload:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/MarkdownEventType'
        name:
          type: string
          description: Document name
        path:
          type: string
          description: File path to document
      required: [type, name, path]

    ChangeSetEventPayload:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ChangeSetEventType'
        path:
          type: string
          description: Repository path
        commit_message:
          type: string
          description: Git commit message
        base_hash:
          type: string
          description: Base commit hash
        parent_hash:
          type: string
          description: Parent commit hash
        tip_hash:
          type: string
          description: Tip commit hash
      required: [type, path]

    TicketEventPayload:
      type: object
      properties:
        stage:
          type: string
          description: Updated stage
        state:
          $ref: '#/components/schemas/TicketState'
        description:
          type: string
          description: Updated description
        completedAt:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          description: Optional notes about the change

    ResetEventPayload:
      type: object
      properties:
        resetId:
          type: string
          description: Unique reset identifier
        anchorEventId:
          type: string
          nullable: true
          description: Event ID marking the boundary (events after this are invalidated)
        reason:
          type: string
          description: Reason for reset
      required: [resetId, reason]

    TicketEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique event identifier
        ticketId:
          type: string
          description: Associated ticket ID
        projectId:
          type: string
          description: Project ID
        kind:
          $ref: '#/components/schemas/TicketEventKind'
        timestamp:
          type: string
          format: date-time
          description: When the event occurred
        actor:
          $ref: '#/components/schemas/Actor'
          description: Who triggered the event
        resetId:
          type: string
          nullable: true
          description: Associated reset ID if event has been invalidated
        workflowPayload:
          $ref: '#/components/schemas/WorkflowEventPayload'
        markdownPayload:
          $ref: '#/components/schemas/MarkdownEventPayload'
        changesetPayload:
          $ref: '#/components/schemas/ChangeSetEventPayload'
        ticketPayload:
          $ref: '#/components/schemas/TicketEventPayload'
        resetPayload:
          $ref: '#/components/schemas/ResetEventPayload'
      required: [id, ticketId, projectId, kind, timestamp, actor]
      description: "Event associated with a ticket. Check `kind` field and use corresponding payload field (e.g., kind=workflow → use workflowPayload)"

    WorkflowStatus:
      type: string
      enum:
        - running
        - completed
        - failed
        - canceled
        - terminated
        - timed_out
        - unknown
      description: Normalized workflow execution status

    WorkflowOutcome:
      type: object
      description: Consolidated workflow outcome derived from engine GetJobRun data
      required:
        - job_id
        - status
        - artifacts
      properties:
        job_id:
          type: string
          description: Job identifier (same as workflow ID)
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        attempt_ordinal:
          type: integer
          format: int64
          nullable: true
          description: Ordinal of the last task attempt that produced output or error
        output:
          type: object
          additionalProperties: true
          nullable: true
          description: Latest available output payload from the selected attempt
        error:
          type: string
          nullable: true
          description: Human-readable error from the selected attempt or job outcome
        artifacts:
          type: array
          description: Aggregated artifact metadata across all attempts
          items:
            $ref: '#/components/schemas/ArtifactReference'

    ChapterStatus:
      type: string
      enum:
        - pending
        - running
        - completed
        - failed
        - skipped
      description: Chapter (operation) execution status

    ArtifactReference:
      type: object
      required:
        - artifact_id
        - artifact_type
        - name
        - created_at
      properties:
        artifact_id:
          type: string
        artifact_type:
          type: string
        name:
          type: string
        size_bytes:
          type: integer
          format: int64
          nullable: true
        url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    ChapterDetail:
      type: object
      required:
        - chapter_number
        - chapter_type
        - status
      properties:
        chapter_number:
          type: integer
        chapter_type:
          type: string
        op_name:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ChapterStatus'
        start_time:
          type: string
          format: date-time
          nullable: true
        end_time:
          type: string
          format: date-time
          nullable: true
        input:
          type: object
          additionalProperties: true
        output:
          type: object
          additionalProperties: true
          nullable: true
        error:
          type: string
          nullable: true
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactReference'

    WorkflowSummary:
      type: object
      required:
        - workflow_id
        - run_id
        - status
        - recipe_name
        - created_at
      properties:
        workflow_id:
          type: string
          description: "Workflow/job ID (KSUID)"
          example: "2U9V0W1X2Y3Z4A5B6C7D8E9F0G"
        run_id:
          type: string
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        recipe_name:
          type: string
        input_hash:
          type: string
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        ticket_id:
          type: string
          nullable: true
        ticket_title:
          type: string
          nullable: true
        cell_id:
          type: string
          nullable: true
        cell_name:
          type: string
          nullable: true
        start_time:
          type: string
          format: date-time
          nullable: true
        close_time:
          type: string
          format: date-time
          nullable: true
        actor:
          $ref: '#/components/schemas/Actor'
        created_at:
          type: string
          format: date-time

    WorkflowDetail:
      type: object
      required:
        - workflow_id
        - run_id
        - status
        - recipe_name
        - chapters
        - created_at
      properties:
        workflow_id:
          type: string
        run_id:
          type: string
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        recipe_name:
          type: string
        ticket_id:
          type: string
          nullable: true
        ticket:
          $ref: '#/components/schemas/Ticket'
          nullable: true
        cell_id:
          type: string
          nullable: true
        cell_name:
          type: string
          nullable: true
        start_time:
          type: string
          format: date-time
          nullable: true
        close_time:
          type: string
          format: date-time
          nullable: true
        actor:
          $ref: '#/components/schemas/Actor'
        git_ref:
          type: string
          nullable: true
        git_commit:
          type: string
          nullable: true
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/ChapterDetail'
        raw_job_data:
          type: object
          additionalProperties: true
          nullable: true
        created_at:
          type: string
          format: date-time

    StartWorkflowRequest:
      type: object
      required:
        - recipe_name
        - cell_id
      properties:
        recipe_name:
          type: string
          description: Name of the recipe to execute
          example: "workflows/ci/build"
        cell_id:
          type: string
          description: Target cell ID where the workflow context originates
          example: "cell_123"
        inputs:
          type: object
          description: Key/value inputs passed to the recipe
          additionalProperties: true
          example:
            branch: main
            deploy: true
        git_ref:
          type: string
          description: Optional git ref override (defaults to cell or project branch)
          example: "feature/login"
        ticket_id:
          type: string
          description: Optional ticket to associate with the workflow
          example: "tkt_123"
        idempotency_key:
          type: string
          description: Optional key to de-duplicate repeated start requests
          example: "proj_123:cell_123:workflows/ci/build:abc123"
        actor_email:
          type: string
          format: email
          description: Email address of the user starting the workflow

    FieldType:
      type: string
      enum:
        - short_answer
        - paragraph_text
        - multiple_choice
        - checkboxes
        - dropdown
        - linear_scale
        - multiple_choice_grid
        - checkbox_grid
        - date
        - time
        - file_upload

    Option:
      type: object
      properties:
        value:
          type: string
        label:
          type: string
      required: [value]

    LinearScale:
      type: object
      properties:
        min:
          type: integer
        max:
          type: integer
        min_label:
          type: string
        max_label:
          type: string
      required: [min, max]

    FieldValidation:
      type: object
      properties:
        min_length:
          type: integer
          minimum: 0
        max_length:
          type: integer
          minimum: 1
        pattern:
          type: string
        min:
          type: integer
        max:
          type: integer

    FormField:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/FieldType'
        question:
          type: string
        required:
          type: boolean
        placeholder:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/Option'
        scale:
          $ref: '#/components/schemas/LinearScale'
        validation:
          $ref: '#/components/schemas/FieldValidation'
      required: [id, type, question]

    Artifact:
      type: object
      properties:
        path:
          type: string
      required: [path]

    GlobPattern:
      type: object
      properties:
        pattern:
          type: string
      required: [pattern]

    FormContext:
      type: object
      properties:
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
        artifacts_from_output:
          type: string
        artifacts_glob:
          type: array
          items:
            $ref: '#/components/schemas/GlobPattern'

    InputFormConfig:
      type: object
      properties:
        question:
          type: string
        type:
          $ref: '#/components/schemas/FieldType'
        options:
          type: array
          items:
            $ref: '#/components/schemas/Option'
        scale:
          $ref: '#/components/schemas/LinearScale'
        title:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormField'
        context:
          $ref: '#/components/schemas/FormContext'
        timeout:
          type: integer
          description: Timeout in seconds
          default: 300
        default_on_timeout:
          description: Default value to return if input times out
      description: Configuration for a single- or multi-question input form.

    RecipeType:
      type: string
      enum: [state, sequence, op]

    RecipeInfo:
      type: object
      description: Summary information about a recipe
      required:
        - name
        - latestCommit
        - latestCommitAt
      properties:
        name:
          type: string
          description: Hierarchical recipe name (e.g., "workflows/ci/build")
          example: "workflows/ci/build"
          pattern: ^[a-zA-Z0-9_\-/]+$
        latestCommit:
          type: string
          description: Git commit hash of latest version
          example: "a1b2c3d4e5f6789012345678"
        latestCommitAt:
          type: string
          format: date-time
          description: Timestamp of latest commit
          example: "2025-01-15T10:30:00Z"
        publishedCommit:
          type: string
          nullable: true
          description: Git commit hash of published version
          example: "a1b2c3d4e5f6789012345678"
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when published
          example: "2025-01-15T10:30:00Z"
        publishedBy:
          type: string
          nullable: true
          description: User who published the recipe
          example: "user@example.com"

    RecipeWithContent:
      type: object
      description: Recipe with full content and metadata
      required:
        - name
        - commitHash
        - isPublished
        - content
        - rawYaml
      properties:
        name:
          type: string
          description: Recipe name
          example: "workflows/ci/build"
        commitHash:
          type: string
          description: Git commit hash of this version
          example: "a1b2c3d4e5f6789012345678"
        isPublished:
          type: boolean
          description: Whether this version is published
          example: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: When this was published
          example: "2025-01-15T10:30:00Z"
        publishedBy:
          type: string
          nullable: true
          description: Who published this version
          example: "user@example.com"
        content:
          type: object
          description: Parsed recipe object
          additionalProperties: true
          example:
            version: "1.0"
            id: "workflows/ci/build"
            op: "echo"
            inputs:
              message: "Building..."
        rawYaml:
          type: string
          description: Raw YAML content
          example: |
            version: "1.0"
            id: workflows/ci/build
            op: echo
            inputs:
              message: "Building..."

    RecipeVersion:
      type: object
      description: Version information from recipe history
      required:
        - commitHash
        - shortHash
        - createdAt
        - author
        - message
        - isPublished
      properties:
        commitHash:
          type: string
          description: Full git commit hash
          example: "a1b2c3d4e5f6789012345678"
        shortHash:
          type: string
          description: Short git commit hash
          example: "a1b2c3d"
        createdAt:
          type: string
          format: date-time
          description: When this version was created
          example: "2025-01-15T10:30:00Z"
        author:
          type: string
          description: Commit author
          example: "system"
        message:
          type: string
          description: Commit message
          example: "Update build message"
        isPublished:
          type: boolean
          description: Whether this version is currently published
          example: false

    CreateRecipeRequest:
      type: object
      description: Request to create a new recipe
      required:
        - name
        - content
      properties:
        name:
          type: string
          description: Hierarchical recipe name
          example: "workflows/ci/build"
          pattern: ^[a-zA-Z0-9_\-/]+$
          minLength: 1
          maxLength: 200
        content:
          type: string
          description: Recipe YAML content
          example: |
            version: "1.0"
            id: workflows/ci/build
            op: echo
            inputs:
              message: "Building..."
        description:
          type: string
          description: Recipe description
          example: "CI build workflow"
          maxLength: 500
        autoPublish:
          type: boolean
          default: false
          description: Automatically publish after creation

    UpdateRecipeRequest:
      type: object
      description: Request to update an existing recipe
      required:
        - content
      properties:
        content:
          type: string
          description: Updated recipe YAML content
          example: |
            version: "1.1"
            id: workflows/ci/build
            op: echo
            inputs:
              message: "Building v2..."
        message:
          type: string
          description: Commit message
          example: "Update build message"
          maxLength: 500
        autoPublish:
          type: boolean
          default: false
          description: Automatically publish after update
        expectedCommit:
          type: string
          description: Expected current commit hash (optimistic locking)
          example: "a1b2c3d4e5f6789012345678"

    ValidateRecipeRequest:
      type: object
      description: Request to validate recipe content
      required:
        - name
        - content
      properties:
        name:
          type: string
          description: Recipe name (path)
          example: "workflows/ci/build"
        content:
          type: string
          description: Recipe YAML content
          example: |
            version: "1.0"
            id: workflows/ci/build
            op: echo
            inputs:
              message: "Build"

    ValidationError:
      type: object
      description: Validation error detail
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error classification
          example: "cel_invalid"
        message:
          type: string
          description: Human-readable error message
        path:
          type: string
          description: YAML path to the invalid field
          example: "steps[2].when"
        expression:
          type: string
          description: CEL expression (if applicable)
          example: "sequence.build.outputs.image != \"\""

    RecipeValidationResponse:
      type: object
      description: Recipe validation result
      required:
        - valid
        - errors
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'

    PublishRecipeRequest:
      type: object
      description: Request to publish a recipe version
      properties:
        commitHash:
          type: string
          description: Commit to publish (empty = latest)
          example: "a1b2c3d4e5f6789012345678"
        publishedBy:
          type: string
          description: User who is publishing
          example: "user@example.com"
          maxLength: 200
        expectedCommit:
          type: string
          description: Expected current published commit (optimistic locking)
          example: "old-commit-hash"

    PublishedRecipe:
      type: object
      description: Response after publishing a recipe
      required:
        - name
        - publishedCommit
        - publishedAt
      properties:
        name:
          type: string
          description: Recipe name
          example: "workflows/ci/build"
        publishedCommit:
          type: string
          description: Commit that was published
          example: "a1b2c3d4e5f6789012345678"
        publishedAt:
          type: string
          format: date-time
          description: When it was published
          example: "2025-01-15T10:30:00Z"
        publishedBy:
          type: string
          nullable: true
          description: Who published it
          example: "user@example.com"

    RecipeListResponse:
      type: object
      description: Response containing list of recipes
      required:
        - recipes
      properties:
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/RecipeInfo'

    RecipeHistoryResponse:
      type: object
      description: Response containing recipe version history
      required:
        - versions
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/RecipeVersion'

    RecipeSummary:
      type: object
      deprecated: true
      description: "DEPRECATED: Use RecipeInfo for new implementations"
      properties:
        id:
          type: string
        version:
          type: string
        description:
          type: string
        type:
          $ref: '#/components/schemas/RecipeType'
        hash:
          type: string
        lastModified:
          type: string
          format: date-time
      required: [id, version, description, type, hash, lastModified]

    RecipeDetail:
      type: object
      deprecated: true
      description: "DEPRECATED: Use RecipeWithContent for new implementations"
      properties:
        meta:
          $ref: '#/components/schemas/RecipeSummary'
        rawYaml:
          type: string
        recipe:
          description: Parsed recipe structure
          type: object
          additionalProperties: {}
      required: [meta, rawYaml, recipe]

    PendingInput:
      type: object
      properties:
        id:
          type: string
          description: Workflow job ID
      required: [id]

    UserInputDetails:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
        startTime:
          type: string
          format: date-time
        form:
          $ref: '#/components/schemas/InputFormConfig'
        hash:
          type: string
      required: [jobId, status, startTime, form]

    FormResponse:
      type: object
      properties:
        activity_id:
          type: string
        user_id:
          type: string
        response:
          description: Single-question response value
        fields:
          type: object
          additionalProperties: {}
          description: Field responses for multi-field forms
        submitted_at:
          type: string
          format: date-time
        time_to_complete:
          type: integer
        hash:
          type: string
      required: [fields]

    SSEEvent:
      type: object
      properties:
        type:
          type: string
          description: Event type
        data:
          type: object
          additionalProperties: {}
          description: Event payload

    InputSSEEventType:
      type: string
      enum:
        - connected
        - input_pending
        - input_cancelled
        - heartbeat
        - error
      description: "Input SSE event type emitted by /api/projects/{projectId}/user-inputs/stream."

    InputSSEConnectedData:
      type: object
      properties:
        client_id:
          type: string
      required: [client_id]

    InputSSEPendingData:
      type: object
      properties:
        id:
          type: string
          description: Workflow job ID
      required: [id]

    InputSSECancelledData:
      type: object
      properties:
        jobId:
          type: string
        reason:
          type: string
      required: [jobId]

    InputSSEHeartbeatData:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
      required: [timestamp]

    InputSSEErrorData:
      type: object
      properties:
        error:
          type: string
      required: [error]

    InputSSEEvent:
      type: object
      description: "Event envelope emitted by /api/projects/{projectId}/user-inputs/stream."
      properties:
        type:
          $ref: '#/components/schemas/InputSSEEventType'
        data:
          oneOf:
            - $ref: '#/components/schemas/InputSSEConnectedData'
            - $ref: '#/components/schemas/InputSSEPendingData'
            - $ref: '#/components/schemas/InputSSECancelledData'
            - $ref: '#/components/schemas/InputSSEHeartbeatData'
            - $ref: '#/components/schemas/InputSSEErrorData'
      required: [type, data]
