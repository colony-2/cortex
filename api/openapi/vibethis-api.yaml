openapi: 3.0.3
info:
  title: VibeThis API
  description: API for managing cells (boxes), their files, git operations, and containers in the VibeThis application
  version: 1.0.0
  
servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/graph:
    get:
      summary: Get complete dependency graph
      description: Retrieves the complete graph structure of all cells and their dependencies
      operationId: getGraph
      tags:
        - Graph
      responses:
        '200':
          description: Successfully retrieved graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'
              example:
                cells:
                  - id: "cell1"
                    name: "Example Cell"
                    path: "/path/to/cell1"
                    type: "module"
                    dependencies: ["cell2", "cell3"]
                  - id: "cell2"
                    name: "Another Cell"
                    path: "/path/to/cell2"
                    type: "library"
                    dependencies: []
                edges:
                  - id: "edge1"
                    source: "cell1"
                    target: "cell2"
                  - id: "edge2"
                    source: "cell1"
                    target: "cell3"
        '500':
          description: Failed to build graph
          content:
            text/plain:
              schema:
                type: string
              example: "Failed to build graph: error reading directory"

  /api/positions:
    get:
      summary: Get cell positions
      description: Retrieves saved visual positions for all cells in the graph UI
      operationId: getPositions
      tags:
        - Positions
      responses:
        '200':
          description: Successfully retrieved positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Position'
              example:
                - cellId: "cell1"
                  x: 100.0
                  y: 200.0
                - cellId: "cell2"
                  x: 300.0
                  y: 400.0
        '500':
          description: Failed to get positions
          content:
            text/plain:
              schema:
                type: string
                
    post:
      summary: Save cell positions
      description: Saves or updates visual positions for cells in the graph UI
      operationId: savePositions
      tags:
        - Positions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Position'
            example:
              - cellId: "cell1"
                x: 100.0
                y: 200.0
              - cellId: "cell2"
                x: 300.0
                y: 400.0
      responses:
        '200':
          description: Positions saved successfully
        '400':
          description: Invalid request body or JSON
          content:
            text/plain:
              schema:
                type: string
              examples:
                emptyBody:
                  value: "Request body is required"
                invalidJson:
                  value: "Invalid JSON"
        '500':
          description: Failed to save positions
          content:
            text/plain:
              schema:
                type: string

  /api/cells/{cellId}/files:
    get:
      summary: List files in cell directory
      description: Lists all files and directories within a cell's directory
      operationId: listCellFiles
      tags:
        - Files
      parameters:
        - name: cellId
          in: path
          required: true
          description: ID of the cell
          schema:
            type: string
        - name: path
          in: query
          required: false
          description: Subdirectory path within the cell (optional)
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved file list
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/FileInfo'
                  path:
                    type: string
                    description: The requested path
              example:
                files:
                  - name: "README.md"
                    path: "README.md"
                    isDir: false
                    size: 1024
                    type: "text/markdown"
                  - name: "src"
                    path: "src"
                    isDir: true
                    size: 0
                    type: "directory"
                path: ""
        '404':
          description: Cell not found
          content:
            text/plain:
              schema:
                type: string
              example: "Cell not found"
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string

  /api/cells/{cellId}/files/{filePath}:
    get:
      summary: Read file content
      description: Reads the content of a specific file within a cell's directory
      operationId: readCellFile
      tags:
        - Files
      parameters:
        - name: cellId
          in: path
          required: true
          description: ID of the cell
          schema:
            type: string
        - name: filePath
          in: path
          required: true
          description: Path to the file relative to cell directory
          schema:
            type: string
      responses:
        '200':
          description: Successfully read file content
          content:
            text/plain:
              schema:
                type: string
              example: |
                # Example File Content
                This is the content of the file.
        '404':
          description: Cell not found
          content:
            text/plain:
              schema:
                type: string
              example: "Cell not found"
        '500':
          description: Failed to read file
          content:
            text/plain:
              schema:
                type: string
                
    put:
      summary: Write file content
      description: Updates or creates a file with new content within a cell's directory
      operationId: writeCellFile
      tags:
        - Files
      parameters:
        - name: cellId
          in: path
          required: true
          description: ID of the cell
          schema:
            type: string
        - name: filePath
          in: path
          required: true
          description: Path to the file relative to cell directory
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  description: The content to write to the file
            example:
              content: |
                # Updated File Content
                This is the new content for the file.
      responses:
        '200':
          description: File written successfully
        '400':
          description: Invalid request body
          content:
            text/plain:
              schema:
                type: string
              examples:
                invalidBody:
                  value: "Failed to read request body"
                invalidJson:
                  value: "Invalid JSON body"
        '404':
          description: Cell not found
          content:
            text/plain:
              schema:
                type: string
              example: "Cell not found"
        '500':
          description: Failed to write file
          content:
            text/plain:
              schema:
                type: string

  /api/cells/{cellId}/git/status:
    get:
      summary: Get Git status
      description: Retrieves the Git status for a cell's directory
      operationId: getGitStatus
      tags:
        - Git
      parameters:
        - name: cellId
          in: path
          required: true
          description: ID of the cell
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved Git status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitStatus'
              example:
                branch: "main"
                clean: false
                files:
                  - path: "modified.txt"
                    status: "M"
                  - path: "new-file.txt"
                    status: "?"
                ahead: 2
                behind: 0
                hasRemote: true
        '404':
          description: Cell not found
          content:
            text/plain:
              schema:
                type: string
              example: "Cell not found"
        '500':
          description: Failed to get Git status
          content:
            text/plain:
              schema:
                type: string

  /api/cells/{cellId}/git/diff:
    get:
      summary: Get Git diff
      description: Retrieves the diff of uncommitted changes in a cell's directory
      operationId: getGitDiff
      tags:
        - Git
      parameters:
        - name: cellId
          in: path
          required: true
          description: ID of the cell
          schema:
            type: string
        - name: staged
          in: query
          required: false
          description: Whether to show staged changes only
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successfully retrieved diff
          content:
            text/plain:
              schema:
                type: string
              example: |
                diff --git a/file.txt b/file.txt
                index 1234567..abcdefg 100644
                --- a/file.txt
                +++ b/file.txt
                @@ -1,3 +1,3 @@
                -Old line
                +New line
                 Unchanged line
        '404':
          description: Cell not found
          content:
            text/plain:
              schema:
                type: string
              example: "Cell not found"
        '500':
          description: Failed to get diff
          content:
            text/plain:
              schema:
                type: string

  /api/cells/{cellId}/git/history:
    get:
      summary: Get Git commit history
      description: Retrieves the commit history for a cell's directory
      operationId: getGitHistory
      tags:
        - Git
      parameters:
        - name: cellId
          in: path
          required: true
          description: ID of the cell
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of commits to retrieve
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        '200':
          description: Successfully retrieved commit history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GitCommit'
              example:
                - hash: "a1b2c3d4e5f6789012345678901234567890abcd"
                  shortHash: "a1b2c3d"
                  author: "John Doe <john@example.com>"
                  date: "2024-01-15T10:30:00Z"
                  message: "Add new feature"
                - hash: "b2c3d4e5f67890123456789012345678901abcde"
                  shortHash: "b2c3d4e"
                  author: "Jane Smith <jane@example.com>"
                  date: "2024-01-14T15:45:00Z"
                  message: "Fix bug in module"
        '404':
          description: Cell not found
          content:
            text/plain:
              schema:
                type: string
              example: "Cell not found"
        '500':
          description: Failed to get history
          content:
            text/plain:
              schema:
                type: string

  /api/cells/{cellId}/git/commit:
    post:
      summary: Create Git commit
      description: Creates a new Git commit with optional file staging
      operationId: createGitCommit
      tags:
        - Git
      parameters:
        - name: cellId
          in: path
          required: true
          description: ID of the cell
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: Commit message
                files:
                  type: array
                  items:
                    type: string
                  description: Optional list of files to stage before committing
            example:
              message: "Update configuration files"
              files:
                - "config.json"
                - "settings.yaml"
      responses:
        '200':
          description: Commit created successfully
        '400':
          description: Invalid request
          content:
            text/plain:
              schema:
                type: string
              examples:
                invalidJson:
                  value: "Invalid JSON"
                missingMessage:
                  value: "Commit message is required"
        '404':
          description: Cell not found
          content:
            text/plain:
              schema:
                type: string
              example: "Cell not found"
        '500':
          description: Failed to create commit
          content:
            text/plain:
              schema:
                type: string

  /api/cells/{cellId}/container/status:
    get:
      summary: Get container status
      description: Retrieves the status of a container associated with a cell
      operationId: getContainerStatus
      tags:
        - Container
      parameters:
        - name: cellId
          in: path
          required: true
          description: ID of the cell
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved container status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/ContainerStatus'
                  containerId:
                    type: string
                    description: Container ID (if exists)
                  hasDevcontainer:
                    type: boolean
                    description: Whether a devcontainer.json file exists
                  devcontainerContent:
                    type: string
                    description: Content of the devcontainer.json file (if exists)
              examples:
                noContainer:
                  value:
                    status: "none"
                runningContainer:
                  value:
                    status: "running"
                    containerId: "abc123def456"
        '500':
          description: Failed to get container status
          content:
            text/plain:
              schema:
                type: string

  /api/cells/{cellId}/container/create:
    post:
      summary: Create container
      description: Creates a new devcontainer for the specified cell
      operationId: createContainer
      tags:
        - Container
      parameters:
        - name: cellId
          in: path
          required: true
          description: ID of the cell
          schema:
            type: string
      responses:
        '200':
          description: Container created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  containerId:
                    type: string
                    description: ID of the created container
              example:
                containerId: "abc123def456"
        '404':
          description: Cell not found
          content:
            text/plain:
              schema:
                type: string
              example: "Cell not found"
        '500':
          description: Failed to create container
          content:
            text/plain:
              schema:
                type: string
              examples:
                createError:
                  value: "Failed to create container"
                saveError:
                  value: "Failed to save container ID"

  /api/cells/{cellId}/container/start:
    post:
      summary: Start container
      description: Starts an existing container
      operationId: startContainer
      tags:
        - Container
      parameters:
        - name: cellId
          in: path
          required: true
          description: ID of the cell
          schema:
            type: string
      responses:
        '200':
          description: Container started successfully
        '404':
          description: Container not found
          content:
            text/plain:
              schema:
                type: string
              example: "Container not found"
        '500':
          description: Failed to start container
          content:
            text/plain:
              schema:
                type: string

  /api/cells/{cellId}/container/stop:
    post:
      summary: Stop container
      description: Stops a running container
      operationId: stopContainer
      tags:
        - Container
      parameters:
        - name: cellId
          in: path
          required: true
          description: ID of the cell
          schema:
            type: string
      responses:
        '200':
          description: Container stopped successfully
        '404':
          description: Container not found
          content:
            text/plain:
              schema:
                type: string
              example: "Container not found"
        '500':
          description: Failed to stop container
          content:
            text/plain:
              schema:
                type: string

  /api/cells/{cellId}/container/restart:
    post:
      summary: Restart container
      description: Restarts a container
      operationId: restartContainer
      tags:
        - Container
      parameters:
        - name: cellId
          in: path
          required: true
          description: ID of the cell
          schema:
            type: string
      responses:
        '200':
          description: Container restarted successfully
        '404':
          description: Container not found
          content:
            text/plain:
              schema:
                type: string
              example: "Container not found"
        '500':
          description: Failed to restart container
          content:
            text/plain:
              schema:
                type: string

  /api/cells/{cellId}/container/reset:
    post:
      summary: Reset container
      description: Removes a container and clears its association with the cell
      operationId: resetContainer
      tags:
        - Container
      parameters:
        - name: cellId
          in: path
          required: true
          description: ID of the cell
          schema:
            type: string
      responses:
        '200':
          description: Container reset successfully
        '404':
          description: Container not found
          content:
            text/plain:
              schema:
                type: string
              example: "Container not found"
        '500':
          description: Failed to reset container
          content:
            text/plain:
              schema:
                type: string
              examples:
                removeError:
                  value: "Failed to remove container"
                deleteError:
                  value: "Failed to delete container ID"

  /api/cells/{cellId}/container/devcontainer:
    put:
      summary: Update devcontainer configuration
      description: Updates or creates the devcontainer.json file for a cell
      operationId: updateDevcontainer
      tags:
        - Container
      parameters:
        - name: cellId
          in: path
          required: true
          description: ID of the cell
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: JSON content for the devcontainer.json file
              required:
                - content
      responses:
        '200':
          description: Devcontainer configuration updated successfully
        '400':
          description: Invalid request body or JSON content
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Cell not found
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Failed to update devcontainer configuration
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    Cell:
      type: object
      required:
        - id
        - name
        - path
        - type
        - dependencies
      properties:
        id:
          type: string
          description: Unique identifier for the cell
        name:
          type: string
          description: Display name of the cell
        path:
          type: string
          description: File system path to the cell directory
        type:
          type: string
          description: Type of cell (e.g., module, library)
        dependencies:
          type: array
          items:
            type: string
          description: List of cell IDs this cell depends on

    Edge:
      type: object
      required:
        - id
        - source
        - target
      properties:
        id:
          type: string
          description: Unique identifier for the edge
        source:
          type: string
          description: Cell ID of the source (from)
        target:
          type: string
          description: Cell ID of the target (to)

    Graph:
      type: object
      required:
        - cells
        - edges
      properties:
        cells:
          type: array
          items:
            $ref: '#/components/schemas/Cell'
          description: List of all cells in the graph
        edges:
          type: array
          items:
            $ref: '#/components/schemas/Edge'
          description: List of all edges (dependencies) in the graph

    Position:
      type: object
      required:
        - cellId
        - x
        - y
      properties:
        cellId:
          type: string
          description: ID of the cell this position belongs to
        x:
          type: number
          format: double
          description: X coordinate in the UI
        y:
          type: number
          format: double
          description: Y coordinate in the UI

    FileInfo:
      type: object
      required:
        - name
        - path
        - isDir
        - size
        - type
      properties:
        name:
          type: string
          description: File or directory name
        path:
          type: string
          description: Relative path from cell directory
        isDir:
          type: boolean
          description: Whether this is a directory
        size:
          type: integer
          format: int64
          description: File size in bytes (0 for directories)
        type:
          type: string
          description: File type or MIME type

    GitStatus:
      type: object
      required:
        - branch
        - clean
        - files
        - ahead
        - behind
        - hasRemote
      properties:
        branch:
          type: string
          description: Current Git branch name
        clean:
          type: boolean
          description: Whether the working directory is clean
        files:
          type: array
          items:
            $ref: '#/components/schemas/GitStatusFile'
          description: List of modified files
        ahead:
          type: integer
          description: Number of commits ahead of remote
        behind:
          type: integer
          description: Number of commits behind remote
        hasRemote:
          type: boolean
          description: Whether a remote is configured

    GitStatusFile:
      type: object
      required:
        - path
        - status
      properties:
        path:
          type: string
          description: File path relative to repository root
        status:
          type: string
          description: Git status code (M=modified, A=added, D=deleted, ?=untracked, etc.)
          enum: ["M", "A", "D", "?", "R", "C", "U"]

    GitCommit:
      type: object
      required:
        - hash
        - shortHash
        - author
        - date
        - message
      properties:
        hash:
          type: string
          description: Full commit hash
        shortHash:
          type: string
          description: Abbreviated commit hash
        author:
          type: string
          description: Commit author name and email
        date:
          type: string
          format: date-time
          description: Commit timestamp
        message:
          type: string
          description: Commit message

    ContainerStatus:
      type: string
      enum: ["none", "stopped", "running", "error"]
      description: Current container status

tags:
  - name: Graph
    description: Operations related to the dependency graph
  - name: Positions
    description: Operations for managing cell positions in the UI
  - name: Files
    description: File system operations within cell directories
  - name: Git
    description: Git repository operations for cells
  - name: Container
    description: DevContainer lifecycle management