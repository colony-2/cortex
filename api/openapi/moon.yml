id: 'api-openapi'
type: 'unknown'
language: 'openapi'
project:
  name: 'api-openapi'
  description: 'OpenAPI specifications for the colony2 API'

fileGroups:
  specs:
    - '**/*.yaml'
    - '**/*.yml'
  docs:
    - '**/*.md'

tasks:
  build:
    command: 'echo'
    args: ['OpenAPI spec is ready']
    inputs:
      - 'colony2-api.yaml'
    outputs:
      - 'colony2-api.yaml'
    options:
      runInCI: true
      outputStyle: buffer-only-failure
