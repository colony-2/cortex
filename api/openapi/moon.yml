id: 'api-openapi'
type: 'unknown'

project:
  name: 'api-openapi'
  description: 'OpenAPI specifications for the vibethis API'

fileGroups:
  specs:
    - '**/*.yaml'
    - '**/*.yml'
  docs:
    - '**/*.md'

tasks:
  build:
    command: 'echo'
    args: ['OpenAPI spec is ready']
    outputs:
      - 'vibethis-api.yaml'