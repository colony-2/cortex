id: 'fe-openapi'
type: 'library'
language: 'typescript'

project:
  name: 'web-openapi'
  description: 'Generated TypeScript client from OpenAPI specification'

tasks:
  remove-files:
    script: |
      set -e
      rm -f ./colony2-api.yaml
      rm -rf src/generated
      mkdir -p src/generated
  build:
    platform: system
    script: |
      pnpm exec openapi --input $workspaceRoot/api/openapi/colony2-api.yaml --output ./src/generated --client fetch 
      pnpm exec tsup src/generated/index.ts --format cjs,esm --clean --silent
      npx tsc --emitDeclarationOnly
    deps:
      - 'api-openapi:build'
      - '~:remove-files'
    inputs:
      - './colony2-api.yaml'
    outputs:
      - 'src/generated/**/*'

  test:
    command: 'true'

