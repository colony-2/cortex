id: 'fe-openapi'
type: 'library'
language: 'typescript'

project:
  name: 'web-openapi'
  description: 'Generated TypeScript client from OpenAPI specification'

tasks:
  build:
    platform: system
    script: |
      set -e
      rm -rf src/generated dist tsconfig.tsbuildinfo
      mkdir -p src/generated
      pnpm exec openapi --input $workspaceRoot/api/openapi/colony2-api.yaml --output ./src/generated --client fetch
      pnpm exec tsup src/index.ts --format cjs,esm --clean
      pnpm exec tsc --emitDeclarationOnly
    deps:
      - 'api-openapi:build'
    inputs:
      - '/api/openapi/colony2-api.yaml'
    outputs:
      - 'src/generated/**/*'
      - 'dist/**'

  test:
    command: 'true'

