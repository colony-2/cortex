id: 'fe-openapi'
type: 'library'
language: 'typescript'

project:
  name: 'web-openapi'
  description: 'Generated TypeScript client from OpenAPI specification'

tasks:
  # Override the global test task since this package has no tests
  test:
    command: 'true'
    platform: system
    
  build:
    script: |
      rm -rf src/generated
      npx openapi-typescript-codegen --input ../../api/openapi/colony2-api.yaml --output ./src/generated --client axios
      npx tsup src/index.ts --format cjs,esm --clean --silent
      npx tsc --emitDeclarationOnly
    inputs:
      - 'src/**/*.ts'
      - 'tsconfig.json'
      - 'package.json'
    outputs:
      - 'src/generated/**/*'
      - 'dist/**/*'
    deps:
      - 'api-openapi:build'
    platform: system
    options:
      runInCI: true
      outputStyle: buffer-only-failure
