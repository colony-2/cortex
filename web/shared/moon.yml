id: 'ui-shared'
# https://moonrepo.dev/docs/config/project
$schema: '../../../.moon/cache/schemas/project.json'


project:
  name: 'web-shared'
  description: 'Shared utilities and types'
  channel: '#frontend'


workspace:
  inheritedTasks:
    exclude: ['build']

language: 'typescript'
type: 'library'

tags:
  - 'frontend'
  - 'library'
  - 'shared'

tasks:
  build:
    deps:
      - '~:compile'
      - '~:bundle'
    options:
      runInCI: true
      outputStyle: buffer-only-failure
  
  compile:
    script: |
      set -e
      'tsc'
    inputs:
      - 'src/**/*' 
      - 'tsconfig.json'
    outputs:
      - 'dist/src/**'
    env:
      NODE_ENV: 'production'
    options:
      runInCI: true
      outputStyle: buffer-only-failure
      
  bundle:
    platform: system
    command: vite
    args: [build, --logLevel, warn, --emptyOutDir]
    deps:
      - '~:compile'
    inputs:
      - 'src/**/*'
      - 'vite.config.ts'
    outputs:
      - 'dist/**'
    options:
      runInCI: true
      outputStyle: buffer-only-failure

  lint:
    command: 'eslint'
    args:
      - 'src'
    platform: 'node'
    options:
      runInCI: true
      outputStyle: buffer-only-failure