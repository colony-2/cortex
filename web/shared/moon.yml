# https://moonrepo.dev/docs/config/project
$schema: '../../../.moon/cache/schemas/project.json'

project:
  name: 'web-shared'
  description: 'Shared utilities and types'
  channel: '#frontend'
  
language: 'typescript'
type: 'library'

tags:
  - 'frontend'
  - 'library'
  - 'shared'

tasks:
  build:
    deps:
      - '~:compile'
      - '~:bundle'
  
  compile:
    command: 'tsc'
    platform: 'node'
    inputs:
      - 'src/**/*' 
      - 'tsconfig.json'
    outputs:
      - 'dist/src/**'
    env:
      NODE_ENV: 'production'
    options:
      runInCI: true
      
  bundle:
    command: vite
    args: [build, --logLevel, warn]
    deps:
      - '~:compile'
    inputs:
      - 'src/**/*'
      - 'vite.config.ts'
    outputs:
      - 'dist/**'
    options:
      runInCI: true

  test:
    command: 'npx'
    args: ['vitest', 'run', 'src']
    platform: 'node'
    inputs:
      - 'src/**/*.test.ts'
      - 'src/**/*.test.tsx'
      - 'vite.config.ts'

  lint:
    command: 'eslint'
    args:
      - 'src'
    platform: 'node'