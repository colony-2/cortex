id: ui-app
project:
  description: Main React application that orchestrates the graph visualization interface.

tasks:
  build:
    deps:
      - ui-config:build
      - ui-changes:build
      - ui-files:build
      - ui-flowchart:build
      - shared:build
  e2e:
    command: npx
    args: [playwright, test, --reporter=list]
    inputs:
      - tests/**/*
      - playwright.config.ts
      - '@group(lockfile)'
    platform: node
    options:
      runInCI: true
    deps:
      - 'be-api:build-test-server'
  serve:
    command: vite
    args: [dev]
    local: true
    platform: node      
