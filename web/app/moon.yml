id: ui-app
project:
  description: Main React application that orchestrates the graph visualization interface.

tasks:
  build:
    deps:
      - ui-flowchart:build
      - ui-kanban:build
      - ui-shared:build
  integration2:
    command: pnpm
    args: [exec, playwright, test, --reporter=list]
    inputs:
      - tests/**/*
      - playwright.config.ts
      - '@group(lockfile)'
    platform: node
    options:
      runInCI: true
      outputStyle: buffer-only-failure
    deps:
      - 'be-api:build-test-server'
  serve:
    command: vite
    args: [dev]
    local: true
    platform: node
