          "request": {
            "review_id": "${{ context.workflow.job_id + \"/review-thread\" }}",
            "title": "Keep unsent drafts",
            "question": "Approve this direction so detailed planning can begin?",
            "documents": {
              "design": "${{ sequence.draft.artifacts[\"design.md\"] }}",
              "recovery": "${{ sequence.draft.artifacts[\"recovery.md\"] }}"
            },
            "document_metadata": {
              "design": {
                "title": "Proposed direction",
                "role": "primary",
                "order": 0
              },
              "recovery": {
                "title": "Recovery notes",
                "role": "supporting",
                "order": 1
              }
            },
            "overview_document_id": "design",
