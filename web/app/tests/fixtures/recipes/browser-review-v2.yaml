              {
                "id": "approve",
                "label": "Approve direction",
                "continues_review": false,
                "feedback_mode": "forbidden",
                "allow_attachments": false
              },
              {
                "id": "question",
                "label": "Ask a question",
                "continues_review": true,
                "feedback_mode": "required",
                "allow_attachments": true
              },
              {
                "id": "annotate",
                "label": "Review doc comments",
                "feedback_mode": "required",
                "allow_attachments": true,
                "continues_review": false
              },
              {
                "id": "revise",
                "label": "Request changes",
                "continues_review": false,
                "feedback_mode": "required",
                "allow_attachments": true
              }
            ],
            "feedback": {
              "label": "Question or requested change"
            },
            "settings": [
              {
                "id": "response_style",
                "control": "choice",
                "label": "Response style",
                "value": "detailed",
                "default": "brief",
                "reset_label": "Use brief answers",
                "choices": [
                  {
                    "value": "brief",
                    "label": "Brief"
                  },
                  {
                    "value": "detailed",
                    "label": "Detailed"
                  }
                ],
                "schema": {
                  "type": "string",
                  "enum": [
                    "brief",
                    "detailed"
                  ]
                },
                "applies_to": [
                  "approve",
                  "question",
                  "revise"
                ],
                "effect": "Selects the brief or detailed final report template."
              },
              {
                "id": "context_hint",
                "control": "text",
                "label": "Context hint",
                "value": "release",
                "default": null,
                "reset_label": "Use default context",
                "schema": {
                  "type": [
                    "string",
                    "null"
                  ],
                  "minLength": 1,
                  "pattern": "[^\t-\r    -     　﻿]"
                },
                "applies_to": [
                  "question"
                ],
                "effect": "Carries nullable context to the next response."
              },
              {
                "id": "citations",
                "control": "boolean",
                "label": "Include citations",
                "value": true,
                "default": false,
                "reset_label": "No citations",
                "schema": {
                  "type": "boolean"
                },
                "applies_to": [
                  "question"
                ],
                "effect": "Includes report citations."
              },
              {
                "id": "examples",
                "control": "number",
                "label": "Example count",
