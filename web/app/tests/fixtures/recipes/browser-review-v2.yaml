{
  "id": "browser-input",
  "version": "1.0",
  "input_schema": {
    "prompt": {
      "type": "string",
      "default_value": ""
    }
  },
  "sequence": [
    {
      "id": "draft",
      "op": "command_execution",
      "inputs": {
        "working_directory": "{{ context.environment.op.outbox }}",
        "run": "printf '# Keep unsent drafts\\n\\nOriginal material remains readable while questions are answered.\\n' > design.md\nprintf '# Recovery\\n\\nSaved drafts survive a restart.\\n' > recovery.md"
      }
    },
    {
      "id": "first",
      "op": "input",
