id: browser-input
version: "1.0"
input_schema:
  prompt:
    type: string
    default_value: ""
sequence:
  - id: draft
    op: command_execution
    inputs:
      working_directory: "{{ context.environment.op.outbox }}"
      run: |
        printf '# Design\n\n**Immutable original**\n\n| Choice | Result |\n| --- | --- |\n| Approve | Continue |\n' > design.md
        printf '# Rollout\n\n- [ ] Verify recovery\n' > rollout.md
  - id: review
    op: input
    inputs:
      form:
        kind: review
        title: Review the release
        documents:
          design: '${{ sequence.draft.artifacts["design.md"] }}'
          rollout: '${{ sequence.draft.artifacts["rollout.md"] }}'
        fields:
          - id: decision
            type: multiple_choice
            question: |
              Resolve questions and review findings before implementation.

              Design:
              {"next":"ask_user","summary":"Should this proposal become the initial mandate?"}

              Design review:
              {}

              How should we proceed? Uploaded edits require another revision and review.
            required: true
            options:
              - {value: revise, label: Revise the plan}
          - id: feedback
            type: paragraph_text
            question: Feedback or answers to open questions. Select a revision decision to request changes.
          - id: annotation
            type: file_upload
            question: Attach feedback document
outputs:
  answers: "${{ sequence.review.outputs.fields }}"
  receipt: "${{ sequence.review.outputs.receipt }}"
  artifact_refs: "${{ sequence.review.outputs.artifact_refs }}"
