id: repro-input-consume
version: 0.1.0
desc: "Repro: can a command state read input state outputs"
state:
  initial: ask
  states:
    ask:
      op: input
      transitions:
        - to: show
          when: "true"
      inputs:
        form:
          title: "Repro input consume"
          question: "Type APPROVE"
          type: short_answer
    show:
      op: command_execution
      inputs:
        run: |
          set -euo pipefail
          echo '{{ string(states.ask.outputs) }}'
outputs:
  show_stdout: "{{ 'show' in states && has(states.show.outputs.stdout) ? states.show.outputs.stdout : \"\" }}"
