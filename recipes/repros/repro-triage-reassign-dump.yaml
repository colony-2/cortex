id: repro-triage-reassign-dump
state:
  initial: triage
  states:
    triage:
      op: recipe.run_and_get_result
      inputs:
        name: new-ticket-triage
        inputs:
          title: "UI checkout broken"
          description: "Checkout button is unresponsive in Safari 17.4; other browsers OK"
      transitions:
        - to: reassign_create
          when: "!outputs.outputs.cell_is_appropriate && outputs.outputs.recommended_cell_is_valid"
        - to: done
          when: "outputs.outputs.cell_is_appropriate"
    reassign_create:
      op: ticket.manage
      transitions:
        - to: done
          when: "true"
      inputs:
        actions:
          - type: create_ticket
            project_id: "{{ context.workflow.project_id }}"
            cell: "{{ states.triage.outputs.outputs.recommended_cell_final }}"
            title: "UI checkout broken"
            description: "Created by repro"
            stage: open
            state: working
    done:
      op: command_execution
      inputs:
        run: "echo done"
outputs:
  states_json: '{{ string(states) }}'
  triage_outputs_json: '{{ has(states.triage) ? string(states.triage.outputs) : "" }}'
  created_ticket_id: '{{ "reassign_create" in states && size(states.reassign_create.outputs.results) > 0 ? states.reassign_create.outputs.results[0].ticket.id : "" }}'
  created_ticket_cell: '{{ "reassign_create" in states && size(states.reassign_create.outputs.results) > 0 ? states.reassign_create.outputs.results[0].ticket.cell_name : "" }}'
