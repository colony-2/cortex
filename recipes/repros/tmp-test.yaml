id: tmp-test
sequence:
  - id: call
    op: llm_inference2
    inputs:
      default_provider: openai
      default_model: gpt-4.1
      temperature: 0
      tools: []
      response_schema:
        type: object
        properties:
          ok:
            type: boolean
          note:
            type: string
        required: [ok, note]
        additionalProperties: false
      system_prompt: "Return ONLY JSON"
      prompt: "say ok true"
outputs:
  ok: "{{ json_parse(sequence.call.outputs.response).ok }}"
