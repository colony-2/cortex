id: repro-input-transition-scope
version: 0.1.0
desc: "Repro: which transition condition works for input outputs"
state:
  initial: ask
  states:
    ask:
      op: input
      transitions:
        - to: via_states
          when: "states.ask.outputs.fields.response == \"APPROVE\""
        - to: via_outputs
          when: "outputs.fields.response == \"APPROVE\""
        - to: rejected
          when: "true"
      inputs:
        form:
          title: "Repro input transition scope"
          question: "Type APPROVE"
          type: short_answer
    via_outputs:
      op: command_execution
      inputs:
        run: "echo via_outputs"
    via_states:
      op: command_execution
      inputs:
        run: "echo via_states"
    rejected:
      op: command_execution
      inputs:
        run: "echo rejected"
outputs:
  has_via_outputs: "{{ 'via_outputs' in states }}"
  has_via_states: "{{ 'via_states' in states }}"
  has_rejected: "{{ 'rejected' in states }}"
  ask_outputs_string: "{{ string(states.ask.outputs) }}"
