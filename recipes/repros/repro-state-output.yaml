id: repro-state-output
state:
  initial: triage
  states:
    triage:
      op: recipe.run_and_get_result
      inputs:
        name: new-ticket-triage
        inputs:
          title: "Test"
          description: "Desc"
      transitions:
        - to: done
  outputs:
    cell_ok: "{{ states.triage.outputs.outputs.cell_is_appropriate }}"
    rec_cell: "{{ states.triage.outputs.outputs.recommended_cell }}"
    rationale: "{{ states.triage.outputs.outputs.rationale }}"
