id: repro-input-block
version: 0.1.0
desc: "Repro: input op should create a pending input request"
state:
  initial: ask
  states:
    ask:
      op: input
      transitions:
        - to: done
          when: "true"
      inputs:
        form:
          title: "Repro input"
          question: "Type anything"
          type: short_answer
    done:
      op: command_execution
      inputs:
        run: "echo done"
outputs:
  ask_response: "{{ states.ask.outputs.response }}"
  ask_fields: "{{ states.ask.outputs.fields }}"
  ask_outputs_string: "{{ string(states.ask.outputs) }}"
