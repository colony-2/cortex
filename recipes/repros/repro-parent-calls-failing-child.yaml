id: repro-parent-calls-failing-child
state:
  initial: call
  states:
    call:
      op: recipe.run_and_get_result
      inputs:
        name: repro-child-fails
        inputs: {}
      transitions:
        - to: done
          when: "true"
    done:
      op: command_execution
      inputs:
        run: "echo parent-done"
outputs:
  done: "{{ states.done.outputs.stdout }}"
