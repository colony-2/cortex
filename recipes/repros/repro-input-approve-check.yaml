id: repro-input-approve-check
version: 0.1.0
desc: "Repro: parse input outputs in command_execution and exit 0 on APPROVE"
state:
  initial: ask
  states:
    ask:
      op: input
      transitions:
        - to: check
          when: "true"
      inputs:
        form:
          title: "Repro approve check"
          question: "Type APPROVE"
          type: short_answer
    check:
      op: command_execution
      inputs:
        run: |
          set -euo pipefail
          OUT="{{ context.environment.outbox }}"
          mkdir -p "$OUT"
          cat > "$OUT/input.json" <<'EOF'
          {{ string(states.ask.outputs) }}
          EOF
          set +e
          RESP=$(
            python3 - <<'PY'
          import json,sys
          from pathlib import Path
          p = Path("{{ context.environment.outbox }}") / "input.json"
          j = json.loads(p.read_text(encoding="utf-8"))
          resp = str((j.get("fields") or {}).get("response") or "").strip()
          print(resp)
          sys.exit(0 if resp.upper().startswith("APPROVE") else 1)
          PY
          )
          PY_STATUS=$?
          set -e
          echo "$RESP"
          exit $PY_STATUS
outputs:
  check_exit_code: "{{ 'check' in states && has(states.check.outputs.exit_code) ? states.check.outputs.exit_code : -1 }}"
  check_stdout: "{{ 'check' in states && has(states.check.outputs.stdout) ? states.check.outputs.stdout : \"\" }}"
