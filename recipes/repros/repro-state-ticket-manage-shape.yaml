id: repro-state-ticket-manage-shape
state:
  initial: a
  states:
    a:
      op: ticket.manage
      inputs:
        actions:
          - type: create_ticket
            project_id: "{{ context.workflow.project_id }}"
            cell: "ui-app"
            title: "State create"
            description: "Repro"
            stage: open
            state: working
outputs:
  states_json: '{{ string(states) }}'
  has_a: '{{ "a" in states }}'
  a_outputs_json: '{{ has(states.a) ? string(states.a.outputs) : "" }}'
