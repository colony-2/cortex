id: new-ticket
version: 0.6.0
desc: "Ticket recipe: triage → requirements → implementation planning → outcome determination → implement/validate/merge"
input_schema:
  title:
    type: string
    required: false
  description:
    type: string
    required: false
  validate_commands:
    type: string
    required: false
  local_hash:
    type: string
    required: false
  upstream_repo:
    type: string
    required: false
  upstream_branch:
    type: string
    required: false
inputs:
  title: '${{ has(inputs.title) ? inputs.title : "" }}'
  description: '${{ has(inputs.description) ? inputs.description : "" }}'
  validate_commands: '${{ has(inputs.validate_commands) ? inputs.validate_commands : "" }}'
  local_hash: '${{ has(inputs.local_hash) && inputs.local_hash != "" ? inputs.local_hash : (has(context.git.hash) ? context.git.hash : "") }}'
  upstream_repo: '${{ has(inputs.upstream_repo) && inputs.upstream_repo != "" ? inputs.upstream_repo : (has(context.git.repo) ? context.git.repo : "") }}'
  upstream_branch: '${{ has(inputs.upstream_branch) && inputs.upstream_branch != "" ? inputs.upstream_branch : (has(context.git.ref) ? context.git.ref : "") }}'
state:
  initial: triage
  states:
    triage:
      op: recipe.run_and_get_result
      transitions:
        - to: reassign_create
          when: 'has(context.ticket.id) && context.ticket.id != "" && !outputs.outputs.cell_is_appropriate && outputs.outputs.recommended_cell_is_valid'
        - to: requirements_planning
          when: "true"
      inputs:
        name: new-ticket-triage
        inputs:
          title: >-
            ${{
              (has(inputs.title) && inputs.title != "")
                ? inputs.title
                : ((has(context.ticket.title) && context.ticket.title != "") ? context.ticket.title : "")
            }}
          description: >-
            ${{
              (has(inputs.description) && inputs.description != "")
                ? inputs.description
                : ((has(context.ticket.description) && context.ticket.description != "") ? context.ticket.description : "")
            }}

    reassign_create:
      op: ticket.manage
      when: 'has(context.ticket.id) && context.ticket.id != ""'
      transitions:
        - to: reassign_annotate
          when: "true"
      inputs:
        actions:
          - type: create_ticket
            project_id: "{{ context.workflow.project_id }}"
            cell: '${{ "triage" in states ? states.triage.outputs.outputs.recommended_cell_final : context.workflow.cell }}'
            title: "${{ (has(inputs.title) && inputs.title != \"\") ? inputs.title : (has(context.ticket.title) ? context.ticket.title : \"\") }}"
            description: "${{ (has(inputs.description) && inputs.description != \"\") ? inputs.description : (has(context.ticket.description) ? context.ticket.description : \"\") }}"
            stage: open
            state: working

    reassign_annotate:
      op: ticket.manage
      when: 'has(context.ticket.id) && context.ticket.id != ""'
      transitions: []
      inputs:
        actions:
          - type: append_ticket_note
            ticket_id: "{{ context.ticket.id }}"
            note: '${{ "Reassigned to cell \"" + ("triage" in states ? states.triage.outputs.outputs.recommended_cell_final : "") + "\". Created new ticket " + (size(states.reassign_create.outputs.results) > 0 ? states.reassign_create.outputs.results[0].ticket.id : "(unknown)") + "." }}'
          - type: update_ticket
            ticket_id: "{{ context.ticket.id }}"
            state: waiting_user

    requirements_planning:
      op: recipe.run_and_get_result
      transitions:
        - to: requirements_blocked_feedback
          when: "has(outputs.api_review_ok) && !outputs.api_review_ok"
        - to: requirements_decision
          when: "true"
      inputs:
        name: new-ticket-requirements-planning
        artifacts: >-
          ${{
            ("requirements_planning" in states)
              ? [
                  "requirements/plan.json",
                  "requirements/api-review.json"
                ]
              : []
          }}
        inputs:
          title: >-
            ${{
              (has(inputs.title) && inputs.title != "")
                ? inputs.title
                : ((has(context.ticket.title) && context.ticket.title != "") ? context.ticket.title : "")
            }}
          description: >-
            ${{
              (has(inputs.description) && inputs.description != "")
                ? inputs.description
                : ((has(context.ticket.description) && context.ticket.description != "") ? context.ticket.description : "")
            }}
          user_feedback: >-
            ${{
              ("requirements_feedback" in states && has(states.requirements_feedback.outputs.response))
                ? states.requirements_feedback.outputs.response
                : (("requirements_blocked_feedback" in states && has(states.requirements_blocked_feedback.outputs.response)) ? states.requirements_blocked_feedback.outputs.response : "")
            }}

    requirements_blocked_feedback:
      op: input
      transitions:
        - to: requirements_planning
          when: "true"
      inputs:
        form:
          title: "API review blocking"
          question: |
            Requirements bundle has been generated as artifacts under `requirements/` (see `requirements/index.md`).

            Summary:
            ${{ "requirements_planning" in states ? states.requirements_planning.outputs.outputs.summary : "" }}

            Notes for review:
            ${{ "requirements_planning" in states ? states.requirements_planning.outputs.outputs.notes_for_user_review : "" }}

            Dependency order:
            ${{ "requirements_planning" in states ? states.requirements_planning.outputs.outputs.dependency_order : [] }}

            Contrarian API review:
            ok=${{ "requirements_planning" in states ? states.requirements_planning.outputs.outputs.api_review_ok : false }}
            blocking_issues=${{ "requirements_planning" in states ? states.requirements_planning.outputs.outputs.api_review_blocking_issues : [] }}

            Feedback:
            ${{ "requirements_planning" in states ? states.requirements_planning.outputs.outputs.api_review_feedback : "" }}

            Provide feedback to revise the requirements bundle.
          type: paragraph_text

    requirements_decision:
      op: input
      transitions:
        - to: implementation_planning
          when: 'has(outputs.response) && outputs.response == "approve"'
        - to: requirements_feedback
          when: "true"
      inputs:
        form:
          title: "Requirements review"
          question: |
            Requirements bundle has been generated as artifacts under `requirements/` (see `requirements/index.md`).

            Summary:
            ${{ "requirements_planning" in states ? states.requirements_planning.outputs.outputs.summary : "" }}

            Notes for review:
            ${{ "requirements_planning" in states ? states.requirements_planning.outputs.outputs.notes_for_user_review : "" }}

            Prior user feedback applied (from last loop, if any):
            ${{ "requirements_feedback" in states && has(states.requirements_feedback.outputs.response) ? states.requirements_feedback.outputs.response : "" }}

            Dependency order:
            ${{ "requirements_planning" in states ? states.requirements_planning.outputs.outputs.dependency_order : [] }}

            Contrarian API review:
            ok=${{ "requirements_planning" in states ? states.requirements_planning.outputs.outputs.api_review_ok : false }}
            blocking_issues=${{ "requirements_planning" in states ? states.requirements_planning.outputs.outputs.api_review_blocking_issues : [] }}

            Feedback:
            ${{ "requirements_planning" in states ? states.requirements_planning.outputs.outputs.api_review_feedback : "" }}
          type: multiple_choice
          options:
            - value: approve
              label: Approve
            - value: revise
              label: Revise

    requirements_feedback:
      op: input
      transitions:
        - to: requirements_planning
          when: "true"
      inputs:
        form:
          title: "Requirements feedback"
          question: "What should change in the requirements bundle?"
          type: paragraph_text

    implementation_planning:
      op: recipe.run_and_get_result
      transitions:
        - to: implementation_planning_blocked_feedback
          when: "has(outputs.compat_review_ok) && !outputs.compat_review_ok"
        - to: implementation_planning_decision
          when: "true"
      inputs:
        name: new-ticket-implementation-planning
        artifacts:
          - '${{ states.requirements_planning.artifacts["requirements/plan.json"] }}'
          - '${{ states.requirements_planning.artifacts["requirements/index.md"] }}'
        inputs:
          title: >-
            ${{
              (has(inputs.title) && inputs.title != "")
                ? inputs.title
                : ((has(context.ticket.title) && context.ticket.title != "") ? context.ticket.title : "")
            }}
          description: >-
            ${{
              (has(inputs.description) && inputs.description != "")
                ? inputs.description
                : ((has(context.ticket.description) && context.ticket.description != "") ? context.ticket.description : "")
            }}
          user_feedback: >-
            ${{
              ("implementation_planning_feedback" in states && has(states.implementation_planning_feedback.outputs.response))
                ? states.implementation_planning_feedback.outputs.response
                : (("implementation_planning_blocked_feedback" in states && has(states.implementation_planning_blocked_feedback.outputs.response)) ? states.implementation_planning_blocked_feedback.outputs.response : "")
            }}

    implementation_planning_blocked_feedback:
      op: input
      transitions:
        - to: implementation_planning
          when: "true"
      inputs:
        form:
          title: "Implementation planning blocked"
          question: |
            Implementation planning artifacts are available under `implementation/` (see `implementation/index.md`).

            Summary:
            ${{ "implementation_planning" in states ? states.implementation_planning.outputs.outputs.summary : "" }}

            Notes for review:
            ${{ "implementation_planning" in states ? states.implementation_planning.outputs.outputs.notes_for_user_review : "" }}

            Dependency order:
            ${{ "implementation_planning" in states ? states.implementation_planning.outputs.outputs.dependency_order : [] }}

            Compatibility review:
            ok=${{ "implementation_planning" in states ? states.implementation_planning.outputs.outputs.compat_review_ok : false }}
            blocking_issues=${{ "implementation_planning" in states ? states.implementation_planning.outputs.outputs.compat_review_blocking_issues : [] }}

            Feedback:
            ${{ "implementation_planning" in states ? states.implementation_planning.outputs.outputs.compat_review_feedback : "" }}

            Provide feedback to revise the implementation plan bundle.
          type: paragraph_text

    implementation_planning_decision:
      op: input
      transitions:
        - to: spawn_dependency_tickets
          when: 'has(outputs.response) && outputs.response == "approve_and_spawn_dependencies"'
        - to: outcome_determination
          when: 'has(outputs.response) && outputs.response == "approve_start_implementation"'
        - to: implementation_planning_feedback
          when: "true"
      inputs:
        form:
          title: "Implementation plan review"
          question: |
            Implementation planning artifacts are available under `implementation/` (see `implementation/index.md`).

            Summary:
            ${{ "implementation_planning" in states ? states.implementation_planning.outputs.outputs.summary : "" }}

            Local implementation steps:
            ${{ "implementation_planning" in states ? states.implementation_planning.outputs.outputs.local_steps : [] }}

            Dependency tickets required before local implementation:
            ${{ "implementation_planning" in states ? states.implementation_planning.outputs.outputs.requires_dependency_tickets : false }}

            Dependency order:
            ${{ "implementation_planning" in states ? states.implementation_planning.outputs.outputs.dependency_order : [] }}

            Compatibility review:
            ok=${{ "implementation_planning" in states ? states.implementation_planning.outputs.outputs.compat_review_ok : false }}
            blocking_issues=${{ "implementation_planning" in states ? states.implementation_planning.outputs.outputs.compat_review_blocking_issues : [] }}

            Feedback:
            ${{ "implementation_planning" in states ? states.implementation_planning.outputs.outputs.compat_review_feedback : "" }}
          type: multiple_choice
          options:
            - value: approve_start_implementation
              label: Approve and continue to outcome determination
            - value: approve_and_spawn_dependencies
              label: Approve and spawn dependency tickets
            - value: revise
              label: Revise

    implementation_planning_feedback:
      op: input
      transitions:
        - to: implementation_planning
          when: "true"
      inputs:
        form:
          title: "Implementation planning feedback"
          question: "What should change in the implementation plan bundle?"
          type: paragraph_text

    outcome_determination:
      op: recipe.run_and_get_result
      transitions:
        - to: outcome_blocked_feedback
          when: "has(outputs.review_ok) && !outputs.review_ok"
        - to: outcome_decision
          when: "true"
      inputs:
        name: new-ticket-outcome-determination
        artifacts:
          - '${{ states.requirements_planning.artifacts["requirements/plan.json"] }}'
          - '${{ states.requirements_planning.artifacts["requirements/index.md"] }}'
          - '${{ states.implementation_planning.artifacts["implementation/plan.json"] }}'
          - '${{ states.implementation_planning.artifacts["implementation/index.md"] }}'
        inputs:
          title: >-
            ${{
              (has(inputs.title) && inputs.title != "")
                ? inputs.title
                : ((has(context.ticket.title) && context.ticket.title != "") ? context.ticket.title : "")
            }}
          description: >-
            ${{
              (has(inputs.description) && inputs.description != "")
                ? inputs.description
                : ((has(context.ticket.description) && context.ticket.description != "") ? context.ticket.description : "")
            }}
          user_feedback: >-
            ${{
              ("outcome_feedback" in states && has(states.outcome_feedback.outputs.response))
                ? states.outcome_feedback.outputs.response
                : (
                    ("outcome_blocked_feedback" in states && has(states.outcome_blocked_feedback.outputs.response))
                      ? states.outcome_blocked_feedback.outputs.response
                      : (
                          ("implementation_test_statement_change_request" in states && has(states.implementation_test_statement_change_request.outputs.fields.writer_notes) && states.implementation_test_statement_change_request.outputs.fields.writer_notes != "")
                            ? states.implementation_test_statement_change_request.outputs.fields.writer_notes
                            : (
                                ("implementation_test_statement_change_request" in states)
                                  ? (
                                      ("implement_resume" in states && has(states.implement_resume.outputs.incompleteCategory) && states.implement_resume.outputs.incompleteCategory == "needs_test_statement_update" && has(states.implement_resume.outputs.incompleteReason))
                                        ? states.implement_resume.outputs.incompleteReason
                                        : (("implement" in states && has(states.implement.outputs.incompleteReason)) ? states.implement.outputs.incompleteReason : "")
                                    )
                                  : ""
                              )
                        )
                  )
            }}

    outcome_blocked_feedback:
      op: input
      transitions:
        - to: outcome_determination
          when: "true"
      inputs:
        form:
          title: "Outcome determination blocked"
          question: |
            Outcome artifacts are available under `outcome/` (see `outcome/index.md` and `outcome/tests-index.md`).
            Authoritative test statements are in `.c2/tests/*.md` of the cell.

            Summary:
            ${{ "outcome_determination" in states ? states.outcome_determination.outputs.outputs.summary : "" }}

            Existing statement assessment:
            ${{ "outcome_determination" in states ? states.outcome_determination.outputs.outputs.current_test_statements_summary : "" }}

            Test statement updates required:
            ${{ "outcome_determination" in states ? states.outcome_determination.outputs.outputs.test_statement_updates_required : false }}

            Test statement repo location:
            ${{ "outcome_determination" in states ? states.outcome_determination.outputs.outputs.test_statement_repo_glob : ".c2/tests/*.md" }}

            Contrarian outcome review:
            ok=${{ "outcome_determination" in states ? states.outcome_determination.outputs.outputs.review_ok : false }}
            blocking_issues=${{ "outcome_determination" in states ? states.outcome_determination.outputs.outputs.review_blocking_issues : [] }}

            Feedback:
            ${{ "outcome_determination" in states ? states.outcome_determination.outputs.outputs.review_feedback : "" }}

            Provide feedback to revise the outcome bundle.
          type: paragraph_text

    outcome_decision:
      op: input
      transitions:
        - to: implementation_session
          when: 'has(outputs.response) && outputs.response == "approve_start_implementation"'
        - to: outcome_feedback
          when: "true"
      inputs:
        form:
          title: "Outcome review"
          question: |
            Outcome artifacts are available under `outcome/` (see `outcome/index.md` and `outcome/tests-index.md`).
            Authoritative test statements are in `.c2/tests/*.md` of the cell.

            Summary:
            ${{ "outcome_determination" in states ? states.outcome_determination.outputs.outputs.summary : "" }}

            Existing statement assessment:
            ${{ "outcome_determination" in states ? states.outcome_determination.outputs.outputs.current_test_statements_summary : "" }}

            Test statement updates required:
            ${{ "outcome_determination" in states ? states.outcome_determination.outputs.outputs.test_statement_updates_required : false }}

            Test statement repo location:
            ${{ "outcome_determination" in states ? states.outcome_determination.outputs.outputs.test_statement_repo_glob : ".c2/tests/*.md" }}

            Validation commands from outcome bundle:
            ${{ "outcome_determination" in states ? states.outcome_determination.outputs.outputs.validation_commands : "" }}

            Contrarian outcome review:
            ok=${{ "outcome_determination" in states ? states.outcome_determination.outputs.outputs.review_ok : false }}
            blocking_issues=${{ "outcome_determination" in states ? states.outcome_determination.outputs.outputs.review_blocking_issues : [] }}

            Feedback:
            ${{ "outcome_determination" in states ? states.outcome_determination.outputs.outputs.review_feedback : "" }}
          type: multiple_choice
          options:
            - value: approve_start_implementation
              label: Approve and implement now
            - value: revise
              label: Revise outcome bundle

    outcome_feedback:
      op: input
      transitions:
        - to: outcome_determination
          when: "true"
      inputs:
        form:
          title: "Outcome feedback"
          question: "What should change in the outcome bundle?"
          type: paragraph_text

    spawn_dependency_tickets:
      op: ticket.manage
      transitions:
        - to: dependency_wait_note
          when: 'has(context.actor.ticket_id) && context.actor.ticket_id != ""'
        - to: dependency_wait_hold
          when: "true"
      inputs:
        actions: >-
          ${{
            jq(
              states.implementation_planning.outputs.outputs.plan_json,
              'fromjson | (.dependency_ticket_specs // []) | map(select((.target_cell // "") != "" and .target_cell != "' + context.workflow.cell + '") | {type:"create_ticket", project_id:"' + context.workflow.project_id + '", cell:.target_cell, title:(((.id // "") | if . != "" then "[" + . + "] " else "" end) + ((.title // "") | if . != "" then . else "Dependency work" end)), description:("Parent ticket: ' + (has(context.actor.ticket_id) ? context.actor.ticket_id : "") + '\n\nRequirement ID: " + (.id // "(none)") + "\n\nDepends on requirement IDs:\n" + ((.depends_on_markdown // "- (none)")) + "\n\n## Scope\n" + ((.scope // "(tbd)")) + "\n\n## Acceptance criteria\n" + ((.acceptance_criteria_markdown // "- (none)")) + "\n\n## Risks\n" + ((.risks_markdown // "- (none)")) + "\n\n## Notes\n" + ((.notes // "(none)"))), stage:"open", state:"working"})'
            )
          }}

    dependency_wait_note:
      op: ticket.manage
      transitions:
        - to: dependency_wait_hold
          when: "true"
      inputs:
        actions:
          - type: append_ticket_note
            ticket_id: "{{ context.actor.ticket_id }}"
            note: >-
              Dependency tickets were created and must complete before local implementation starts.
              - Dependency order: ${{ "implementation_planning" in states ? states.implementation_planning.outputs.outputs.dependency_order : [] }}.
              - Created dependency ticket IDs: ${{ "spawn_dependency_tickets" in states && size(states.spawn_dependency_tickets.outputs.results) > 0 ? states.spawn_dependency_tickets.outputs.results.map(r, r.ticket.id) : [] }}.
              - Parent ticket remains open and waiting.
          - type: update_ticket
            ticket_id: "{{ context.actor.ticket_id }}"
            stage: open
            state: waiting_user

    dependency_wait_hold:
      op: sleep
      transitions: []
      inputs:
        duration: 1ms

    implementation_session:
      op: input
      transitions:
        - to: implement
          when: "true"
      inputs:
        form:
          title: "Implementation session"
          fields:
            - id: session_strategy
              type: dropdown
              question: >-
                Session strategy (previous session id: ${{ "implement" in states ? states.implement.outputs.sessionId : "(none)" }}; previous summary available: ${{ ("implement" in states && has(states.implement.outputs.assistantSummary) && states.implement.outputs.assistantSummary != "") ? "yes" : "no" }})
              required: true
              options:
                - value: continue
                  label: Continue previous session (default)
                - value: new_blank
                  label: Start new session (no context)
                - value: new_with_summary
                  label: Start new session (include prior summary)
            - id: extra_instructions
              type: paragraph_text
              question: "Extra instructions for Codex (optional)"
              required: false

    implement:
      op: codex.exec
      transitions:
        - to: implement_questions
          when: 'has(outputs.incompleteCategory) && outputs.incompleteCategory == "needs_user_input"'
        - to: implementation_test_statement_change_request
          when: 'has(outputs.incompleteCategory) && outputs.incompleteCategory == "needs_test_statement_update"'
        - to: implement_bugs
          when: "has(outputs.pendingDependencies) && size(outputs.pendingDependencies) > 0"
        - to: validate
          when: "true"
      artifacts:
        requirements/plan.json: '${{ states.requirements_planning.artifacts["requirements/plan.json"] }}'
        requirements/index.md: '${{ states.requirements_planning.artifacts["requirements/index.md"] }}'
        implementation/plan.json: '${{ states.implementation_planning.artifacts["implementation/plan.json"] }}'
        implementation/index.md: '${{ states.implementation_planning.artifacts["implementation/index.md"] }}'
        outcome/plan.json: '${{ states.outcome_determination.artifacts["outcome/plan.json"] }}'
        outcome/tests-index.md: '${{ states.outcome_determination.artifacts["outcome/tests-index.md"] }}'
        outcome/validation-commands.txt: '${{ states.outcome_determination.artifacts["outcome/validation-commands.txt"] }}'
      inputs:
        sessionId: >-
          ${{
            (states.implementation_session.outputs.fields.session_strategy == "continue" && "implement" in states)
              ? states.implement.outputs.sessionId
              : ""
          }}
        worktree_path: "{{ context.environment.worktree_path }}"
        cell_relative_path: >-
          ${{
            (has(context.workflow.cell_path) && context.workflow.cell_path != "")
              ? context.workflow.cell_path
              : "."
          }}
        prompt: |
          You are implementing a software ticket in the c2 system.

          Ticket:
          - Title: ${{ has(inputs.title) && inputs.title != "" ? inputs.title : (has(context.ticket.title) ? context.ticket.title : "") }}
          - Description:
          ${{ has(inputs.description) && inputs.description != "" ? inputs.description : (has(context.ticket.description) ? context.ticket.description : "") }}

          Requirements plan artifact path:
          `/src/inbox/requirements/plan.json`

          Requirements index artifact path:
          `/src/inbox/requirements/index.md`

          Implementation plan artifact path:
          `/src/inbox/implementation/plan.json`

          Implementation index artifact path:
          `/src/inbox/implementation/index.md`

          Outcome plan artifact path:
          `/src/inbox/outcome/plan.json`

          Outcome tests index artifact path:
          `/src/inbox/outcome/tests-index.md`

          Authoritative test statement files (repo path):
          `.c2/tests/*.md`

          Outcome validation commands artifact path:
          `/src/inbox/outcome/validation-commands.txt`

          Validation feedback from the last attempt (if any):
          ${{ 'validate' in states ? 'See validation artifacts: validation/output-tail.txt and validation/output.txt' : '' }}

          Previous session summary (included only when requested):
          ${{
            (states.implementation_session.outputs.fields.session_strategy == "new_with_summary" && "implement" in states && has(states.implement.outputs.assistantSummary) && states.implement.outputs.assistantSummary != "")
              ? states.implement.outputs.assistantSummary
              : ""
          }}

          Extra instructions:
          ${{ has(states.implementation_session.outputs.fields.extra_instructions) ? states.implementation_session.outputs.fields.extra_instructions : '' }}

          Constraints:
          - Keep changes scoped to the current cell’s code.
          - Never introduce backwards-incompatible changes.
          - Do NOT write requirements/plan/review docs into the git repo.
          - If notes are needed, write artifacts under `/src/outbox/implementation/`.
          - Input artifacts are available under `/src/inbox`.
          - If you discover bugs in other cells, add one entry per bug to `pendingDependencies`:
            - `component`: exact target cell name.
            - `requestedChanges`: bug summary, impact, and concrete repro/fix guidance.
          - If you need user clarification before continuing, stop and set:
            - `incompleteCategory`: `needs_user_input`
            - `incompleteReason`: numbered list of questions for the user.
          - Align implementation with `.c2/tests/*.md` in the cell repo.
          - Do NOT modify `.c2/tests/*.md` during implementation.
          - If test statements appear incorrect/incomplete, stop and set:
            - `incompleteCategory`: `needs_test_statement_update`
            - `incompleteReason`: concrete requested changes for the test statement writer.
          - Update/add tests if appropriate.
          - Prefer small, safe changes.

          Deliverables:
          - Make the code changes in-repo.
          - Leave the workspace in a state where validation commands are likely to pass.

    implement_bugs:
      op: ticket.manage
      transitions:
        - to: validate
          when: "true"
      inputs:
        actions: >-
          ${{
            jq(
              states.implement.outputs.pendingDependencies,
              'map(select((.component // "") != "" and .component != "' + context.workflow.cell + '") | {type:"create_ticket", project_id:"' + context.workflow.project_id + '", cell:.component, title:("[BUG][" + .component + "] follow-up"), description:(.requestedChanges // "Bug details were not provided."), stage:"open", state:"working"})'
            )
          }}

    implement_questions:
      op: input
      transitions:
        - to: implement_resume
          when: "true"
      inputs:
        form:
          title: "Implementation questions"
          fields:
            - id: user_answers
              type: paragraph_text
              question: |
                Codex requested clarification before continuing implementation.

                Questions:
                ${{ has(states.implement.outputs.incompleteReason) ? states.implement.outputs.incompleteReason : "(none provided)" }}

                Provide numbered answers in order.
              required: true

    implementation_test_statement_change_request:
      op: input
      transitions:
        - to: cancel_ticket_route
          when: 'has(outputs.fields.response) && outputs.fields.response == "cancel_ticket"'
        - to: outcome_determination
          when: "true"
      inputs:
        form:
          title: "Implementation requests test statement update"
          fields:
            - id: writer_notes
              type: paragraph_text
              question: |
                Implementation is requesting test statement changes.

                Requested changes:
                ${{
                  ("implement_resume" in states && has(states.implement_resume.outputs.incompleteCategory) && states.implement_resume.outputs.incompleteCategory == "needs_test_statement_update" && has(states.implement_resume.outputs.incompleteReason) && states.implement_resume.outputs.incompleteReason != "")
                    ? states.implement_resume.outputs.incompleteReason
                    : (("implement" in states && has(states.implement.outputs.incompleteReason) && states.implement.outputs.incompleteReason != "") ? states.implement.outputs.incompleteReason : "(none provided)")
                }}

                Provide additional instructions for the test statement writer (optional).
              required: false
            - id: response
              type: multiple_choice
              question: "Send this request to outcome determination?"
              required: true
              options:
                - value: send_to_writer
                  label: Send to writer
                - value: cancel_ticket
                  label: Cancel ticket

    implement_resume:
      op: codex.exec
      transitions:
        - to: implement_resume_questions
          when: 'has(outputs.incompleteCategory) && outputs.incompleteCategory == "needs_user_input"'
        - to: implementation_test_statement_change_request
          when: 'has(outputs.incompleteCategory) && outputs.incompleteCategory == "needs_test_statement_update"'
        - to: implement_resume_bugs
          when: "has(outputs.pendingDependencies) && size(outputs.pendingDependencies) > 0"
        - to: validate
          when: "true"
      artifacts:
        requirements/plan.json: '${{ states.requirements_planning.artifacts["requirements/plan.json"] }}'
        requirements/index.md: '${{ states.requirements_planning.artifacts["requirements/index.md"] }}'
        implementation/plan.json: '${{ states.implementation_planning.artifacts["implementation/plan.json"] }}'
        implementation/index.md: '${{ states.implementation_planning.artifacts["implementation/index.md"] }}'
        outcome/plan.json: '${{ states.outcome_determination.artifacts["outcome/plan.json"] }}'
        outcome/tests-index.md: '${{ states.outcome_determination.artifacts["outcome/tests-index.md"] }}'
        outcome/validation-commands.txt: '${{ states.outcome_determination.artifacts["outcome/validation-commands.txt"] }}'
      inputs:
        sessionId: >-
          ${{
            ("implement_resume" in states)
              ? states.implement_resume.outputs.sessionId
              : states.implement.outputs.sessionId
          }}
        worktree_path: "{{ context.environment.worktree_path }}"
        cell_relative_path: >-
          ${{
            (has(context.workflow.cell_path) && context.workflow.cell_path != "")
              ? context.workflow.cell_path
              : "."
          }}
        prompt: |
          Continue the current Codex implementation session.

          Ticket:
          - Title: ${{ has(inputs.title) && inputs.title != "" ? inputs.title : (has(context.ticket.title) ? context.ticket.title : "") }}
          - Description:
          ${{ has(inputs.description) && inputs.description != "" ? inputs.description : (has(context.ticket.description) ? context.ticket.description : "") }}

          Prior clarification request:
          ${{
            ("implement_resume" in states && has(states.implement_resume.outputs.incompleteReason) && states.implement_resume.outputs.incompleteReason != "")
              ? states.implement_resume.outputs.incompleteReason
              : (has(states.implement.outputs.incompleteReason) ? states.implement.outputs.incompleteReason : "")
          }}

          User answers:
          ${{
            ("implement_resume_questions" in states && has(states.implement_resume_questions.outputs.fields.user_answers) && states.implement_resume_questions.outputs.fields.user_answers != "")
              ? states.implement_resume_questions.outputs.fields.user_answers
              : states.implement_questions.outputs.fields.user_answers
          }}

          Requirements plan artifact path:
          `/src/inbox/requirements/plan.json`

          Requirements index artifact path:
          `/src/inbox/requirements/index.md`

          Implementation plan artifact path:
          `/src/inbox/implementation/plan.json`

          Implementation index artifact path:
          `/src/inbox/implementation/index.md`

          Outcome plan artifact path:
          `/src/inbox/outcome/plan.json`

          Outcome tests index artifact path:
          `/src/inbox/outcome/tests-index.md`

          Authoritative test statement files (repo path):
          `.c2/tests/*.md`

          Outcome validation commands artifact path:
          `/src/inbox/outcome/validation-commands.txt`

          Constraints:
          - Keep changes scoped to the current cell’s code.
          - Never introduce backwards-incompatible changes.
          - If you discover bugs in other cells, add them to `pendingDependencies` (`component` = target cell, `requestedChanges` = bug details).
          - If more user clarification is required, set `incompleteCategory` to `needs_user_input` with numbered questions in `incompleteReason`.
          - Align implementation with `.c2/tests/*.md` in the cell repo.
          - Do NOT modify `.c2/tests/*.md` during implementation.
          - If test statements appear incorrect/incomplete, set `incompleteCategory` to `needs_test_statement_update` with concrete requested changes in `incompleteReason`.

          Deliverables:
          - Continue implementation using the user answers.
          - Leave the workspace in a state where validation commands are likely to pass.

    implement_resume_bugs:
      op: ticket.manage
      transitions:
        - to: validate
          when: "true"
      inputs:
        actions: >-
          ${{
            jq(
              states.implement_resume.outputs.pendingDependencies,
              'map(select((.component // "") != "" and .component != "' + context.workflow.cell + '") | {type:"create_ticket", project_id:"' + context.workflow.project_id + '", cell:.component, title:("[BUG][" + .component + "] follow-up"), description:(.requestedChanges // "Bug details were not provided."), stage:"open", state:"working"})'
            )
          }}

    implement_resume_questions:
      op: input
      transitions:
        - to: implement_resume
          when: "true"
      inputs:
        form:
          title: "More implementation questions"
          fields:
            - id: user_answers
              type: paragraph_text
              question: |
                Codex still needs clarification.

                Questions:
                ${{ has(states.implement_resume.outputs.incompleteReason) ? states.implement_resume.outputs.incompleteReason : "(none provided)" }}

                Provide numbered answers in order.
              required: true

    validate:
      op: recipe.run_and_get_result
      transitions:
        - to: validation_failed_review
          when: "has(outputs.passed) && !outputs.passed"
        - to: merge_review
          when: "true"
      inputs:
        name: ticket-validate
        inputs:
          commands: >-
            ${{
              (has(inputs.validate_commands) && inputs.validate_commands != "")
                ? inputs.validate_commands
                : (
                    ("outcome_determination" in states && has(states.outcome_determination.outputs.outputs.validation_commands) && states.outcome_determination.outputs.outputs.validation_commands != "")
                      ? states.outcome_determination.outputs.outputs.validation_commands
                      : ""
                  )
            }}

    validation_failed_review:
      op: input
      transitions:
        - to: implementation_session
          when: 'has(outputs.response) && outputs.response == "address_changes"'
        - to: cancel_ticket_route
          when: "true"
      inputs:
        form:
          title: "Validation failed"
          question: |
            Validation failed.

            Review artifacts:
            - `validation/output-tail.txt`
            - `validation/output.txt`
            - `.c2/tests/*.md`

            Choose what to do next.
          type: multiple_choice
          options:
            - value: address_changes
              label: Address changes
            - value: cancel_ticket
              label: Cancel ticket

    merge_review:
      op: input
      transitions:
        - to: merge_missing_changes
          when: 'has(outputs.response) && outputs.response == "merge" && (!has(inputs.local_hash) || inputs.local_hash == "")'
        - to: merge_prompt
          when: >-
            has(outputs.response) && outputs.response == "merge" && (
              !has(inputs.upstream_repo) || inputs.upstream_repo == "" ||
              !has(inputs.upstream_branch) || inputs.upstream_branch == ""
            )
        - to: merge
          when: 'has(outputs.response) && outputs.response == "merge"'
        - to: implementation_session
          when: 'has(outputs.response) && outputs.response == "address_changes"'
        - to: cancel_ticket_route
          when: "true"
      inputs:
        form:
          title: "Merge decision"
          question: |
            Validation passed: ${{ "validate" in states ? states.validate.outputs.outputs.passed : false }}

            Validation artifacts:
            - `validation/output-tail.txt`
            - `validation/output.txt`

            Current local hash: `{{ inputs.local_hash }}`

            Merge is required to complete this ticket.
            Choose to merge, address changes, or cancel the ticket.
          type: multiple_choice
          options:
            - value: merge
              label: Merge
            - value: address_changes
              label: Address changes
            - value: cancel_ticket
              label: Cancel ticket

    merge_missing_changes:
      op: input
      transitions:
        - to: implementation_session
          when: 'has(outputs.response) && outputs.response == "address_changes"'
        - to: cancel_ticket_route
          when: "true"
      inputs:
        form:
          title: "No mergeable commit"
          question: |
            Merge was selected, but there is no local commit hash (`local_hash` is empty).

            Choose whether to address changes and re-run validation, or cancel the ticket.
          type: multiple_choice
          options:
            - value: address_changes
              label: Address changes
            - value: cancel_ticket
              label: Cancel ticket

    merge_prompt:
      op: input
      transitions:
        - to: merge
          when: "true"
      inputs:
        form:
          title: "Merge details"
          fields:
            - id: upstream_repo
              type: short_answer
              question: "Upstream repo (e.g. git@host:org/repo.git)"
              required: true
            - id: upstream_branch
              type: short_answer
              question: "Upstream branch (e.g. main)"
              required: true
            - id: commit_message
              type: paragraph_text
              question: "Squash commit message"
              required: true

    merge:
      op: squashrebasemerge
      transitions:
        - to: complete_done_route
          when: "true"
      inputs:
        repo_path: "{{ context.environment.worktree_path }}"
        local_hash: "{{ inputs.local_hash }}"
        upstream_repo: >-
          ${{
            "merge_prompt" in states
              ? states.merge_prompt.outputs.fields.upstream_repo
              : inputs.upstream_repo
          }}
        upstream_branch: >-
          ${{
            "merge_prompt" in states
              ? states.merge_prompt.outputs.fields.upstream_branch
              : inputs.upstream_branch
          }}
        rebase: true
        author: "${{ has(context.git.author) ? context.git.author : \"\" }}"
        commit_message: >-
          ${{
            "merge_prompt" in states
              ? states.merge_prompt.outputs.fields.commit_message
              : (
                  (has(inputs.title) && inputs.title != "")
                    ? inputs.title
                    : ((has(context.ticket.title) && context.ticket.title != "") ? context.ticket.title : "Update")
                )
          }}

    cancel_ticket_route:
      op: sleep
      transitions:
        - to: cancel_ticket_update
          when: 'has(context.actor.ticket_id) && context.actor.ticket_id != ""'
        - to: cancel_ticket_done
          when: "true"
      inputs:
        duration: 1ms

    cancel_ticket_update:
      op: ticket.manage
      transitions:
        - to: cancel_ticket_done
          when: "true"
      inputs:
        actions:
          - type: append_ticket_note
            ticket_id: "{{ context.actor.ticket_id }}"
            note: >-
              Ticket was cancelled by workflow decision.
              - Reason: ${{
                  ("merge_review" in states && has(states.merge_review.outputs.response) && states.merge_review.outputs.response == "cancel_ticket")
                    ? "Cancelled during merge decision."
                    : (
                        ("merge_missing_changes" in states && has(states.merge_missing_changes.outputs.response) && states.merge_missing_changes.outputs.response == "cancel_ticket")
                          ? "Cancelled after merge was requested without a local hash."
                          : "Cancelled after validation failure."
                      )
                }}
              - Validation passed at cancellation: ${{ "validate" in states ? states.validate.outputs.outputs.passed : false }}.
          - type: update_ticket
            ticket_id: "{{ context.actor.ticket_id }}"
            stage: completed
            state: canceled

    cancel_ticket_done:
      op: sleep
      transitions: []
      inputs:
        duration: 1ms

    complete_done_route:
      op: sleep
      transitions:
        - to: complete_done_update
          when: 'has(context.actor.ticket_id) && context.actor.ticket_id != ""'
        - to: complete_done_noop
          when: "true"
      inputs:
        duration: 1ms

    complete_done_update:
      op: ticket.manage
      transitions:
        - to: complete_done_noop
          when: "true"
      inputs:
        actions:
          - type: append_ticket_note
            ticket_id: "{{ context.actor.ticket_id }}"
            note: >-
              Workflow completed successfully.
              - Requirements artifacts generated under `requirements/` (see `requirements/index.md`).
              - Implementation plan artifacts generated under `implementation/` (see `implementation/index.md`).
              - Outcome artifacts generated under `outcome/` (see `outcome/index.md` and `outcome/tests-index.md`).
              - Authoritative test statements are maintained in `.c2/tests/*.md`.
              - Dependency order: ${{ "implementation_planning" in states ? states.implementation_planning.outputs.outputs.dependency_order : [] }}.
              - Outcome test statement updates required: ${{ "outcome_determination" in states ? states.outcome_determination.outputs.outputs.test_statement_updates_required : false }}.
              - Validation commands source: ${{ (has(inputs.validate_commands) && inputs.validate_commands != "") ? "ticket input" : (("outcome_determination" in states && has(states.outcome_determination.outputs.outputs.validation_commands) && states.outcome_determination.outputs.outputs.validation_commands != "") ? "outcome bundle" : "ticket-validate defaults") }}.
              - Cross-cell bug tickets created during implementation: ${{ ('implement_bugs' in states && size(states.implement_bugs.outputs.results) > 0) || ('implement_resume_bugs' in states && size(states.implement_resume_bugs.outputs.results) > 0) }}.
              - User clarification requested during implementation: ${{ ('implement_questions' in states) || ('implement_resume_questions' in states) }}.
              - Validation passed: ${{ "validate" in states ? states.validate.outputs.outputs.passed : false }}.
              - Merged: ${{ "merge" in states && has(states.merge.outputs.merged_hash) && states.merge.outputs.merged_hash != "" }} (hash: ${{ "merge" in states ? states.merge.outputs.merged_hash : "" }}).
          - type: update_ticket
            ticket_id: "{{ context.actor.ticket_id }}"
            stage: completed
            state: done

    complete_done_noop:
      op: sleep
      transitions: []
      inputs:
        duration: 1ms

outputs:
  cell_is_appropriate: "${{ 'triage' in states ? states.triage.outputs.outputs.cell_is_appropriate : false }}"
  recommended_cell: "${{ 'triage' in states ? states.triage.outputs.outputs.recommended_cell : '' }}"
  recommended_cell_is_valid: "${{ 'triage' in states ? states.triage.outputs.outputs.recommended_cell_is_valid : false }}"
  recommended_cell_final: "${{ 'triage' in states ? states.triage.outputs.outputs.recommended_cell_final : '' }}"
  rationale: "${{ 'triage' in states ? states.triage.outputs.outputs.rationale : '' }}"
  reassign_performed: "${{ 'triage' in states ? (!states.triage.outputs.outputs.cell_is_appropriate && states.triage.outputs.outputs.recommended_cell_is_valid) : false }}"
  reassigned_ticket_id: "${{ 'reassign_create' in states && size(states.reassign_create.outputs.results) > 0 ? states.reassign_create.outputs.results[0].ticket.id : \"\" }}"
  reassigned_ticket_job_id: "${{ 'reassign_create' in states && size(states.reassign_create.outputs.results) > 0 && has(states.reassign_create.outputs.results[0].job_id) ? states.reassign_create.outputs.results[0].job_id : \"\" }}"
  requirements_plan_json: "${{ 'requirements_planning' in states ? states.requirements_planning.outputs.outputs.plan_json : \"\" }}"
  requirements_dependency_order: "${{ 'requirements_planning' in states ? states.requirements_planning.outputs.outputs.dependency_order : [] }}"
  requirements: "${{ 'requirements_planning' in states ? states.requirements_planning.outputs.outputs.requirements : [] }}"
  requirements_approved: "${{ 'requirements_decision' in states && has(states.requirements_decision.outputs.response) ? states.requirements_decision.outputs.response == \"approve\" : false }}"
  requirements_user_feedback: "${{ 'requirements_feedback' in states && has(states.requirements_feedback.outputs.response) ? states.requirements_feedback.outputs.response : (('requirements_blocked_feedback' in states && has(states.requirements_blocked_feedback.outputs.response)) ? states.requirements_blocked_feedback.outputs.response : \"\") }}"
  cross_cell_required: "${{ 'requirements_planning' in states ? states.requirements_planning.outputs.outputs.requirements.exists(r, has(r.target_cell) && r.target_cell != \"\" && r.target_cell != context.workflow.cell) : false }}"
  implementation_plan_json: "${{ 'implementation_planning' in states ? states.implementation_planning.outputs.outputs.plan_json : \"\" }}"
  implementation_dependency_order: "${{ 'implementation_planning' in states ? states.implementation_planning.outputs.outputs.dependency_order : [] }}"
  implementation_requires_dependency_tickets: "${{ 'implementation_planning' in states ? states.implementation_planning.outputs.outputs.requires_dependency_tickets : false }}"
  implementation_dependency_ticket_specs: "${{ 'implementation_planning' in states ? states.implementation_planning.outputs.outputs.dependency_ticket_specs : [] }}"
  outcome_plan_json: "${{ 'outcome_determination' in states ? states.outcome_determination.outputs.outputs.plan_json : \"\" }}"
  outcome_current_test_statements_summary: "${{ 'outcome_determination' in states ? states.outcome_determination.outputs.outputs.current_test_statements_summary : \"\" }}"
  outcome_test_statement_updates_required: "${{ 'outcome_determination' in states ? states.outcome_determination.outputs.outputs.test_statement_updates_required : false }}"
  outcome_test_statement_repo_glob: "${{ 'outcome_determination' in states ? states.outcome_determination.outputs.outputs.test_statement_repo_glob : \".c2/tests/*.md\" }}"
  outcome_validation_commands: "${{ 'outcome_determination' in states ? states.outcome_determination.outputs.outputs.validation_commands : \"\" }}"
  outcome_review_ok: "${{ 'outcome_determination' in states ? states.outcome_determination.outputs.outputs.review_ok : false }}"
  outcome_approved: "${{ 'outcome_decision' in states && has(states.outcome_decision.outputs.response) ? states.outcome_decision.outputs.response == \"approve_start_implementation\" : false }}"
  implementation_requested_test_statement_update: "${{ 'implementation_test_statement_change_request' in states }}"
  implementation_bug_ticket_ids_initial: "${{ 'implement_bugs' in states && size(states.implement_bugs.outputs.results) > 0 ? states.implement_bugs.outputs.results.map(r, has(r.ticket.id) ? r.ticket.id : \"\") : [] }}"
  implementation_bug_ticket_ids_resume: "${{ 'implement_resume_bugs' in states && size(states.implement_resume_bugs.outputs.results) > 0 ? states.implement_resume_bugs.outputs.results.map(r, has(r.ticket.id) ? r.ticket.id : \"\") : [] }}"
  implementation_user_questions_requested: "${{ ('implement_questions' in states) || ('implement_resume_questions' in states) }}"
  dependency_waiting: "${{ 'dependency_wait_hold' in states }}"
  validation_selected_commands: "${{ (has(inputs.validate_commands) && inputs.validate_commands != \"\") ? inputs.validate_commands : (('outcome_determination' in states && has(states.outcome_determination.outputs.outputs.validation_commands) && states.outcome_determination.outputs.outputs.validation_commands != \"\") ? states.outcome_determination.outputs.outputs.validation_commands : \"\") }}"
  validation_passed: "${{ 'validate' in states ? states.validate.outputs.outputs.passed : false }}"
  merged: "${{ 'merge' in states && has(states.merge.outputs.merged_hash) && states.merge.outputs.merged_hash != \"\" }}"
  merged_hash: "${{ 'merge' in states && has(states.merge.outputs.merged_hash) ? states.merge.outputs.merged_hash : \"\" }}"
  canceled: "${{ 'cancel_ticket_done' in states }}"
  ticket_done: "${{ 'complete_done_noop' in states }}"
