id: new-ticket
version: 0.1.4
desc: Long-lived ticket recipe orchestrating triage, plan, execute, validate, and approval (v2)
state:
  initial: triage
  states:
    triage:
      op: recipe.run_and_get_result
      transitions:
        - to: requirements_planning
          when: "true"
      inputs:
        name: new-ticket-triage
        inputs:
          title: '{{ context.ticket.title }}'
          description: '{{ context.ticket.description }}'
    reassign_create:
      op: ticket.manage
      when: 'has(context.ticket.id) && context.ticket.id != ""'
      transitions:
        - to: reassign_annotate
          when: "true"
      inputs:
        actions:
          - type: create_ticket
            project_id: "{{ context.workflow.project_id }}"
            cell: "{{ states.triage.outputs.outputs.recommended_cell_final }}"
            title: "{{ context.ticket.title }}"
            description: "{{ context.ticket.description }}"
            stage: open
            state: working
    reassign_annotate:
      op: ticket.manage
      when: 'has(context.ticket.id) && context.ticket.id != ""'
      transitions:
        - to: requirements_note
          when: "true"
      inputs:
        actions:
          - type: append_ticket_note
            ticket_id: "{{ context.ticket.id }}"
            note: >-
              Reassigned to cell "{{ states.triage.outputs.outputs.recommended_cell_final }}".
              Created new ticket {{ size(states.reassign_create.outputs.results) > 0 ? states.reassign_create.outputs.results[0].ticket.id : "(unknown)" }}.
    requirements_planning:
      op: recipe.run_and_get_result
      transitions:
        - to: requirements_review
          when: "true"
      inputs:
        name: new-ticket-requirements-planning
        inputs:
          title: '{{ context.ticket.title }}'
          description: '{{ context.ticket.description }}'
          prior_plan_json: '{{ "requirements_planning" in states ? states.requirements_planning.outputs.outputs.plan_json : "" }}'
          user_feedback: '{{ "check_approve" in states && has(states.check_approve.outputs.exit_code) && states.check_approve.outputs.exit_code != 0 ? states.check_approve.outputs.stdout : "" }}'
          api_review_feedback: '{{ "requirements_planning" in states ? states.requirements_planning.outputs.outputs.api_review_feedback : "" }}'
    requirements_review:
      op: input
      transitions:
        - to: check_approve
          when: "true"
      inputs:
        form:
          title: "Review requirements"
          question: |
            Requirements bundle has been generated as artifacts under `requirements/` (see `requirements/index.md`).

            Summary:
            {{ states.requirements_planning.outputs.outputs.summary }}

            Prior user feedback applied (from last loop, if any):
            {{ "check_approve" in states && has(states.check_approve.outputs.stdout) ? states.check_approve.outputs.stdout : "" }}

            Dependency order:
            {{ states.requirements_planning.outputs.outputs.dependency_order }}

            Requirements (JSON):
            {{ states.requirements_planning.outputs.outputs.requirements }}

            Contrarian API review:
            ok={{ states.requirements_planning.outputs.outputs.api_review_ok }}
            blocking_issues={{ states.requirements_planning.outputs.outputs.api_review_blocking_issues }}

            Feedback:
            {{ states.requirements_planning.outputs.outputs.api_review_feedback }}

            Reply with "APPROVE" to proceed, or provide feedback to revise the requirements.
          type: short_answer
    check_approve:
      op: command_execution
      transitions:
        - to: requirements_planning
          when: "has(states.requirements_planning.outputs.outputs.api_review_ok) && !states.requirements_planning.outputs.outputs.api_review_ok"
        - to: maybe_reassign
          when: "has(outputs.exit_code) && outputs.exit_code == 0"
        - to: requirements_planning
          when: "true"
      inputs:
        run: |
          set -euo pipefail

          OUT="{{ context.environment.outbox }}"
          mkdir -p "$OUT/requirements"

          cat > "$OUT/requirements/user-review-raw.json" <<'EOF'
          {{ string(states.requirements_review.outputs) }}
          EOF

          set +e
          RESP=$(
            python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          p = Path("{{ context.environment.outbox }}") / "requirements" / "user-review-raw.json"
          j = json.loads(p.read_text(encoding="utf-8"))
          fields = j.get("fields") or {}
          resp = str(fields.get("response") or "")
          resp_clean = resp.strip()
          print(resp_clean)
          sys.exit(0 if resp_clean.upper().startswith("APPROVE") else 1)
          PY
          )
          PY_STATUS=$?
          set -e

          echo "$RESP" > "$OUT/requirements/user-review.txt"
          echo "$RESP"
          exit $PY_STATUS
    maybe_reassign:
      op: command_execution
      transitions:
        - to: reassign_create
          when: "has(states.triage.outputs.outputs.cell_is_appropriate) && !states.triage.outputs.outputs.cell_is_appropriate && has(states.triage.outputs.outputs.recommended_cell_is_valid) && states.triage.outputs.outputs.recommended_cell_is_valid"
        - to: requirements_note
          when: "true"
      inputs:
        run: "echo maybe_reassign"
    requirements_note:
      op: ticket.manage
      when: 'has(context.actor.ticket_id) && context.actor.ticket_id != ""'
      inputs:
        actions:
          - type: append_ticket_note
            ticket_id: "{{ context.actor.ticket_id }}"
            note: >-
              Requirements planning complete. Generated requirement documents as workflow artifacts under
              "requirements/". Dependency order: {{ states.requirements_planning.outputs.outputs.dependency_order }}.
          - type: update_ticket
            ticket_id: "{{ context.actor.ticket_id }}"
            state: waiting_user
outputs:
  cell_is_appropriate: "{{ states.triage.outputs.outputs.cell_is_appropriate }}"
  recommended_cell: "{{ states.triage.outputs.outputs.recommended_cell }}"
  recommended_cell_is_valid: "{{ states.triage.outputs.outputs.recommended_cell_is_valid }}"
  recommended_cell_final: "{{ states.triage.outputs.outputs.recommended_cell_final }}"
  rationale: "{{ states.triage.outputs.outputs.rationale }}"
  reassign_performed: "{{ !states.triage.outputs.outputs.cell_is_appropriate && states.triage.outputs.outputs.recommended_cell_is_valid }}"
  reassigned_ticket_id: "{{ 'reassign_create' in states && size(states.reassign_create.outputs.results) > 0 ? states.reassign_create.outputs.results[0].ticket.id : \"\" }}"
  reassigned_ticket_job_id: "{{ 'reassign_create' in states && size(states.reassign_create.outputs.results) > 0 && has(states.reassign_create.outputs.results[0].job_id) ? states.reassign_create.outputs.results[0].job_id : \"\" }}"
  requirements_plan_json: "{{ 'requirements_planning' in states ? states.requirements_planning.outputs.outputs.plan_json : \"\" }}"
  requirements_dependency_order: "{{ 'requirements_planning' in states ? states.requirements_planning.outputs.outputs.dependency_order : [] }}"
  requirements: "{{ 'requirements_planning' in states ? states.requirements_planning.outputs.outputs.requirements : [] }}"
  requirements_approved: "{{ 'check_approve' in states && has(states.check_approve.outputs.exit_code) ? states.check_approve.outputs.exit_code == 0 : false }}"
  requirements_user_feedback: "{{ 'check_approve' in states && has(states.check_approve.outputs.stdout) ? states.check_approve.outputs.stdout : \"\" }}"
