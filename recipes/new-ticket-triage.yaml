id: new-ticket-triage
version: 0.1.0
input_schema:
  title:
    type: string
    required: true
  description:
    type: string
    required: true
inputs:
  title: '{{ inputs.title }}'
  description: '{{ inputs.description }}'
sequence:
  - id: assess_cell
    op: codex.exec
    inputs:
      worktree_path: "{{ context.environment.worktree_path }}"
      cell_relative_path: >-
        ${{
          (has(context.workflow.cell_path) && context.workflow.cell_path != "")
            ? context.workflow.cell_path
            : "."
        }}
      prompt: |
        Triaging task: determine whether the current cell is appropriate for this ticket.

        Ticket Title: {{ inputs.title }}
        Ticket Description:
        {{ inputs.description }}

        Current Cell: {{ context.workflow.cell }}
        Available Cells (name, path, description): {{ cells | to_json }}

        Decide if the current cell is appropriate to run the work.
        - Treat the current cell as appropriate ONLY if it is the best match among the Available Cells.
        - Prefer specialized cells over general-purpose cells when a specialized cell clearly matches.
        - If the current cell is not the best match, set cell_is_appropriate=false and choose the
          single best cell name from the Available Cells list (use the cell \"name\" value).
        - Use the cell descriptions to guide your choice and provide a concise rationale.

        Write JSON artifact file:
        - `{{ context.environment.outbox }}/triage.json`

        JSON schema:
        {
          "cell_is_appropriate": boolean,
          "recommended_cell": string,
          "rationale": string
        }

  - id: read_triage_json
    op: command_execution
    artifacts:
      triage.json: "triage.json"
    inputs:
      run: |
        set -euo pipefail
        cat "{{ context.environment.inbox }}/triage.json"

outputs:
  triage_json: "{{ sequence.read_triage_json.outputs.stdout }}"
  cell_is_appropriate: "${{ json_parse(sequence.read_triage_json.outputs.stdout).cell_is_appropriate }}"
  recommended_cell: "${{ json_parse(sequence.read_triage_json.outputs.stdout).recommended_cell }}"
  rationale: "${{ json_parse(sequence.read_triage_json.outputs.stdout).rationale }}"
  recommended_cell_is_valid: "${{ cells().exists(c, c.name == json_parse(sequence.read_triage_json.outputs.stdout).recommended_cell) }}"
  recommended_cell_final: "${{ json_parse(sequence.read_triage_json.outputs.stdout).cell_is_appropriate ? context.workflow.cell : (cells().exists(c, c.name == json_parse(sequence.read_triage_json.outputs.stdout).recommended_cell) ? json_parse(sequence.read_triage_json.outputs.stdout).recommended_cell : context.workflow.cell) }}"
