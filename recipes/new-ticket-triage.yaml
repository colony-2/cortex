id: new-ticket-triage
input_schema:
  title:
    type: string
    required: true
  description:
    type: string
    required: true
inputs:
  title: '{{ inputs.title }}'
  description: '{{ inputs.description }}'
sequence:
  - id: stub_draft_requirements
    op: command_execution
    inputs:
      run: |
        set -euo pipefail
        mkdir -p "{{ context.environment.outbox }}"
        cat <<'EOF' > "{{ context.environment.outbox }}/requirements.md"
        ## {{ inputs.title }}
        
        {{ inputs.description }}
        EOF

outputs:
  recommended_cell: "{{ matches(inputs.title + \" \" + inputs.description, '(?i)(frontend|ui|react|css|javascript|typescript|browser)') ? 'frontend' : matches(inputs.title + \" \" + inputs.description, '(?i)(backend|api|service|database|postgres|mysql|db)') ? 'backend' : matches(inputs.title + \" \" + inputs.description, '(?i)(infra|infrastructure|devops|k8s|kubernetes|terraform|helm|aws|gcp)') ? 'infra' : context.workflow.cell }}"
  cell_is_appropriate: "{{ ((matches(inputs.title + \" \" + inputs.description, '(?i)(frontend|ui|react|css|javascript|typescript|browser)') ? 'frontend' : matches(inputs.title + \" \" + inputs.description, '(?i)(backend|api|service|database|postgres|mysql|db)') ? 'backend' : matches(inputs.title + \" \" + inputs.description, '(?i)(infra|infrastructure|devops|k8s|kubernetes|terraform|helm|aws|gcp)') ? 'infra' : context.workflow.cell)) == context.workflow.cell }}"
  rationale: "Heuristic keyword match based on ticket title and description."
