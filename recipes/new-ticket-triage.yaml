id: new-ticket-triage
input_schema:
  title:
    type: string
    required: true
  description:
    type: string
    required: true
inputs:
  title: '{{ inputs.title }}'
  description: '{{ inputs.description }}'
sequence:
  - id: assess_cell
    op: llm_inference2
    inputs:
      default_provider: openai
      default_model: gpt-4.1
      temperature: 0
      tools: []
      response_schema:
        type: object
        properties:
          cell_is_appropriate:
            type: boolean
          recommended_cell:
            type: string
          rationale:
            type: string
        required:
          - cell_is_appropriate
          - recommended_cell
          - rationale
        additionalProperties: false
      system_prompt: >
        You are triaging a software ticket to decide if the current execution cell is the right
        place to do the work. Use the available cells list to choose the best cell. Respond ONLY
        with a JSON object matching the response_schema:
        {"cell_is_appropriate": boolean, "recommended_cell": string, "rationale": string}.
      prompt: |
        Ticket Title: {{ inputs.title }}
        Ticket Description:
        {{ inputs.description }}

        Current Cell: {{ context.workflow.cell }}
        Available Cells: {{ cells() }}

        Decide if the current cell is appropriate to run the work. If it is not, propose the best
        cell name to use instead, choosing exactly from Available Cells. Provide a concise rationale.

  - id: persist_triage_json
    op: command_execution
    inputs:
      run: |
        set -euo pipefail
        mkdir -p "{{ context.environment.outbox }}"
        cat > "{{ context.environment.outbox }}/triage.json" <<'EOF'
        {{ sequence.assess_cell.outputs.response }}
        EOF

  - id: stub_draft_requirements
    op: command_execution
    inputs:
      run: |
        set -euo pipefail
        mkdir -p "{{ context.environment.outbox }}"
        cat <<'EOF' > "{{ context.environment.outbox }}/requirements.md"
        ## {{ inputs.title }}
        
        {{ inputs.description }}
        EOF

outputs:
  cell_is_appropriate: "{{ json_parse(string(sequence.assess_cell.outputs.response)).cell_is_appropriate }}"
  recommended_cell: "{{ json_parse(string(sequence.assess_cell.outputs.response)).recommended_cell }}"
  rationale: "{{ json_parse(string(sequence.assess_cell.outputs.response)).rationale }}"
