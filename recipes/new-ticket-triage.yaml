id: new-ticket-triage
input_schema:
  title:
    type: string
    required: true
  description:
    type: string
    required: true
inputs:
  ititle: '{{ inputs.title }}'
  idescription: '{{ inputs.description }}'
sequence:
  - id: stub_draft_requirements
    op: command_execution
    inputs:
      run: |
        set -euo pipefail
        mkdir -p "{{ context.environment.outbox }}"
        cat <<'EOF' > "{{ context.environment.outbox }}/requirements.md"
        ## {{ inputs.ititle }}
        
        {{ inputs.idescription }}
        EOF
