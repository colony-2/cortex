[program:tinyproxy]
command=/usr/bin/tinyproxy -d -c /etc/tinyproxy/tinyproxy.conf
user=tinyproxy
autorestart=true
stdout_logfile=/var/log/tinyproxy/tinyproxy.log
stderr_logfile=/var/log/tinyproxy/tinyproxy.err.log

[program:allowlist-watcher]
command=/bin/bash -lc 'while /usr/bin/inotifywait -e close_write /etc/tinyproxy/allowlist.conf; do kill -HUP $(pidof tinyproxy) || true; done'
user=root
autorestart=true
stdout_logfile=/var/log/tinyproxy/watcher.log
stderr_logfile=/var/log/tinyproxy/watcher.err.log

; dev-egress-setup handled in container entrypoint for earliest enforcement
