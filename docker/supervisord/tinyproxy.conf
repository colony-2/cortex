[program:tinyproxy]
command=/usr/bin/tinyproxy -d -c /etc/tinyproxy/tinyproxy.conf
user=tinyproxy
autorestart=true
stdout_logfile=/var/log/tinyproxy/tinyproxy.log
stderr_logfile=/var/log/tinyproxy/tinyproxy.err.log

[program:dnsmasq]
command=/usr/sbin/dnsmasq -k --conf-file=/etc/dnsmasq.conf
user=root
autorestart=true
stdout_logfile=/var/log/tinyproxy/dnsmasq.log
stderr_logfile=/var/log/tinyproxy/dnsmasq.err.log

[program:allowlist-watcher]
command=/bin/bash -lc 'while /usr/bin/inotifywait -e close_write,moved_to,create,attrib /etc/shai; do if [ -f /etc/shai/allowed_domains.conf ]; then /usr/local/sbin/generate-dnsmasq-allowlist.sh /etc/shai/allowed_domains.conf /etc/dnsmasq.d/allowlist.conf; kill -HUP $(pidof dnsmasq) || true; kill -HUP $(pidof tinyproxy) || true; fi; done'
user=root
autorestart=true
stdout_logfile=/var/log/tinyproxy/watcher.log
stderr_logfile=/var/log/tinyproxy/watcher.err.log

; dev-egress-setup handled in container entrypoint for earliest enforcement
