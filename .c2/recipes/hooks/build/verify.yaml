# Loaded from the managed candidate by the shared build workflow.
# Commands get fresh worktrees: each consumer installs its own prerequisites.
# const prevents dependency/build products from changing the candidate.
id: cortex-build-verify
version: "1.0.0"
desc: Verify Cortex modules, server, frontend, installer and browser behavior.
# This legacy included hook intentionally leaves input_schema undeclared.
# The caller supplies api_version, request, target_directory, candidate, base,
# documents and settings. Checks use none of these values, and settings may be
# null; a typed optional artifact currently rejects explicit null in c2j.
# Legacy includes preserve the caller payload without validating unused fields.
execution:
  packages:
    - nix:github:NixOS/nixpkgs/2ad48bb4ab952d317de4a966aa0af5822c5d3d34#bash
    - nix:github:NixOS/nixpkgs/2ad48bb4ab952d317de4a966aa0af5822c5d3d34#gnumake
    - nix:github:NixOS/nixpkgs/2ad48bb4ab952d317de4a966aa0af5822c5d3d34#git
    - nix:github:NixOS/nixpkgs/2ad48bb4ab952d317de4a966aa0af5822c5d3d34#coreutils
    - nix:github:NixOS/nixpkgs/2ad48bb4ab952d317de4a966aa0af5822c5d3d34#findutils
    - nix:github:NixOS/nixpkgs/2ad48bb4ab952d317de4a966aa0af5822c5d3d34#go_1_26
    - nix:github:NixOS/nixpkgs/2ad48bb4ab952d317de4a966aa0af5822c5d3d34#nodejs-slim_24
    # Keep this Linux-only browser scoped here so shared repository defaults
    # remain portable across worker platforms.
    - nix:github:NixOS/nixpkgs/2ad48bb4ab952d317de4a966aa0af5822c5d3d34#chromium
    - nix:github:NixOS/nixpkgs/2ad48bb4ab952d317de4a966aa0af5822c5d3d34#ffmpeg
    - nix:github:NixOS/nixpkgs/2ad48bb4ab952d317de4a966aa0af5822c5d3d34#nix
    - nix:github:NixOS/nixpkgs/2ad48bb4ab952d317de4a966aa0af5822c5d3d34#dejavu_fonts
    - pnpm:pnpm@10.0.0
    - pnpm:playwright@1.61.1
sequence:
  - id: toolchain-preflight
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 10m
      continue_on_error: false
      capture_diagnostics: always
      env: &verification-env
        CI: "1"
        GOPRIVATE: github.com/colony-2/*
        GIT_TERMINAL_PROMPT: "0"
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        CORTEX_PLAYWRIGHT_BROWSERS_PATH: ""
        CORTEX_TEST_NORMAL_BUILD: "0"
        C2J_JOBDB: ""
        JOBDB_URL: ""
        CORTEX_TENANT_ID: ""
        CORTEX_WORKING_DIR: ""
        CORTEX_API_URL: ""
        VITE_CORTEX_API_BASE: ""
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        expected_go="go$(cat .go-version)"
        [[ "$(go env GOVERSION)" == "$expected_go" ]]
        [[ "$(node --version)" == v24.* ]]
        [[ "$(pnpm --version)" == 10.0.0 ]]
        for tool in go gofmt node pnpm make git chromium ffmpeg; do
          command -v "$tool"
        done
        go version
        node --version
        pnpm --version
        make --version
        git --version
        chromium --version
        ffmpeg -version
  - id: install-web-dependencies
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 10m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        pnpm install --frozen-lockfile
  - id: git-compatibility-tests
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 5m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        node --test scripts/verify-command.test.mjs
  - id: go-module-verify
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 10m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        module_cache="$(mktemp -d)"
        trap 'rm -rf "$module_cache"' EXIT
        export GOMODCACHE="$module_cache"
        printf 'Verifying modules using a fresh empty module cache.\n'
        cd server
        GOWORK=off node ../scripts/verify-command.mjs bash ../scripts/go.sh mod download
        GOWORK=off node ../scripts/verify-command.mjs bash ../scripts/go.sh mod verify
  - id: go-module-tidy
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 10m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        cd server
        GOWORK=off node ../scripts/verify-command.mjs bash ../scripts/go.sh mod tidy -diff
  - id: go-format
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 5m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        unformatted="$(gofmt -l server)"
        if [[ -n "$unformatted" ]]; then
          printf 'Unformatted Go files:\n%s\n' "$unformatted" >&2
          exit 1
        fi
  - id: go-vet
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 15m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        node scripts/verify-command.mjs bash scripts/go.sh vet ./server/...
  - id: go-tests
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 15m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        node scripts/verify-command.mjs bash scripts/go.sh test -count=1 ./server/...
  - id: shared-typecheck
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 15m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        pnpm install --frozen-lockfile
        pnpm --filter @colony2/shared typecheck
  - id: app-typecheck
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 15m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        pnpm install --frozen-lockfile
        pnpm --filter @colony2/app typecheck
  - id: shared-tests
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 15m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        pnpm install --frozen-lockfile
        pnpm --filter @colony2/shared test
  # Keep direct review navigation and ordinary inline forms visible in diagnostics.
  - id: story-review-tests
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 15m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        pnpm install --frozen-lockfile
        pnpm --filter @colony2/app test src/components/JobStoryPage.test.tsx
        # Exercise history submission and its independent static-message cleanup.
        pnpm --filter @colony2/app test src/components/InputDetailPage.history.test.tsx src/components/InputDetailPage.test.tsx
  # Isolate Env acceptance failures from the broader app and browser suites.
  - id: execution-requirements-tests
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 15m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        pnpm install --frozen-lockfile
        node scripts/verify-command.mjs bash scripts/go.sh test ./server/internal/cortex -run 'Test(JobExecution|RestoredList|ListExecution)'
        pnpm --filter @colony2/app test src/utils/executionRequirements.test.ts src/components/JobEnvironment.test.tsx src/components/JobDetailTabs.test.tsx src/components/JobListDetails.test.tsx
        # Exercise Env in the existing input-artifact keyboard journey at both widths.
        bash scripts/verify-browser.sh node scripts/verify-command.mjs pnpm --filter @colony2/app test:e2e --config playwright.artifact.config.ts --grep 'IA-016,017 queued input artifacts'
  - id: job-id-copy-tests
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 15m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        pnpm install --frozen-lockfile
        # Gate CT-20 against the real message DOM, then require archive and the full focused suite.
        pnpm --filter @colony2/app test src/components/CopyJobId.test.tsx -t CT-20
        pnpm --filter @colony2/app test src/components/JobActionDialog.test.tsx
        pnpm --filter @colony2/app test src/utils/copyText.test.ts src/components/CopyJobId.test.tsx src/components/JobsListPage.test.tsx src/components/JobActionDialog.test.tsx src/components/JobStoryPage.test.tsx
        bash scripts/verify-browser.sh pnpm --filter @colony2/app test:e2e --config playwright.copy.config.ts
        bash scripts/verify-browser.sh pnpm --filter @colony2/app test:e2e --config playwright.fixtures.config.ts --grep 'copies the title job'
  # Gate the delivered editor identity, semantic Link, images and fresh-empty checks.
  - id: composer-tests
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      # Allow bounded cold Go preparation before native server readiness checks.
      timeout: 30m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        pnpm install --frozen-lockfile
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';
        import { createHash } from 'node:crypto';
        import { readFileSync } from 'node:fs';
        const identity = JSON.parse(readFileSync('web/app/vendor/critrev/package-identity.json', 'utf8'));
        const archive = readFileSync(`web/app/vendor/critrev/${identity.tarball}`);
        const app = JSON.parse(readFileSync('web/app/package.json', 'utf8'));
        assert.equal(createHash('sha256').update(archive).digest('hex'), identity.sha256);
        assert.equal('sha512-' + createHash('sha512').update(archive).digest('base64'), identity.integrity);
        assert.equal(app.dependencies.critrev, 'file:vendor/critrev/' + identity.tarball);
        console.log('Verified immutable Critrev delivery:', identity.version);
        NODE
        pnpm --filter @colony2/app test src/components/NewGoalDialog.test.tsx src/components/GoalPrompt.test.tsx src/components/GoalJobOverview.test.tsx src/components/ReviewJobContext.test.tsx src/utils/goalPrompt.test.ts src/utils/promptImages.test.ts
        bash scripts/verify-browser.sh node scripts/verify-command.mjs pnpm --filter @colony2/app test:e2e --config playwright.composer.config.ts
        # Warm the native fixture's Go cache outside its 180-second readiness budget.
        timeout 10m node scripts/verify-command.mjs bash scripts/go.sh build -o /dev/null ./server/cmd/uitestserver
        bash scripts/verify-browser.sh node scripts/verify-command.mjs pnpm --filter @colony2/app test:e2e --config playwright.composer-runtime.config.ts
  - id: app-tests
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 15m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        pnpm install --frozen-lockfile
        pnpm --filter @colony2/app test --exclude src/components/JobStoryPage.test.tsx
  # Exercise acknowledgements that arrive after a successor is discovered.
  - id: input-completion-race-tests
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 15m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        pnpm install --frozen-lockfile
        pnpm --filter @colony2/shared test src/services/inputActivityService.test.ts -t 'completion acknowledgements'
  # Keep availability and request-count regressions visible independently.
  - id: input-discovery-tests
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 15m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        pnpm install --frozen-lockfile
        node scripts/verify-command.mjs bash scripts/go.sh test -count=1 ./server/internal/cortex -run 'TestInputDetailsContract|TestInputStream|TestPending'
        pnpm --filter @colony2/shared test src/services/inputActivityService.test.ts src/contexts/InputActivityContext.test.tsx
        pnpm --filter @colony2/app test src/hooks/useReviewV2.test.tsx src/components/InputDetailPage.test.tsx src/components/PendingInputsSSE.test.tsx src/components/InputFlow.integration.test.tsx
  - id: shared-build
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 15m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        pnpm install --frozen-lockfile
        pnpm --filter @colony2/shared build
  - id: app-build
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 15m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        pnpm install --frozen-lockfile
        pnpm --filter @colony2/app build
  - id: go-build
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 15m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        node scripts/verify-command.mjs make server-build
  - id: installer-tests
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 5m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        node --test npm/cortex/test/*.test.cjs
  - id: image-encoder-preflight
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 10m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        fixture_dir="$(mktemp -d)"
        trap 'rm -rf "$fixture_dir"' EXIT
        ffmpeg -v error -f lavfi -i color=c=blue:s=1280x900 -frames:v 1 -y "$fixture_dir/wide.png"
        for format in jpg gif webp avif bmp; do
          ffmpeg -v error -f lavfi -i color=c=blue:s=2x2 -frames:v 1 -y "$fixture_dir/sample.$format"
        done
  - id: restart-browser-tests
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 15m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        pnpm install --frozen-lockfile
        bash scripts/verify-browser.sh node scripts/verify-command.mjs pnpm --filter @colony2/app test:e2e --config playwright.recovery.config.ts recovery-stage1.spec.ts --retries=0
  # Saved-diff contracts must pass before checking the production review UI.
  - id: workspace-diff-contract-tests
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 15m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        pnpm install --frozen-lockfile
        bash scripts/verify-workspace-diff.sh
        # Recover original saved bytes across patchless unchanged handoffs,
        # independently of the review's document attachments.
        node scripts/verify-command.mjs bash scripts/go.sh test -count=1 ./server/cmd/changestestserver -run '^TestWorkspaceDiffHTTPUnchangedHandoffs$'
  # Saved comparisons use native HTTP/SQLite fixtures and a production server.
  - id: changes-browser-tests
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 15m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        pnpm install --frozen-lockfile
        bash scripts/verify-browser.sh node scripts/verify-command.mjs pnpm --filter @colony2/app test:e2e --config playwright.changes.config.ts --retries=0
  - id: review-v2-browser-tests
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 15m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        pnpm install --frozen-lockfile
        bash scripts/verify-browser.sh node scripts/verify-command.mjs pnpm --filter @colony2/app test:e2e --config playwright.review-history.config.ts review-v2-usability.spec.ts input-discovery.spec.ts
  # Catch discovery regressions separately while retaining both upstream browser shards.
  - id: input-discovery-browser-regressions
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 30m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        pnpm install --frozen-lockfile
        bash scripts/verify-browser.sh node scripts/verify-command.mjs pnpm --filter @colony2/app test:e2e --config playwright.review-history.config.ts job-relationships.spec.ts mobile.spec.ts navigation.spec.ts review-document-history.spec.ts review-queue.spec.ts review-scroll.spec.ts story-scroll.spec.ts --grep 'REL-|JS-024|phone review|badges update|H[0-9]|PR-009|Reviews controls|REV-|RC-|RM-|JS-SC-003 wheel|JS-SC-004 trusted' --retries=0 --global-timeout=1500000
  # Keep the complete general suite, but give each half a fresh execution window
  # and fresh servers. Both sequential shards must pass before runtime checks.
  - id: browser-tests-shard-1
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      # Allow bounded cold builds, then 55 minutes of tests and shutdown time.
      timeout: 75m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        pnpm install --frozen-lockfile
        timeout 15m node scripts/verify-command.mjs bash scripts/prepare-browser-tests.sh
        bash scripts/verify-browser.sh node scripts/verify-command.mjs pnpm test:e2e --project=chromium --project=review-development --shard=1/2 --global-timeout=3300000
  - id: browser-tests-shard-2
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      # Match shard 1; this is a separate managed task, not a timeout retry.
      timeout: 75m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        pnpm install --frozen-lockfile
        timeout 15m node scripts/verify-command.mjs bash scripts/prepare-browser-tests.sh
        bash scripts/verify-browser.sh node scripts/verify-command.mjs pnpm test:e2e --project=chromium --project=review-development --shard=2/2 --global-timeout=3300000
  - id: runtime-browser-tests
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 45m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        pnpm install --frozen-lockfile
        timeout 15m node scripts/verify-command.mjs bash scripts/prepare-browser-tests.sh
        bash scripts/verify-browser.sh node scripts/verify-command.mjs pnpm test:e2e --project=production --project=previous-worker --project=goals-runtime --global-timeout=1500000 --retries=0
  - id: artifact-browser-tests
    op: command_execution
    const: true
    inputs:
      working_directory: '${{ context.environment.op.worktree_path }}'
      shell: bash
      timeout: 30m
      continue_on_error: false
      capture_diagnostics: always
      env: *verification-env
      run: |
        set -euo pipefail
        export GOTOOLCHAIN="go$(cat .go-version)"
        pnpm install --frozen-lockfile
        bash scripts/verify-browser.sh node scripts/verify-command.mjs pnpm --filter @colony2/app test:e2e --config playwright.artifact.config.ts --retries=0
# Native failures propagate to the caller's existing repair handlers.
# Successful command logs remain attached to their individual tasks.
outputs:
  api_version: c2.build-hook/v1
  status: passed
  summary: All required Cortex verification tasks passed.
  artifact_refs: {}
