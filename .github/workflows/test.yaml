name: Test

on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04-arm, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      READ_ALL_REPOS_TOKEN: ${{ secrets.READ_ALL_C2_REPOS }}
      CORTEX_PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: server/go.sum

      - name: Configure private module access
        shell: bash
        run: |
          set -euo pipefail
          go env -w GOPRIVATE=github.com/colony-2/*
          if [ -n "${READ_ALL_REPOS_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${READ_ALL_REPOS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright's bundled encoder records video but cannot generate the
      # recipe's image fixtures. Pin a full distribution for all runner families;
      # Ubuntu 22.04's system FFmpeg predates AVIF output support.
      - name: Set up Python for FFmpeg installation
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install full FFmpeg for review fixtures
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: imageio-ffmpeg==0.8.1
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          python -c 'import imageio_ffmpeg, shutil, sys; shutil.copy2(imageio_ffmpeg.get_ffmpeg_exe(), sys.argv[1])' "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"

      - name: Verify review image encoders
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version
          fixture_dir="$(mktemp -d)"
          trap 'rm -rf "$fixture_dir"' EXIT
          ffmpeg -v error -f lavfi -i color=c=blue:s=1280x900 -frames:v 1 -y "$fixture_dir/wide.png"
          for format in jpg gif webp avif bmp; do
            ffmpeg -v error -f lavfi -i color=c=blue:s=2x2 -frames:v 1 -y "$fixture_dir/sample.$format"
          done

      - name: Install Playwright browser and dependencies
        run: pnpm --filter @colony2/app exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.CORTEX_PLAYWRIGHT_BROWSERS_PATH }}

      - name: Run tests and build embedded application
        run: pnpm test

      - name: Test npm installer
        run: node --test npm/cortex/test/*.test.cjs

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: |
            web/app/test-results/
            web/app/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
