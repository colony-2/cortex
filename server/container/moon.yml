id: 'be-container'
language: 'go'
type: 'library'

project:
  description: Manages devcontainer lifecycle and Docker container operations for development environments.

tasks:
  integration:
    command: 'go test -tags=e2e -v ./...'
    inputs:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
    platform: 'system'
    options:
      runInCI: false
    description: 'Run end-to-end tests that create real Docker containers'

  install:
    script: |
      go install -tags=prod -ldflags="-X main.defaultPort=8081" ./cmd/shai
    platform: system
    options:
      runInCI: true
      outputStyle: buffer-only-failure
