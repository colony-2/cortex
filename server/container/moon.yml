id: 'be-container'
language: 'go'
type: 'library'

project:
  description: Manages devcontainer lifecycle and Docker container operations for development environments.

tasks:
  build-shai:
    command: 'go build -o ./bin/shai ./cmd/shai'
    inputs:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
    outputs:
      - 'bin/shai'
    platform: 'system'
    options:
      runInCI: true
    description: 'Build the shai CLI binary'

  integration:
    command: './scripts/test-integration.sh'
    deps:
      - 'build-shai'
    inputs:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/test-integration.sh'
      - 'scripts/test-shai-container.sh'
    platform: 'system'
    options:
      runInCI: false
    description: 'Run end-to-end tests that create real Docker containers'

  install:
    script: |
      go install -tags=prod -ldflags="-X main.defaultPort=8081" ./cmd/shai
    platform: system
    options:
      runInCI: true
      outputStyle: buffer-only-failure
