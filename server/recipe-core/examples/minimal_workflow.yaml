# Minimal recipe example - demonstrates basic unified structure
name: hello_world
description: A minimal recipe that demonstrates basic structure
version: "1.0"

inputs:
  - name: name
    type: string
    required: true
    description: Name to greet

outputs:
  - name: greeting
    value: "{{ .Steps.greet.outputs.result }}"
    type: string
    description: The greeting message

steps:
  - id: greet
    name: Generate Greeting
    uses: echo_activity
    inputs:
      message: "Hello, {{ .Inputs.name }}!"
    outputs:
      result: ".greeting_message"