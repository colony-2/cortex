name: codex.exec
description: Runs Codex via the selector-backed extension mechanism
shell: bash
run: |
  cd "$VIBETHIS_PROJECT_ROOT"
  exec go run ./server/ops/cmd/opshim codex.exec
timeout: 30m
input_schema:
  type: object
  required: [prompt]
  properties:
    prompt:
      type: string
    sessionId:
      type: string
    model:
      type: string
    env:
      type: object
      additionalProperties:
        type: string
    skill:
      type: string
    skills:
      type: array
      items:
        type: string
    skill_mode:
      type: string
    skill_selection_mode:
      type: string
    return_on:
      type: array
      items:
        type: string
    status_contract:
      type: object
    resume_context:
      type: object
    workdir_path:
      type: string
    worktree_path:
      type: string
    artifact_inbox_path:
      type: string
    artifact_outbox_path:
      type: string
    cell_relative_path:
      type: string
output_schema:
  type: object
  properties:
    status:
      type: string
    sessionId:
      type: string
    assistantSummary:
      type: string
    incompleteReason:
      type: string
    incompleteCategory:
      type: string
    pendingDependencies:
      type: array
      items:
        type: object
    skills_installed:
      type: array
      items:
        type: string
    outcome:
      type: object
