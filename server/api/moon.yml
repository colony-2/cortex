# https://moonrepo.dev/docs/config/project
$schema: '../../.moon/cache/schemas/project.json'

id: 'be-api'
language: 'go'

project:
  description: 'Web server handlers and middleware'
  channel: '#backend'

tasks:
  # Build test server binary for e2e testing
  build-test-server:
    command: 'go'
    args: 
      - 'build'
      - '-o'
      - 'build/testserver'
      - './cmd/testserver'
    outputs:
      - 'build/testserver'
    options:
      runInCI: true
      outputStyle: buffer-only-failure

  # Build test server binary for e2e testing
  serve:
    command: 'go'
    args:
      - 'run'
      - './cmd/testserver'
    options:
      runInCI: false
