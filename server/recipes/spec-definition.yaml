version: "1.0"

input_schema:
  default_provider:
    type: string
    description: Default LLM provider (openai, anthropic, gemini)
    default_value: openai
  default_model:
    type: string
    description: Default model name for provider
    default_value: gpt-4o-mini

# Spec Definition Recipe
# Iteratively generates a Markdown spec from a user prompt.
# Flow: collect user prompt -> generate doc -> user review (approve/reject+reason) -> loop on reject

state:
  initial: collect
  states:
    collect:
      desc: "Collect initial user prompt"
      sequence:
        - id: user_prompt
          op: input
          inputs:
            box_id: "spec-definition"
            activity_id: "collect-user-prompt"
      outputs:
        user_prompt: "{{ sequence.user_prompt.outputs.response }}"
      transitions:
        - to: generate

    generate:
      desc: "Generate or refine the Markdown spec"
      sequence:
        # Initial generation: only use the initial user prompt, no review or previous doc context
        - id: llm_initial
          when: "size(states.generate.runs) == 0 && size(states.review.runs) == 0"
          op: llm_inference2
          inputs:
            default_provider: "{{ inputs.default_provider }}"
            default_model: "{{ inputs.default_model }}"
            system_prompt: |
              You are a meticulous, senior systems designer. Follow instructions precisely. Always return only the final Markdown document unless using tools.
            enable_tool_execution: true
            execute_tools: true
            max_tool_rounds: 4
            continue_on_tool_error: true
            default_working_dir: "."
            tool_working_dir: "."
            tools:
              - name: write_file
                description: Write or update a file with the specified content
                parameters: |
                  {
                    "type": "object",
                    "properties": {
                      "path": {"type": "string"},
                      "content": {"type": "string"},
                      "create_dirs": {"type": "boolean", "default": true}
                    },
                    "required": ["path", "content"]
                  }
            prompt: |
              You are a senior systems designer. Produce a complete, well-structured Markdown specification document.
              - Use clear headings, subsections, tables and code blocks where relevant.
              - Address requirements explicitly and avoid filler text.
              - Output only valid Markdown (no surrounding JSON), starting with a top-level title.

              Initial user prompt:
              {{ states.collect.outputs.user_prompt }}

              Requirements:
              - Return the full Markdown in your assistant message.
              - Also write the same content to a file named "spec.md" with the write_file tool.

        # Refinement generation: use review history and attach prior spec as file artifact
        - id: llm_refine
          when: "size(states.generate.runs) > 0 || size(states.review.runs) > 0"
          op: llm_inference2
          inputs:
            default_provider: "{{ inputs.default_provider }}"
            default_model: "{{ inputs.default_model }}"
            system_prompt: |
              You are a meticulous, senior systems designer. Improve the attached spec. Address every review point. Maintain coherent structure. Return only the updated Markdown unless using tools.
            enable_tool_execution: true
            execute_tools: true
            max_tool_rounds: 4
            continue_on_tool_error: true
            default_working_dir: "."
            tool_working_dir: "."
            tools:
              - name: write_file
                description: Write or update a file with the specified content
                parameters: |
                  {
                    "type": "object",
                    "properties": {
                      "path": {"type": "string"},
                      "content": {"type": "string"},
                      "create_dirs": {"type": "boolean", "default": true}
                    },
                    "required": ["path", "content"]
                  }
            # Provide previous spec via file artifacts, not inline
            context:
              artifacts:
                - path: "spec.md"
                  label: "Previous Spec"
              file_limits:
                max_file_size: 1048576
                max_total_size: 2097152
                max_file_count: 4
            prompt: |
              You are a senior systems designer. Improve the existing Markdown spec (attached as file) based on review history.
              - Keep structure consistent, fix gaps, and address all review comments.
              - Output only valid Markdown, suitable as a complete standalone document.

              Inputs to consider:
              - Initial prompt: {{ states.collect.outputs.user_prompt }}
              - Review history (oldest to newest): {{ states.review.runs }}

              Requirements:
              - Return the full updated Markdown in your assistant message.
              - Also write the same updated content to "spec.md" via the write_file tool.

        - id: read_spec
          op: command_execution
          inputs:
            run: "cat spec.md || true"
            continue_on_error: true
            shell: "bash"
      outputs:
        # Prefer the file content if it exists, otherwise use whichever LLM step ran
        doc: "${{ sequence.read_spec.outputs.stdout != '' ? sequence.read_spec.outputs.stdout : (sequence.llm_refine.outputs.response != '' ? sequence.llm_refine.outputs.response : sequence.llm_initial.outputs.response) }}"
      transitions:
        - to: review

    review:
      desc: "User approval or rejection with cause"
      sequence:
        - id: decision_input
          op: input
          inputs:
            box_id: "spec-definition"
            activity_id: "review-decision"  # Expect values like: approve | reject
        - id: reason_input
          op: input
          inputs:
            box_id: "spec-definition"
            activity_id: "review-reason"    # Ask for a brief reason when rejecting
      outputs:
        decision: "${{ lower(sequence.decision_input.outputs.response) }}"
        reason: "{{ sequence.reason_input.outputs.response }}"
        approved: "${{ lower(sequence.decision_input.outputs.response) == 'approve' }}"
      transitions:
        - to: done
          when: "lower(sequence.decision_input.outputs.response) == 'approve'"
        # Any non-approve result loops back to regenerate with latest feedback
        - to: generate
          when: "true"

    done:
      desc: "Finalize document"
      # No sequence needed; expose final outputs
      outputs:
        document: "{{ states.generate.outputs.doc }}"
