# Parallel workflow example - demonstrates parallel execution capabilities
workflow:
  name: parallel_processing
  description: Demonstrates parallel step execution
  version: "1.0"
  
  inputs:
    - name: data_sources
      type: array
      required: true
      description: List of data sources to process
  
  outputs:
    - name: aggregated_results
      type: object
      description: Combined results from all parallel operations
  
  workflow:
    type: sequential
    retry_policy:
      initial_interval: 2s
      maximum_attempts: 3
    
    steps:
      # First, validate all sources
      - id: validate
        activity: validate_sources
        inputs:
          sources: "{{ .Inputs.data_sources }}"
        outputs:
          valid_sources: validated_list
      
      # Process sources in parallel
      - id: parallel_process
        parallel:
          - id: process_source_1
            activity: process_data
            inputs:
              source: "{{ index .Steps.validate.outputs.valid_sources 0 }}"
            outputs:
              data: result_1
          
          - id: process_source_2
            activity: process_data
            inputs:
              source: "{{ index .Steps.validate.outputs.valid_sources 1 }}"
            outputs:
              data: result_2
          
          - id: process_source_3
            activity: process_data
            inputs:
              source: "{{ index .Steps.validate.outputs.valid_sources 2 }}"
            outputs:
              data: result_3
      
      # Aggregate results
      - id: aggregate
        activity: combine_results
        inputs:
          results: |
            {{- json (list 
              .Steps.process_source_1.outputs.data
              .Steps.process_source_2.outputs.data
              .Steps.process_source_3.outputs.data
            ) -}}
        outputs:
          combined: final_results
    
    outputs:
      aggregated_results: "{{ .Steps.aggregate.outputs.combined }}"

activities:
  - name: validate_sources
    description: Validate data sources
    timeout: 30s
    inputs:
      - name: sources
        type: array
        required: true
    outputs:
      - name: validated_list
        type: array
  
  - name: process_data
    description: Process a single data source
    timeout: 2m
    inputs:
      - name: source
        type: string
        required: true
    outputs:
      - name: result
        type: object
  
  - name: combine_results
    description: Combine multiple results
    timeout: 1m
    inputs:
      - name: results
        type: array
        required: true
    outputs:
      - name: combined
        type: object