# Workflow using Gemini 2.5-flash for report generation
workflow:
  name: gemini_research_workflow
  description: Research workflow using Google Gemini AI
  version: "1.0"
  
  inputs:
    - name: topic
      type: string
      required: true
      description: The topic to research
  
  outputs:
    - name: report
      type: string
      description: The generated report
  
  workflow:
    type: sequential
    steps:
      - id: generate_report
        activity: gemini_report_activity
        inputs:
          topic: "{{ .Inputs.topic }}"
        outputs:
          report: final_report
    
    outputs:
      report: "{{ .Steps.generate_report.outputs.report }}"

activities:
  - name: gemini_report_activity
    description: Generate a report using Gemini 2.5-flash
    timeout: 2m
    inputs:
      - name: topic
        type: string
        required: true
    outputs:
      - name: final_report
        type: string
    implementation:
      type: ai_prompt
      config:
        provider: gemini
        model: gemini-2.0-flash-exp
        temperature: 0.7
        prompt: |
          Generate a concise technical report about "{{ .topic }}". 
          
          Structure the report with:
          1. Executive Summary (2-3 sentences)
          2. Key Concepts (3-5 bullet points)
          3. Current State (1 paragraph)
          4. Future Outlook (1 paragraph)
          
          Keep the total length under 500 words. Be informative and professional.