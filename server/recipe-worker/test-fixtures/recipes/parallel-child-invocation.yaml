id: parallel_analysis_pipeline
version: '1.0'
desc: Parent recipe that runs multiple analysis recipes in parallel and aggregates
  results
inputs:
  document_path: ''
  analysis_depth: standard
sequence:
- id: load_document
  op: document_loader
  inputs:
    path: '{{ .Inputs.document_path }}'
  outputs:
    content: .text_content
    metadata: .document_metadata
- id: sentiment_analysis
  op: recipe
  config:
    recipe: sentiment-analyzer
    timeout: 5m
  inputs:
    text: '{{ .nodes.load_document.outputs.content }}'
    mode: '{{ .Inputs.analysis_depth }}'
  outputs:
    sentiment_score: .result.sentiment_score
    emotions: .result.emotions
- id: topic_extraction
  op: recipe
  config:
    recipe: topic-extractor
    timeout: 5m
  inputs:
    text: '{{ .nodes.load_document.outputs.content }}'
    max_topics: 10
  outputs:
    topics: .result.topics
    keywords: .result.keywords
- id: entity_recognition
  op: recipe
  config:
    recipe: entity-recognizer
    timeout: 5m
    retry_policy:
      maximum_attempts: 2
      initial_interval: 3s
  inputs:
    text: '{{ .nodes.load_document.outputs.content }}'
    entity_types:
    - person
    - organization
    - location
    - date
  outputs:
    entities: .result.entities
    relationships: .result.relationships
- id: language_detection
  op: recipe
  config:
    recipe: language-detector
    timeout: 2m
  inputs:
    text: '{{ .nodes.load_document.outputs.content }}'
  outputs:
    primary_language: .result.language
    confidence: .result.confidence
- id: quality_check
  op: analysis_validator
  inputs:
    sentiment_data: '{{ .nodes.sentiment_analysis.outputs }}'
    topic_data: '{{ .nodes.topic_extraction.outputs }}'
    entity_data: '{{ .nodes.entity_recognition.outputs }}'
    language_data: '{{ .nodes.language_detection.outputs }}'
  outputs:
    quality_score: .overall_quality
    issues: .validation_issues
- id: generate_report
  op: report_generator
  inputs:
    document_metadata: '{{ .nodes.load_document.outputs.metadata }}'
    sentiment: '{{ .nodes.sentiment_analysis.outputs.sentiment_score }}'
    emotions: '{{ .nodes.sentiment_analysis.outputs.emotions }}'
    topics: '{{ .nodes.topic_extraction.outputs.topics }}'
    keywords: '{{ .nodes.topic_extraction.outputs.keywords }}'
    entities: '{{ .nodes.entity_recognition.outputs.entities }}'
    language: '{{ .nodes.language_detection.outputs.primary_language }}'
    quality_score: '{{ .nodes.quality_check.outputs.quality_score }}'
  outputs:
    report: .formatted_report
    summary: .executive_summary
outputs:
  analysis_report: '{{ .nodes.generate_report.outputs.report }}'
  executive_summary: '{{ .nodes.generate_report.outputs.summary }}'
  quality_score: '{{ .nodes.quality_check.outputs.quality_score }}'
  detected_issues: '{{ .nodes.quality_check.outputs.issues }}'
