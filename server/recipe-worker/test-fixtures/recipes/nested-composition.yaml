id: nested_composition_demo
desc: Demonstrates nested composition using supported schema nodes
version: 1.0.0
inputs:
  data: ''
outputs:
  final_result: Executed state_machine
sequence:
- id: processor
  state:
    initial: validate
    states:
      validate:
        sequence:
        - id: clean
          op: data_cleaner
          inputs:
            data: '{{ inputs.data }}'
        - id: validate
          op: data_validator
          inputs:
            data: '{{ inputs.data }}'
        transitions:
        - to: process
          when: sequence.validate.outputs.valid == true
        - to: failure
      process:
        state:
          initial: transform
          states:
            transform:
              op: data_transformer
              inputs:
                clean_data: '{{ states.validate.outputs.clean.data }}'
                metadata: '{{ states.validate.outputs.validate }}'
              transitions:
              - to: ml_advanced
                when: states.transform.outputs.data_quality > 0.8
              - to: ml_basic
                when: states.transform.outputs.data_quality <= 0.8
            ml_advanced:
              op: advanced_ml_analyzer
              inputs:
                data: '{{ states.transform.outputs.outputs }}'
              transitions:
              - to: stats
            ml_basic:
              op: basic_ml_analyzer
              inputs:
                data: '{{ states.transform.outputs.outputs }}'
              transitions:
              - to: stats
            stats:
              sequence:
              - id: statistical
                op: statistical_analyzer
                inputs:
                  data: '{{ states.transform.outputs.outputs }}'
              - id: pattern
                op: pattern_detector
                inputs:
                  data: '{{ states.transform.outputs.outputs }}'
              - id: aggregate
                op: result_aggregator
                inputs:
                  statistical: '{{ sequence.statistical.outputs }}'
                  ml: '{{ states.ml_advanced.outputs != null ? states.ml_advanced.outputs : states.ml_basic.outputs }}'
                  patterns: '{{ sequence.pattern.outputs }}'
              transitions:
              - to: finalize
      finalize:
        sequence:
        - id: format_output
          op: output_formatter
          inputs:
            results: '{{ states.process.outputs.aggregate }}'
        - id: create_summary
          op: summary_generator
          inputs:
            data: '{{ states.process.outputs.aggregate }}'
        - id: add_charts
          op: chart_generator
          inputs:
            summary: '{{ sequence.create_summary.outputs.outputs }}'
            data: '{{ states.process.outputs.aggregate }}'
        - id: store_results
          op: result_storage
          inputs:
            data: '{{ states.process.outputs.aggregate }}'
        transitions:
        - to: success
      success:
        terminal: true
        op: echo_activity
        inputs:
          message: completed
        outputs:
          final_result: '{{ states.finalize.outputs.format_output }}'
          report: '{{ states.finalize.outputs.create_summary }}'
          storage_id: '{{ states.finalize.outputs.store_results.id }}'
          status: .completed
      failure:
        terminal: true
        op: error_handler
        inputs:
          message: Validation failed
        error: Processing failed
