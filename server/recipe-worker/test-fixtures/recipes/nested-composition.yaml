id: nested_composition_demo
desc: Demonstrates deeply nested sequential, parallel, and conditional compositions
version: "1.0.0"

inputs:
  - name: data
    type: string
    required: true
    description: Input data to process

outputs:
  - name: final_result
    value: "{{ .nodes.processor.final_result }}"
    type: object
    description: Final processed result

sequence:
  - id: processor
    name: Nested Composition Processor
    op: state_machine
    config:
      initial_state: orchestration
      states:
        orchestration:
          # Top-level sequential composition
          sequential:
            - id: stage1
              name: Data Preparation Stage
              # Parallel within sequential
              parallel:
                - id: clean
                  op: data_cleaner
                  inputs:
                    data: "{{ .Inputs.data }}"
                
                - id: validate
                  op: data_validator
                  inputs:
                    data: "{{ .Inputs.data }}"
                
                - id: metadata
                  # Sequential within parallel within sequential
                  sequential:
                    - id: extract_meta
                      op: metadata_extractor
                      inputs:
                        data: "{{ .Inputs.data }}"
                    
                    - id: enrich_meta
                      op: metadata_enricher
                      inputs:
                        metadata: "{{ .nodes.extract_meta.outputs }}"
            
            - id: stage2
              name: Processing Stage
              # Conditional within sequential
              conditional:
                - when: ".nodes.stage1.outputs.validate.is_valid == true"
                  # Sequential within conditional within sequential
                  sequential:
                    - id: transform
                      op: data_transformer
                      inputs:
                        clean_data: "{{ .nodes.stage1.outputs.clean.data }}"
                        metadata: "{{ .nodes.stage1.outputs.metadata.enrich_meta }}"
                    
                    - id: analyze
                      # Parallel within sequential within conditional within sequential
                      parallel:
                        - id: statistical
                          op: statistical_analyzer
                          inputs:
                            data: "{{ .nodes.transform.outputs }}"
                        
                        - id: ml_analysis
                          # Conditional within parallel within sequential within conditional within sequential
                          conditional:
                            - when: ".nodes.transform.outputs.data_quality > 0.8"
                              op: advanced_ml_analyzer
                              inputs:
                                data: "{{ .nodes.transform.outputs }}"
                            
                            - default: true
                              op: basic_ml_analyzer
                              inputs:
                                data: "{{ .nodes.transform.outputs }}"
                        
                        - id: pattern
                          op: pattern_detector
                          inputs:
                            data: "{{ .nodes.transform.outputs }}"
                    
                    - id: aggregate
                      op: result_aggregator
                      inputs:
                        statistical: "{{ .nodes.analyze.outputs.statistical }}"
                        ml: "{{ .nodes.analyze.outputs.ml_analysis }}"
                        patterns: "{{ .nodes.analyze.outputs.pattern }}"
                
                - default: true
                  op: error_handler
                  inputs:
                    validation_errors: "{{ .nodes.stage1.outputs.validate.errors }}"
            
            - id: stage3
              name: Finalization Stage
              # Another parallel within sequential
              parallel:
                - id: format_output
                  op: output_formatter
                  inputs:
                    results: "{{ .nodes.stage2.outputs }}"
                
                - id: generate_report
                  # Sequential within parallel within sequential
                  sequential:
                    - id: create_summary
                      op: summary_generator
                      inputs:
                        data: "{{ .nodes.stage2.outputs }}"
                    
                    - id: add_charts
                      op: chart_generator
                      inputs:
                        summary: "{{ .nodes.create_summary.outputs }}"
                        data: "{{ .nodes.stage2.outputs }}"
                
                - id: store_results
                  op: result_storage
                  inputs:
                    data: "{{ .nodes.stage2.outputs }}"
          
          transitions:
            - to: success
              when: ".Outputs.stage3 != null"
            - to: failure
        
        success:
          terminal: true
          outputs:
            final_result: "{{ .States.orchestration.outputs.stage3.format_output }}"
            report: "{{ .States.orchestration.outputs.stage3.generate_report }}"
            storage_id: "{{ .States.orchestration.outputs.stage3.store_results.id }}"
            status: "completed"
        
        failure:
          terminal: true
          error: "Processing failed"
          outputs:
            error: "Processing failed at orchestration stage"