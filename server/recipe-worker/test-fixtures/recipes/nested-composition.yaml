id: nested_composition_demo
desc: Demonstrates nested composition using supported schema nodes
version: 1.0.0
input_schema:
  data:
    type: string
    default_value: ""
inputs:
  data: '{{ inputs.data }}'
outputs:
  final_result: Executed state_machine
sequence:
- id: processor
  state:
    initial: validate
    states:
      validate:
        sequence:
        - id: clean
          op: data_cleaner
          inputs:
            data: '{{ inputs.data }}'
        - id: validate
          op: data_validator
          inputs:
            data: '{{ inputs.data }}'
        transitions:
        - to: process
      process:
        sequence:
        - id: transform
          op: data_transformer
          inputs:
            data: '{{ states.validate.outputs.data }}'
        - id: aggregate
          op: result_aggregator
          inputs:
            data: '{{ sequence.transform.outputs.data }}'
        transitions:
        - to: finalize
      finalize:
        sequence:
        - id: format_output
          op: output_formatter
          inputs:
            data: '{{ states.process.outputs.aggregate }}'
        - id: create_summary
          op: summary_generator
          inputs:
            data: '{{ states.process.outputs.aggregate }}'
        - id: add_charts
          op: chart_generator
          inputs:
            data:
              summary: '{{ sequence.create_summary.outputs.outputs }}'
              report: '{{ states.process.outputs.aggregate }}'
        - id: store_results
          op: result_storage
          inputs:
            data: '{{ states.process.outputs.aggregate }}'
        transitions:
        - to: success
      success:
        terminal: true
        op: echo_activity
        inputs:
          message: completed
        outputs:
          final_result: '{{ states.finalize.outputs.format_output }}'
          report: '{{ states.finalize.outputs.create_summary }}'
          storage_id: '{{ states.finalize.outputs.store_results.id }}'
          status: .completed
