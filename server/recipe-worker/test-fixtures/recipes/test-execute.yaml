name: test-execute
description: Test recipe for execution refactoring
version: "1.0"

inputs:
  - name: message
    type: string
    required: true
    description: Test message

outputs:
  - name: message
    type: string
    value: "{{ .nodes.echo_message.stdout }}"
    description: Output message

sequence:
  - id: echo_message
    op: command_execution
    inputs:
      run: "echo {{ .Inputs.message }}"