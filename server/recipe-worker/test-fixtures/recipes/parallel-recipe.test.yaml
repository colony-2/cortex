tests:
  - name: "basic_parallel_processing"
    description: "Test basic parallel processing of data sources"
    inputs:
      data_sources:
        - "source1"
        - "source2"
        - "source3"
    want:
      aggregated_results:
        source1: "processed"
        source2: "processed"
        source3: "processed"
    wantErr: false

  - name: "single_source"
    description: "Test parallel processing with single source"
    inputs:
      data_sources:
        - "single_source"
    want:
      aggregated_results:
        single_source: "processed"
    wantErr: false

  - name: "empty_sources"
    description: "Test with empty data sources array"
    inputs:
      data_sources: []
    want:
      aggregated_results: {}
    wantErr: false

  - name: "missing_data_sources"
    description: "Test with missing required data sources"
    inputs: {}
    want: {}
    wantErr: true

  - name: "large_parallel_batch"
    description: "Test parallel processing with many sources"
    inputs:
      data_sources:
        - "source1"
        - "source2"
        - "source3"
        - "source4"
        - "source5"
        - "source6"
        - "source7"
        - "source8"
        - "source9"
        - "source10"
    want:
      aggregated_results:
        source1: "processed"
        source10: "processed"
    wantErr: false