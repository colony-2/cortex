# Parallel recipe example - demonstrates parallel execution capabilities
name: parallel_processing
description: Demonstrates parallel step execution
version: "1.0"

inputs:
  - name: data_sources
    type: array
    required: true
    description: List of data sources to process

outputs:
  - name: aggregated_results
    type: object
    description: Combined results from all parallel operations

steps:
  # First, validate all sources
  - id: validate
    uses: validate_sources
    inputs:
      sources: "{{ .Inputs.data_sources }}"
    outputs:
      valid_sources: validated_list
  
  # Process sources in parallel
  - id: parallel_process
    parallel:
      steps:
        - id: process_source_1
          uses: process_data
          inputs:
            source: "{{ index .Steps.validate.outputs.valid_sources 0 }}"
          outputs:
            data: result_1
        
        - id: process_source_2
          uses: process_data
          inputs:
            source: "{{ index .Steps.validate.outputs.valid_sources 1 }}"
          outputs:
            data: result_2
        
        - id: process_source_3
          uses: process_data
          inputs:
            source: "{{ index .Steps.validate.outputs.valid_sources 2 }}"
          outputs:
            data: result_3
  
  # Aggregate results
  - id: aggregate
    uses: combine_results
    inputs:
      results: |
        {{- json (list 
          .Steps.process_source_1.outputs.data
          .Steps.process_source_2.outputs.data
          .Steps.process_source_3.outputs.data
        ) -}}
    outputs:
      combined: final_results

shared:
  validate_sources:
    uses: validate_sources
    config:
      type: function
      timeout: 30s
      description: Validate data sources
  
  process_data:
    uses: process_data
    config:
      type: function
      timeout: 2m
      description: Process a single data source
  
  combine_results:
    uses: combine_results
    config:
      type: function
      timeout: 1m
      description: Combine multiple results