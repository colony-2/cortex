id: parallel_processing
desc: Demonstrates parallel step execution
version: '1.0'
inputs:
  data_sources: []
outputs:
  aggregated_results: '{{ .outputs.aggregated_results }}'
sequence:
- id: validate
  op: validate_sources
  inputs:
    sources: '{{ .Inputs.data_sources }}'
  outputs:
    valid_sources: validated_list
- id: process_source_1
  op: process_data
  inputs:
    source: '{{ index .nodes.validate.outputs.valid_sources 0 }}'
  outputs:
    data: result_1
- id: process_source_2
  op: process_data
  inputs:
    source: '{{ index .nodes.validate.outputs.valid_sources 1 }}'
  outputs:
    data: result_2
- id: process_source_3
  op: process_data
  inputs:
    source: '{{ index .nodes.validate.outputs.valid_sources 2 }}'
  outputs:
    data: result_3
- id: aggregate
  op: combine_results
  inputs:
    results: "{{- json (list \n  .nodes.process_source_1.outputs.data\n  .nodes.process_source_2.outputs.data\n\
      \  .nodes.process_source_3.outputs.data\n) -}}\n"
  outputs:
    combined: final_results
defs:
  validate_sources:
    op: validate_sources
    config:
      type: function
      timeout: 30s
      description: Validate data sources
  process_data:
    op: process_data
    config:
      type: function
      timeout: 2m
      description: Process a single data source
  combine_results:
    op: combine_results
    config:
      type: function
      timeout: 1m
      description: Combine multiple results
