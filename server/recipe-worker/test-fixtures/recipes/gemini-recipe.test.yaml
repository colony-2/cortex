tests:
  - name: "basic_research"
    description: "Test basic research report generation"
    inputs:
      topic: "Artificial Intelligence"
    want:
      report: "Research Report on Artificial Intelligence"
    wantErr: false

  - name: "technical_topic"
    description: "Test research on technical topic"
    inputs:
      topic: "Quantum Computing Applications"
    want:
      report: "Research Report on Quantum Computing Applications"
    wantErr: false

  - name: "missing_topic"
    description: "Test with missing required topic"
    inputs: {}
    want: {}
    wantErr: true

  - name: "empty_topic"
    description: "Test with empty topic string"
    inputs:
      topic: ""
    want:
      report: "Research Report"
    wantErr: false