id: unified_data_pipeline
desc: Data pipeline using unified activity model with shared activities
version: '1.0'
inputs:
  data_sources: []
  output_format: json
outputs:
  processed_data: '{{ .outputs.processed_data }}'
  summary: '{{ .outputs.summary }}'
sequence:
- id: validate
  op: shared/data-validator
  inputs:
    sources: '{{ inputs.data_sources }}'
    format: '{{ inputs.output_format }}'
  outputs:
    validated_sources: .sources
    validation_report: .report
- id: parallel_processing
  parallel:
  - id: process_batch_1
    op: shared/data-processor
    inputs:
      sources: '{{ slice sequence.validate.outputs.validated_sources 0 (div (len sequence.validate.outputs.validated_sources)
        2) }}'
      batch_id: batch_1
    outputs:
      processed: .batch_1_data
  - id: process_batch_2
    op: shared/data-processor
    inputs:
      sources: '{{ slice sequence.validate.outputs.validated_sources (div (len sequence.validate.outputs.validated_sources)
        2) (len sequence.validate.outputs.validated_sources) }}'
      batch_id: batch_2
    outputs:
      processed: .batch_2_data
- id: combine
  op: combine_results
  inputs:
    batch_1: '{{ sequence.process_batch_1.outputs.processed }}'
    batch_2: '{{ sequence.process_batch_2.outputs.processed }}'
    format: '{{ inputs.output_format }}'
  outputs:
    combined: .final_data
- id: summarize
  op: shared/data-analyzer
  inputs:
    data: '{{ sequence.combine.outputs.combined }}'
    validation_report: '{{ sequence.validate.outputs.validation_report }}'
  outputs:
    summary: .analysis_summary
defs:
  data-validator:
    op: validate_sources
    config:
      type: function
      timeout: 1m
      description: Validate and prepare data sources
  data-processor:
    op: process_data
    config:
      type: function
      timeout: 5m
      parallel_enabled: true
      description: Process data sources in parallel batches
  data-analyzer:
    op: llm
    config:
      type: ai_prompt
      model: gpt-4
      temperature: 0.3
      timeout: 2m
      prompt: '{ "Analyze the following data processing results and provide a summary:


        Data: " + outputs.data + "

        Validation Report: " + outputs.validation_report + "


        Provide:

        1. Data quality assessment

        2. Key insights and patterns

        3. Processing statistics

        4. Recommendations for optimization


        Format as structured JSON." }'
