tests:
  - name: "standard_processing"
    description: "Test standard processing mode with multiple datasets"
    inputs:
      dataset_ids:
        - "dataset-001"
        - "dataset-002"
        - "dataset-003"
      processing_mode: "standard"
    want:
      processing_summary:
        total_processed: 3
        successful: 3
        failed: 0
      final_data:
        dataset-001: "processed"
        dataset-002: "processed"
        dataset-003: "processed"
      child_execution_ids:
        - "exec-001"
        - "exec-002"
        - "exec-003"
    wantErr: false

  - name: "fast_processing"
    description: "Test fast processing mode"
    inputs:
      dataset_ids:
        - "dataset-001"
      processing_mode: "fast"
    want:
      processing_summary:
        total_processed: 1
        successful: 1
      final_data:
        dataset-001: "processed"
    wantErr: false

  - name: "thorough_processing"
    description: "Test thorough processing mode"
    inputs:
      dataset_ids:
        - "dataset-001"
        - "dataset-002"
      processing_mode: "thorough"
    want:
      processing_summary:
        total_processed: 2
        successful: 2
      final_data:
        dataset-001: "thoroughly processed"
        dataset-002: "thoroughly processed"
    wantErr: false

  - name: "default_mode"
    description: "Test with default processing mode"
    inputs:
      dataset_ids:
        - "dataset-001"
    want:
      processing_mode: "standard"
      processing_summary:
        total_processed: 1
    wantErr: false

  - name: "missing_dataset_ids"
    description: "Test with missing required dataset_ids"
    inputs:
      processing_mode: "standard"
    want: {}
    wantErr: true