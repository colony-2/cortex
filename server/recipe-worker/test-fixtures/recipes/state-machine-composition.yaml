name: advanced_document_processor
description: Advanced document processing pipeline with state machine composition
version: 1.0.0

inputs:
  - name: document
    type: string
    required: true
    description: Document to process
  - name: document_type
    type: string
    required: false
    default: auto
    description: Type of document (structured, unstructured, or auto)
  - name: analysis_depth
    type: string
    required: false
    default: medium
    description: Depth of analysis (quick, medium, or deep)
  - name: priority
    type: string
    required: false
    default: normal
    description: Processing priority (high, normal, low)
  - name: output_format
    type: string
    required: false
    default: json
    description: Output format (report, api, json)

outputs:
  - name: result
    value: "{{ .Steps.document_processor.result }}"
    type: object
    description: Processed document result
  - name: metadata
    value: "{{ .Steps.document_processor.metadata }}"
    type: object
    description: Processing metadata

steps:
  - id: document_processor
    name: Document Processing State Machine
    uses: state_machine
    config:
      initial_state: intake
      timeout: 30m
      states:
        # Intake state with conditional composition
        intake:
          conditional:
            - when: ".Inputs.document_type == 'structured'"
              parallel:
                - id: extract_fields
                  uses: field_extractor
                  inputs:
                    doc: "{{ .Inputs.document }}"
                
                - id: validate_schema
                  uses: schema_validator
                  inputs:
                    doc: "{{ .Inputs.document }}"
            
            - when: ".Inputs.document_type == 'unstructured'"
              sequential:
                - id: detect_language
                  uses: language_detector
                  inputs:
                    doc: "{{ .Inputs.document }}"
                
                - id: extract_content
                  conditional:
                    - when: ".Steps.detect_language.outputs.language == 'en'"
                      uses: english_extractor
                    - when: ".Steps.detect_language.outputs.language == 'es'"
                      uses: spanish_extractor
                    - default: true
                      uses: universal_extractor
                  inputs:
                    doc: "{{ .Inputs.document }}"
            
            - default: true
              uses: auto_classifier
              inputs:
                doc: "{{ .Inputs.document }}"
          
          transitions:
            - to: processing
              when: ".Outputs != null"
        
        # Processing state with nested compositions
        processing:
          sequential:
            - id: prepare_data
              parallel:
                - id: clean
                  uses: data_cleaner
                  inputs:
                    data: "{{ .States.intake.outputs }}"
                
                - id: normalize
                  uses: data_normalizer
                  inputs:
                    data: "{{ .States.intake.outputs }}"
                
                - id: enhance_metadata
                  sequential:
                    - id: extract_entities
                      uses: entity_extractor
                      inputs:
                        data: "{{ .States.intake.outputs }}"
                    
                    - id: link_entities
                      uses: entity_linker
                      inputs:
                        entities: "{{ .Steps.extract_entities.outputs.entities }}"
            
            - id: analyze
              conditional:
                - when: ".Inputs.analysis_depth == 'deep'"
                  parallel:
                    - id: sentiment
                      uses: sentiment_analyzer
                      inputs:
                        text: "{{ .Steps.prepare_data.outputs.clean.text }}"
                    
                    - id: topics
                      uses: topic_modeler
                      inputs:
                        text: "{{ .Steps.prepare_data.outputs.clean.text }}"
                    
                    - id: ml_pipeline
                      sequential:
                        - id: feature_extract
                          uses: feature_extractor
                          inputs:
                            data: "{{ .Steps.prepare_data.outputs.normalize.data }}"
                        
                        - id: classify
                          uses: ml_classifier
                          inputs:
                            features: "{{ .Steps.feature_extract.outputs.features }}"
                        
                        - id: confidence_check
                          conditional:
                            - when: ".Steps.classify.outputs.confidence > 0.95"
                              uses: high_confidence_processor
                            - when: ".Steps.classify.outputs.confidence > 0.7"
                              uses: medium_confidence_processor
                            - default: true
                              parallel:
                                - id: human_review
                                  uses: send_to_review_queue
                                - id: uncertainty_sampling
                                  uses: active_learning_sampler
                          inputs:
                            classification: "{{ .Steps.classify.outputs.result }}"
                
                - when: ".Inputs.analysis_depth == 'quick'"
                  uses: fast_analyzer
                  inputs:
                    data: "{{ .Steps.prepare_data.outputs.clean.text }}"
                
                - default: true
                  sequential:
                    - id: basic_analysis
                      uses: standard_analyzer
                      inputs:
                        data: "{{ .Steps.prepare_data.outputs.clean.text }}"
                    
                    - id: should_enhance
                      conditional:
                        - when: ".Steps.basic_analysis.outputs.complexity_score > 0.8"
                          uses: enhanced_analyzer
                          inputs:
                            data: "{{ .Steps.prepare_data.outputs.clean.text }}"
                            initial: "{{ .Steps.basic_analysis.outputs.results }}"
                        - default: true
                          uses: finalize_basic
                          inputs:
                            results: "{{ .Steps.basic_analysis.outputs.results }}"
          
          transitions:
            - to: quality_assurance
              when: ".Outputs.analyze != null"
            - to: error_handling
              when: ".Outputs.analyze.error != null"
        
        # Quality assurance with parallel validation and output generation
        quality_assurance:
          parallel:
            - id: validate_results
              sequential:
                - id: schema_check
                  uses: result_schema_validator
                  inputs:
                    results: "{{ .States.processing.outputs.analyze }}"
                
                - id: business_rules
                  uses: business_rule_engine
                  inputs:
                    results: "{{ .States.processing.outputs.analyze }}"
                    rules: "{{ .Inputs.business_rules }}"
            
            - id: generate_outputs
              conditional:
                - when: ".Inputs.output_format == 'report'"
                  sequential:
                    - id: generate_report
                      uses: report_generator
                      inputs:
                        data: "{{ .States.processing.outputs.analyze }}"
                    
                    - id: add_visualizations
                      parallel:
                        - id: charts
                          uses: chart_generator
                          inputs:
                            data: "{{ .States.processing.outputs.analyze }}"
                        
                        - id: tables
                          uses: table_generator
                          inputs:
                            data: "{{ .States.processing.outputs.analyze }}"
                
                - when: ".Inputs.output_format == 'api'"
                  uses: api_formatter
                  inputs:
                    data: "{{ .States.processing.outputs.analyze }}"
                
                - default: true
                  uses: json_formatter
                  inputs:
                    data: "{{ .States.processing.outputs.analyze }}"
          
          transitions:
            - to: delivery
              when: ".Outputs.validate_results.business_rules.passed == true"
            - to: manual_review
              when: ".Outputs.validate_results.business_rules.requires_review == true"
            - to: rejection
              when: ".Outputs.validate_results.business_rules.failed == true"
        
        # Terminal states
        delivery:
          terminal: true
          outputs:
            result: "{{ .States.quality_assurance.outputs.generate_outputs }}"
            metadata:
              processing_time: "{{ .Context.elapsed_time }}"
              confidence: "{{ .States.processing.outputs.analyze.confidence }}"
              validations: "{{ .States.quality_assurance.outputs.validate_results }}"
        
        manual_review:
          uses: queue_for_review
          inputs:
            data: "{{ .States.quality_assurance.outputs }}"
            reason: "{{ .States.quality_assurance.outputs.validate_results.business_rules.reason }}"
          transitions:
            - to: delivery
              when: ".Outputs.approved == true"
            - to: rejection
              when: ".Outputs.rejected == true"
        
        rejection:
          terminal: true
          error: "Document processing rejected"
          outputs:
            error: "Document processing rejected"
            reason: "{{ .States.quality_assurance.outputs.validate_results.business_rules.reason }}"
        
        error_handling:
          terminal: true
          error: "Processing error occurred"
          outputs:
            error: "{{ .States.processing.outputs.analyze.error }}"