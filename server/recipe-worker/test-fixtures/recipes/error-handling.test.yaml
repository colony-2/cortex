tests:
- name: successful_flow
  description: Test successful execution path
  inputs: {}
  config:
    dataSourceUrl: https://example.com/data
    refreshToken: valid-token
    alertWebhook: https://example.com/alerts
  want:
    savedId: save-123
    processedData: processed
    status: success
  wantErr: false
- name: validation_error
  description: Test validation error handling
  inputs: {}
  config:
    dataSourceUrl: invalid-url
    refreshToken: valid-token
    alertWebhook: https://example.com/alerts
  want:
    error: validation_failed
    errorType: VALIDATION_ERROR
  wantErr: false
- name: auth_failure
  description: Test authentication failure handling
  inputs: {}
  config:
    dataSourceUrl: https://example.com/data
    refreshToken: invalid-token
    alertWebhook: https://example.com/alerts
  want:
    error: authentication_failed
    errorType: AUTH_ERROR
    alertSent: true
  wantErr: false
- name: partial_success
  description: Test partial success with fallback
  inputs: {}
  config:
    dataSourceUrl: https://example.com/data
    refreshToken: valid-token
    alertWebhook: https://example.com/alerts
  want:
    backupId: backup-123
    reconciliationStatus: pending
  wantErr: false
