# Simple unified recipe example
name: simple_research
description: A simple research workflow using unified activity model
version: "1.0"

inputs:
  - name: query
    type: string
    required: true
    description: What to research

outputs:
  - name: result
    value: "{{ .Steps.summarize.outputs.summary }}"
    type: string
    description: Research result

steps:
  - id: search
    name: Quick Search
    uses: quick_search_activity
    inputs:
      query: "{{ .Inputs.query }}"
    outputs:
      data: ".search_results"
  
  - id: summarize
    name: Summarize Results
    uses: summarize_activity
    inputs:
      data: "{{ .Steps.search.outputs.data }}"
    outputs:
      summary: ".final_summary"