id: simple_research
desc: A simple research workflow using unified activity model
version: '1.0'
inputs:
  query: ''
outputs:
  result: '{{ .nodes.summarize.outputs.summary }}'
sequence:
- id: search
  name: Quick Search
  op: quick_search_activity
  inputs:
    query: '{{ .Inputs.query }}'
  outputs:
    data: .search_results
- id: summarize
  name: Summarize Results
  op: summarize_activity
  inputs:
    data: '{{ .nodes.search.outputs.data }}'
  outputs:
    summary: .final_summary
