id: gemini_research_recipe
desc: Research recipe using Google Gemini AI
version: '1.0'
inputs:
  topic: ''
outputs:
  report: '{{ .outputs.report }}'
sequence:
- id: generate_report
  op: gemini_report_activity
  inputs:
    topic: '{{ .Inputs.topic }}'
  outputs:
    report: final_report
defs:
  gemini_report_activity:
    op: llm
    config:
      type: ai_prompt
      provider: gemini
      model: gemini-2.0-flash-exp
      temperature: 0.7
      timeout: 2m
      prompt: "Generate a concise technical report about \"{{ .topic }}\". \n\nStructure\
        \ the report with:\n1. Executive Summary (2-3 sentences)\n2. Key Concepts\
        \ (3-5 bullet points)\n3. Current State (1 paragraph)\n4. Future Outlook (1\
        \ paragraph)\n\nKeep the total length under 500 words. Be informative and\
        \ professional."
