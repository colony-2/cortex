id: template_demo
desc: Demonstrates various template features and expressions
version: '1.0'
inputs:
  items: []
  separator: ', '
# outputs:
#   summary: '{{ sequence.summarize.outputs.result }}'
sequence:
- id: prepare
  op: prepare_data
  inputs:
    # Avoid string-templating into non-string list field
    items: []
    separator: '{{ has(inputs.separator) ? inputs.separator : ", " }}'
- id: format
  op: format_text
  inputs:
    text: 'Processing items: {{ size(inputs.items) }} items'
    # Use numeric literal to avoid string-templated number
    count: 0
- id: analyze
  op: analyze_data
  inputs:
    data: static_data
    metadata:
      source: template_demo
      step_id: static_id
      formatted_output: static_format
- id: summarize
  op: create_summary
  inputs:
    prepared_data: static_prepared
    formatted_text: static_formatted
    analysis: static_analysis
    # Use numeric literal to avoid string-templated number
    item_count: 0
