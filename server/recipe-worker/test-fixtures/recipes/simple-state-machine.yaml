name: simple_data_pipeline
description: Simple data pipeline demonstrating state machine composition features
version: "1.0.0"

# Root is a state machine
states:
  initial: validate
  
  # Simple validation state
  validate:
    op: data_validator
    inputs:
      size: "{{ .inputs.data_size }}"
    transitions:
      - to: process
        when: ".outputs.valid == true"
      - to: error
        when: ".outputs.valid == false"
  
  # Process state with conditional logic (using nested sequence with conditionals)
  process:
    sequence:
      - id: check_size
        op: command_execution
        inputs:
          run: "test {{ .inputs.data_size }} -gt 1000000"
        when: "{{ .inputs.data_size }} > 1000000"
      
      - id: parallel_batch
        parallel:
          - id: batch1
            op: batch_processor
            inputs:
              batch_id: 1
              size: 500000
          
          - id: batch2
            op: batch_processor
            inputs:
              batch_id: 2
              size: 500000
        when: "{{ .nodes.check_size.exit_code }} == 0"
      
      - id: fast_process
        op: fast_processor
        inputs:
          data_size: "{{ .inputs.data_size }}"
        when: "{{ .inputs.priority }} == 'high' && {{ .nodes.check_size.exit_code }} != 0"
      
      - id: standard_process
        op: standard_processor
        inputs:
          data_size: "{{ .inputs.data_size }}"
        when: "{{ .inputs.priority }} != 'high' && {{ .nodes.check_size.exit_code }} != 0"
    
    transitions:
      - to: complete
  
  # Terminal states
  complete:
    op: command_execution
    inputs:
      run: "echo 'Pipeline completed successfully'"
    outputs:
      result: "{{ .states.process.outputs }}"
      status: "success"
  
  error:
    error: "Validation failed"

# Root node properties
inputs:
  data_size: 1000
  priority: "normal"
outputs:
  result: "{{ .states.complete.outputs.result }}"