# https://moonrepo.dev/docs/config/project
$schema: '../../../.moon/cache/schemas/project.json'

id: 'be-vibethis'

project:
  description: 'Main vibethis server application'
  channel: '#backend'

language: 'go'
type: 'application'

tags:
  - 'go'
  - 'backend'
  - 'app'

tasks:
  # ─────────────────────────────────────────────────────────────
  # Build the Go binary *after* the front-end assets are copied.
  # ─────────────────────────────────────────────────────────────
  build:
    script: |
      mkdir -p build
      go build -o build/vibethis .
    deps:
      - '~:build-frontend-copy'
    outputs:
      - build/          # cache the compiled binary

  # ─────────────────────────────────────────────────────────────
  # Copy front-end bundle produced by ui-app:build
  # ─────────────────────────────────────────────────────────────
  build-frontend-copy:
    script: |
      # rsync preserves timestamps and only moves changed files
      rsync -a --delete "$MOON_WORKSPACE_ROOT/web/app/dist/" static/
    inputs:
      - $MOON_WORKSPACE_ROOT/web/app/dist/**/*   # hash depends on UI bundle
    outputs:
      - static/
    deps:
      - 'ui-app:build'
    platform: system

  # ─────────────────────────────────────────────────────────────
  # Local dev server
  # ─────────────────────────────────────────────────────────────
  serve:
    script: go run main.go -n ../../../example
    deps:
      - '~:build-frontend-copy'
    env:
      PORT: '8080'
    local: true         # never runs in CI
    platform: system

  # ─────────────────────────────────────────────────────────────
  # Production install (includes front-end)
  # ─────────────────────────────────────────────────────────────
  install:
    script: |
      go install -tags=prod -ldflags="-X main.defaultPort=8081" .
    deps:
      - '~:build-frontend-copy'
    platform: system
