id: new-ticket-triage
version: 0.1.0
desc: Triage ticket to produce requirements and optional child tickets
input_schema:
  ticket_id:
    type: string
    required: true
  cell:
    type: string
    required: true
sequence:
  - id: draft_requirements
    op: command_execution
    inputs:
      run: |
        set -euo pipefail
        mkdir -p "{{ context.environment.outbox }}"
        cat <<'EOF' > "{{ context.environment.outbox }}/requirements.md"
        # Requirements
        - stub requirement A
        - stub requirement B
        EOF
outputs:
  requirements_artifact: 'requirements.md'
  child_tickets: []
