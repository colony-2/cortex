id: plan-recipe
version: 0.1.0
desc: Codex-driven planning recipe that produces specifications and an execution plan for a ticket
input_schema:
  ticket_id:
    type: string
    required: true
    description: Ticket identifier driving this planning session
  cell:
    type: string
    required: true
    description: Owning cell slug for this ticket
  description:
    type: string
    description: Markdown description of the ticket requirements
  existing_specs:
    type: array
    description: Optional list of existing specification blob references
  constraints:
    type: object
    description: Optional constraint map (budget, deadlines, dependency limits)
  dependency_snapshot:
    type: object
    description: Dependency graph snapshot for the owning cell
  codex_context:
    type: object
    description: Precomputed Codex worktree/blobstore configuration
  validation_threshold:
    type: number
    default_value: 4
    description: Minimum validator score (1..5) before looping back for revisions
  max_validation_attempts:
    type: number
    default_value: 3
    description: Maximum validator loops before escalating to human review
  review_inputs:
    type: object
    description: Extra metadata (validators, reviewers) forwarded to prompts
  stub_mode:
    type: boolean
    default_value: false
    description: Enable deterministic filesystem writes for integration testing
  stub_spec_slug:
    type: string
    description: Override spec slug in stub mode
  stub_spec_content:
    type: string
    description: Inline specification content used when stub_mode is enabled
  stub_plan_content:
    type: string
    description: Inline plan YAML used when stub_mode is enabled
  stub_spec_summary:
    type: string
    description: Override stub summary text for generated specification metadata
  stub_spec_blob_uri:
    type: string
    description: Override stub blob URI for specification metadata
outputs:
  spec_documents: '{{ ".colony2/specs/" + (inputs.ticket_id != null && inputs.ticket_id != "" ? inputs.ticket_id : (inputs.ticketid != null ? inputs.ticketid : "UNKNOWN")) + "-" + (inputs.stub_spec_slug != null && inputs.stub_spec_slug != "" ? inputs.stub_spec_slug : "plan-overview") + ".md" }}'
  recipe_plan: '{{ ".colony2/plan/" + (inputs.ticket_id != null && inputs.ticket_id != "" ? inputs.ticket_id : (inputs.ticketid != null ? inputs.ticketid : "UNKNOWN")) + ".yaml" }}'
  validation_scores: '{{ "stub" }}'
  needs_human_review: false
state:
  initial: bootstrap
  states:
    bootstrap:
      sequence:
        - id: ensure_workspace
          op: command_execution
          inputs:
            run: |
              set -euo pipefail
              mkdir -p ".colony2/specs"
              mkdir -p ".colony2/plan"
        - id: capture_context
          op: command_execution
          inputs:
            run: |
              set -euo pipefail
              echo "Planning {{ inputs.ticket_id }} for {{ inputs.cell }}"
      outputs:
        specs_dir: '.colony2/specs'
        plan_dir: '.colony2/plan'
        plan_path: '{{ ".colony2/plan/" + inputs.ticket_id + ".yaml" }}'
        spec_slug: '{{ has(inputs.stub_spec_slug) && inputs.stub_spec_slug != "" ? inputs.stub_spec_slug : "plan-overview" }}'
        primary_spec_path: '{{ ".colony2/specs/" + inputs.ticket_id + "-" + (has(inputs.stub_spec_slug) && inputs.stub_spec_slug != "" ? inputs.stub_spec_slug : "plan-overview") + ".md" }}'
        codex_worktree: '{{ has(inputs.codex_context) ? (inputs.codex_context.worktree != null ? inputs.codex_context.worktree : ".") : "." }}'
        codex_blobstore: '{{ has(inputs.codex_context) ? (inputs.codex_context.blobstore != null ? inputs.codex_context.blobstore : "stub://blob") : "stub://blob" }}'
        validation_threshold: '{{ has(inputs.validation_threshold) ? inputs.validation_threshold : 4 }}'
        max_validation_attempts: '{{ has(inputs.max_validation_attempts) ? inputs.max_validation_attempts : 3 }}'
      transitions:
        - to: draft_specs
          when: 'true'

    draft_specs:
      sequence:
        - id: codex_draft_specs
          when: 'inputs.stub_mode != true'
          op: codex.exec
          inputs:
            sessionId: 'plan-draft-{{ inputs.ticket_id }}'
            context:
              worktree: '{{ states.bootstrap.outputs.codex_worktree }}'
              blobstore: '{{ states.bootstrap.outputs.codex_blobstore }}'
            prompt: |
              You are "PlanRecipe" generating specification documents for ticket {{ inputs.ticket_id }} in cell {{ inputs.cell }}.
              Ticket description:
              {{ inputs.description }}

              Existing specs (if any):
              {{ inputs.existing_specs }}

              Constraints:
              {{ inputs.constraints }}

              Produce updated specification markdown at {{ states.bootstrap.outputs.primary_spec_path }}.
              Persist drafts incrementally and summarize major decisions. Respond with a short status update.
        - id: stub_write_specs
          when: 'inputs.stub_mode == true'
          op: command_execution
          inputs:
            run: |
              set -euo pipefail
              target="{{ states.bootstrap.outputs.primary_spec_path }}"
              mkdir -p "$(dirname "$target")"
              if [ -n "{{ inputs.stub_spec_content }}" ]; then
                cat <<'EOF_SPEC' > "$target"
              {{ inputs.stub_spec_content }}
              EOF_SPEC
              else
                cat <<'EOF_SPEC' > "$target"
              # {{ inputs.ticket_id }} Plan
              
              ## Context
              Stub specification generated for {{ inputs.cell }}.
              
              ## Goals
              - Ensure stub harness coverage.
              - Demonstrate planning structure.
              
              ## Non-Goals
              - Execute real codex operations.
              EOF_SPEC
              fi
        - id: link_spec_doc
          when: 'inputs.stub_mode != true'
          op: ticket.manage
          inputs:
            ticket_id: '{{ inputs.ticket_id }}'
            actions:
              - type: link_markdown_doc
                name: 'Spec: {{ inputs.ticket_id }}'
                path: '{{ states.bootstrap.outputs.primary_spec_path }}'
                reason: 'PlanRecipe generated specification document'
      outputs:
        spec_documents: '{{ [{"path": ".colony2/specs/" + inputs.ticket_id + "-" + ((inputs.stub_spec_slug != null && inputs.stub_spec_slug != "") ? inputs.stub_spec_slug : "plan-overview") + ".md", "blob_uri": inputs.stub_mode == true ? ((inputs.stub_spec_blob_uri != null && inputs.stub_spec_blob_uri != "") ? inputs.stub_spec_blob_uri : "stub://spec/" + inputs.ticket_id) : "pending://codex/spec/" + inputs.ticket_id, "summary": inputs.stub_mode == true ? ((inputs.stub_spec_summary != null && inputs.stub_spec_summary != "") ? inputs.stub_spec_summary : "Stub specification generated for " + inputs.ticket_id) : "Specification drafted via Codex"}] }}'
        draft_iterations: 1
        validator_feedback: []
      transitions:
        - to: review_cycle
          when: 'true'

    review_cycle:
      sequence:
        - id: validator_backwards
          when: 'inputs.stub_mode != true'
          op: codex.exec
          inputs:
            sessionId: 'plan-validator-bc-{{ inputs.ticket_id }}'
            context:
              worktree: '{{ states.bootstrap.outputs.codex_worktree }}'
              blobstore: '{{ states.bootstrap.outputs.codex_blobstore }}'
            prompt: |
              Review specification {{ states.bootstrap.outputs.primary_spec_path }} for backwards compatibility.
              Produce issues list and a score 1-5.
        - id: validator_coverage
          when: 'inputs.stub_mode != true'
          op: codex.exec
          inputs:
            sessionId: 'plan-validator-coverage-{{ inputs.ticket_id }}'
            context:
              worktree: '{{ states.bootstrap.outputs.codex_worktree }}'
              blobstore: '{{ states.bootstrap.outputs.codex_blobstore }}'
            prompt: |
              Validate coverage of requirements for ticket {{ inputs.ticket_id }}.
              Highlight missing scenarios and provide score 1-5.
        - id: validator_scope
          when: 'inputs.stub_mode != true'
          op: codex.exec
          inputs:
            sessionId: 'plan-validator-scope-{{ inputs.ticket_id }}'
            context:
              worktree: '{{ states.bootstrap.outputs.codex_worktree }}'
              blobstore: '{{ states.bootstrap.outputs.codex_blobstore }}'
            prompt: |
              Evaluate the draft specification for scope drift or extraneous features.
              Return score 1-5 and concrete feedback.
        - id: stub_review
          when: 'inputs.stub_mode == true'
          op: command_execution
          inputs:
            run: |
              set -euo pipefail
              printf 'stub-review\n'
      outputs:
        validator_feedback: '{{ inputs.stub_mode == true ? [] : [] }}'
      transitions:
        - to: plan_synthesis
          when: 'true'

    plan_synthesis:
      sequence:
        - id: codex_plan
          when: 'inputs.stub_mode != true'
          op: codex.exec
          inputs:
            sessionId: 'plan-synthesis-{{ inputs.ticket_id }}'
            context:
              worktree: '{{ states.bootstrap.outputs.codex_worktree }}'
              blobstore: '{{ states.bootstrap.outputs.codex_blobstore }}'
            prompt: |
              Convert accepted specs into RecipePlan YAML at {{ states.bootstrap.outputs.plan_path }}.
              Ensure plan matches schema (version, owning cell, stages) and respects dependency graph.
        - id: stub_plan
          when: 'inputs.stub_mode == true'
          op: command_execution
          inputs:
            run: |
              set -euo pipefail
              plan_target="{{ states.bootstrap.outputs.plan_path }}"
              mkdir -p "$(dirname "$plan_target")"
              if [ -n "{{ inputs.stub_plan_content }}" ]; then
                cat <<'EOF_PLAN' > "$plan_target"
              {{ inputs.stub_plan_content }}
              EOF_PLAN
              else
                cat <<'EOF_PLAN' > "$plan_target"
              version: 1
              owning_cell: {{ inputs.cell }}
              stages:
                - name: spec-review
                  kind: sequence
                  steps:
                    - recipe: noop
                      cell: {{ inputs.cell }}
                      spec_doc: {{ states.bootstrap.outputs.primary_spec_path }}
                - name: implementation-phase
                  kind: sequence
                  steps:
                    - recipe: impl
                      cell: {{ inputs.cell }}
                      spec_doc: {{ states.bootstrap.outputs.primary_spec_path }}
                      git_state: shared
              EOF_PLAN
              fi
        - id: verify_plan_file
          op: command_execution
          inputs:
            run: |
              set -euo pipefail
              test -f "{{ states.bootstrap.outputs.plan_path }}"
      outputs:
        plan_path: '{{ states.bootstrap.outputs.plan_path }}'
        plan_summary: '{{ inputs.stub_mode == true ? "Stub plan synthesized" : "Plan stored at " + states.bootstrap.outputs.plan_path }}'
      transitions:
        - to: validation_loop
          when: 'true'

    validation_loop:
      sequence:
        - id: evaluate_scores
          when: 'inputs.stub_mode == true'
          op: command_execution
          inputs:
            run: |
              set -euo pipefail
              echo '{"backwards_compatibility":5,"coverage":5,"scope_drift":5}'
        - id: collect_scores
          when: 'inputs.stub_mode != true'
          op: command_execution
          inputs:
            run: |
              set -euo pipefail
              echo '{"backwards_compatibility":5,"coverage":5,"scope_drift":5}'
        - id: maybe_request_input
          when: 'false'
          op: input
          inputs:
            activity_id: plan-validation
            config:
              question: 'Provide additional guidance for plan validation.'
      outputs:
        attempt: 1
        scores: '{{ {"backwards_compatibility": 5, "coverage": 5, "scope_drift": 5} }}'
        all_scores_pass: '{{ true }}'
        needs_human_review: false
      transitions:
        - to: finalize
          when: 'true'

    finalize:
      sequence:
        - id: ticket_note
          when: 'inputs.stub_mode != true'
          op: ticket.manage
          inputs:
            ticket_id: '{{ inputs.ticket_id }}'
            actions:
              - type: append_ticket_note
                note: |
                  PlanRecipe summary for {{ inputs.ticket_id }}.
                  Spec documents: {{ states.draft_specs.outputs.spec_documents }}
                  Plan path: {{ states.plan_synthesis.outputs.plan_path }}
                  Validation scores: {{ states.validation_loop.outputs.scores }}
        - id: stub_summary
          when: 'inputs.stub_mode == true'
          op: command_execution
          inputs:
            run: |
              set -euo pipefail
              printf 'summary recorded\n'
      outputs:
        spec_documents: '{{ [{"path": ".colony2/specs/" + inputs.ticket_id + "-" + ((inputs.stub_spec_slug != null && inputs.stub_spec_slug != "") ? inputs.stub_spec_slug : "plan-overview") + ".md", "blob_uri": inputs.stub_mode == true ? ((inputs.stub_spec_blob_uri != null && inputs.stub_spec_blob_uri != "") ? inputs.stub_spec_blob_uri : "stub://spec/" + inputs.ticket_id) : "pending://codex/spec/" + inputs.ticket_id, "summary": inputs.stub_mode == true ? ((inputs.stub_spec_summary != null && inputs.stub_spec_summary != "") ? inputs.stub_spec_summary : "Stub specification generated for " + inputs.ticket_id) : "Specification drafted via Codex"}] }}'
        note_status: '{{ inputs.stub_mode == true ? "stub-recorded" : "ticket-note-appended" }}'
      transitions: []
