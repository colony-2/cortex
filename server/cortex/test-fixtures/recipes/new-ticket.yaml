id: new-ticket
version: 0.1.0
desc: Long-lived ticket recipe orchestrating triage, plan, execute, validate, and approval
input_schema:
  approval_decision:
    type: string
    default_value: ""
    enum:
      - approved
      - rejected
    description: Optional pre-approval to auto-fill completion; omit to require live user input
state:
  initial: triage
  triage:
    transitions:
      - to: plan
    id: triage
    op: recipe.run_and_get_result
    inputs:
      name: new-ticket-triage
      inputs:
        title: '{{ context.ticket.title }}'
        description: '{{ context.ticket.description }}'


  - id: approval
    op: input
    inputs:
      form:
        title: 'Complete ticket?'
        question: 'Approve completion after validation?'
        type: short_answer
        timeout: 1
        default_on_timeout: null
        autofill:
          response: '{{ has(inputs.approval_decision) ? inputs.approval_decision : "" }}'
  - op: ticket.manage
    inputs:
      actions:
        - type: update_ticket
          ticket_id: "{{ context.actor.ticket_id }}"
          stage: completed
