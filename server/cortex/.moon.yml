# https://moonrepo.dev/docs/config/project
$schema: '../../../.moon/cache/schemas/project.json'

id: 'cortex'

project:
  description: 'Cortex Server'
  channel: '#backend'

language: 'go'
type: 'application'

tags:
  - 'go'
  - 'backend'
  - 'app'

tasks:
  pnpm-install:
    script: |
      set -e
      pnpm install
    inputs:
      - package.json
      - pnpm-lock.yaml
    outputs:
      - node_modules
    platform: system
    options:
      runInCI: true
      outputStyle: buffer-only-failure

  # ─────────────────────────────────────────────────────────────
  # Build the Go binary *after* the front-end assets are copied.
  # ─────────────────────────────────────────────────────────────
  build:
    script: |
      set -e
      mkdir -p build
      go build -o build/cortex ./cmd/cortex
    deps:
      - '~:build-frontend-copy'
    outputs:
      - build/
    options:
      runInCI: true
      outputStyle: buffer-only-failure

  # ─────────────────────────────────────────────────────────────
  # Copy front-end bundle produced by ui-app:build
  # ─────────────────────────────────────────────────────────────
  build-frontend-copy:
    script: |
      set -e
      # rsync preserves timestamps and only moves changed files
      mkdir -p internal/static/assets
      rsync -a --delete "$MOON_WORKSPACE_ROOT/web/app/dist/" internal/static/assets/
    inputs:
      - $MOON_WORKSPACE_ROOT/web/app/dist/**/*   # hash depends on UI bundle
    outputs:
      - internal/static/assets/
    deps:
      - 'ui-app:build'
    platform: system
    options:
      runInCI: true
      outputStyle: buffer-only-failure

  # ─────────────────────────────────────────────────────────────
  # Local dev server
  # ─────────────────────────────────────────────────────────────
  serve:
    script: |
      set -e
      go run ./cmd/cortex/*.go -n ../../
    deps:
      - '~:build-frontend-copy'
    env:
      PORT: '8080'
    local: true         # never runs in CI
    platform: system

  # ─────────────────────────────────────────────────────────────
  # Production install (includes front-end)
  # ─────────────────────────────────────────────────────────────
  install:
    script: |
      set -e
      go install -tags=prod -ldflags="-X main.defaultPort=8081" ./cmd/cortex
    deps:
      - '~:build'
      - '~:build-frontend-copy'
    platform: system
    options:
      runInCI: true
      outputStyle: buffer-only-failure

  # ─────────────────────────────────────────────────────────────
  # Test task that includes Go tests and Playwright integration tests
  # ─────────────────────────────────────────────────────────────
  test:
    # Override the global Go test to include Playwright tests
    script: |
      set -e
      ./test.sh
    deps:
      - '~:build-frontend-copy'
      - '^:build'
      - '~:pnpm-install'
      - '~:playwright-install'
    inputs:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'tests/**/*.spec.ts'
      - 'package.json'
      - 'playwright.config.ts'
    platform: 'system'
    options:
      runInCI: true
  playwright-install:
    script: |
      set -e
      pnpm exec playwright install chromium
    deps:
      - '~:pnpm-install'
    platform: system
    options:
      runInCI: true
      outputStyle: buffer-only-failure
