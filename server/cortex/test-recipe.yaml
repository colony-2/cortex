name: test-recipe
description: Simple test recipe for execute command
version: "1.0"

input_schema:
  message:
    type: string
    required: true
    description: Message to echo
  count:
    type: number
    default: 1
    description: Number of times to repeat

# Root node is a sequence
sequence:
  - id: echo_step
    op: command_execution
    inputs:
      run: "echo '{{ .inputs.message }}'"
      
  - id: format_result
    op: command_execution
    inputs:
      run: "echo 'Result: {{ .nodes.echo_step.outputs.stdout }}'"

outputs:
  result: "{{ .nodes.format_result.outputs.stdout }}"
  timestamp: "{{ .timestamp }}"