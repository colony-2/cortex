$schema: 'https://moonrepo.dev/schemas/workspace.json'


# Project discovery
projects:
  - server/*/
  - "web/*/"
  - ".example/*/"
      
# Runner configuration
runner:
  archivableTargets:
    - ':build'
  cacheLifetime: '7 days'

# VCS configuration
vcs:
  provider: 'github'
  defaultBranch: 'main'
