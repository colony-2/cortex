$schema: 'https://moonrepo.dev/schemas/workspace.json'


# Project discovery
projects:
  - server/core
  - server/container
  - server/files
  - server/git
  - server/graph
  - server/storage
  - server/vibethis
  - server/web
  - "web/*/"
      
# Runner configuration
runner:
  archivableTargets:
    - ':build'
  cacheLifetime: '7 days'

# VCS configuration
vcs:
  provider: 'github'
  defaultBranch: 'main'
