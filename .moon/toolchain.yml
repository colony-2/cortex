# https://moonrepo.dev/docs/config/toolchain
$schema: './cache/schemas/toolchain.json'

# Define tools and their versions
node:
  #https://github.com/moonrepo/moon/issues/2269
  #version: '24.3.0'
  packageManager: 'pnpm'
  pnpm:
    #https://github.com/moonrepo/moon/issues/2269
    #version: '9.15.4'
  syncPackageManagerField: false


# TypeScript configuration  
typescript:
  syncProjectReferences: true
  syncProjectReferencesToPaths: true

unstable_go:
  version: ~1.25
  workspaces: false
  tidyOnChange: true
