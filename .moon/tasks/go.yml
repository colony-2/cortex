# Global Go tasks
$schema: '../cache/schemas/global-tasks.json'

tasks:
  build:
    command: 'go build ./...'
    inputs:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
    platform: 'system'
    options:
      runInCI: true

  test:
    command: 'go test ./...'
    inputs:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
    platform: 'system'
    options:
      runInCI: true

  lint:
    command: 'go vet ./...'
    inputs:
      - '**/*.go'
    platform: 'system'
    options:
      runInCI: true
  tidy:
    command: 'go mod tidy'
    inputs:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
    platform: 'system'
