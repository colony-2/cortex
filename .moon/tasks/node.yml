# .moon/tasks/node.yml
$schema: '../cache/schemas/global-tasks.json'

fileGroups:
  sources:
    - 'src/**/*'

  # absolute path (leading slash) → resolved from workspace root
  lockfile:
    - 'pnpm-lock.yaml'

  config:
    - 'vite.config.[jt]s'
    - 'tsconfig.json'
    - 'package.json'


tasks:
  build:
    command: pnpm
    args: [exec, vite, build, --logLevel, trace]
    inputs:
      - '@group(sources)'
      - '@group(config)'
      - '@group(lockfile)'      # ← hash the real lock-file
    outputs:
      - dist/
    deps:
      - "^:build"
    options:
      outputStyle: buffer-only-failure
  test:
    command: pnpm
    args: [exec, vitest, run, --reporter=dot]
    deps:
      - "^:build"
    inputs:
      - '@group(sources)'
      - tests/**/*
      - '@group(config)'
      - '@group(lockfile)'
    options:
      outputStyle: buffer-only-failure

  lint:
    command: eslint
    args: [src]
    inputs:
      - '@group(sources)'
      - .eslintrc*
      - '@group(lockfile)'
    options:
      outputStyle: buffer-only-failure
