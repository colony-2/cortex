# https://moonrepo.dev/docs/config/project
$schema: '../../../.moon/cache/schemas/project.json'

id: 'be-vibethis'

project:
  description: 'Main vibethis server application'
  channel: '#backend'
  
language: 'go'
type: 'application'

tags:
  - 'go'
  - 'backend'
  - 'app'

tasks:
  build:
    command: 'go build -ldflags="-s -w" -tags=prod -o build/vibethis .'
    outputs:
      - 'build/vibethis'
    deps:
      - '~:build-frontend-copy'
    options:
      runInCI: true

  build-frontend-copy:
    command: 'bash'
    args:
      - '-c'
      - 'mkdir -p static && cp -r $MOON_WORKSPACE_ROOT/web/app/dist static/'
    deps:
      - 'ui-app:build'
    platform: 'system'


  serve:
    command: 'go run main.go -n ../../../example'
    deps:
      - '~:build-frontend-copy'    
    env:
      PORT: '8080'
    local: true

  install-with-frontend:
    command: 'go install -tags=prod -ldflags="-X main.defaultPort=8081" .'
    deps:
      - '~:build-frontend-copy'
    platform: 'system'
