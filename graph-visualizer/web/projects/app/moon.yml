# https://moonrepo.dev/docs/config/project
$schema: '../../../.moon/cache/schemas/project.json'

project:
  name: 'web-app'
  description: 'Main React application for vibethis'
  channel: '#frontend'
  
language: 'typescript'
type: 'application'

tags:
  - 'frontend'
  - 'react'
  - 'app'

tasks:
  build:
    command: 'vite build --outDir $MOON_WORKSPACE_ROOT/web/dist'
    outputs:
      - '$MOON_WORKSPACE_ROOT/web/dist/**'
    deps:
      - 'web-shared:build'
      - 'web-changes:build'
      - 'web-config:build'
      - 'web-files:build'
      - 'web-flowchart:build'
    options:
      runInCI: true

  serve:
    command: 'vite dev --port 5173'
    local: true

  test:
    command: 'echo "No tests configured"'
    platform: 'node'

  lint:
    command: 'eslint'
    args:
      - 'src'
    platform: 'node'

  e2e:
    command: 'playwright test'
    options:
      runInCI: true

dependsOn:
  - 'web-shared'
  - 'web-changes'
  - 'web-config'
  - 'web-files'
  - 'web-flowchart'