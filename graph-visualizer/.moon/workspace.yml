$schema: 'https://moonrepo.dev/schemas/workspace.json'

#extends: 'https://github.com/moonrepo/moon-configs/workspace.yml'

# Project discovery
projects:
  - "server/*/"
  - "web/*/"
      
# Runner configuration
runner:
  archivableTargets:
    - ':build'
  cacheLifetime: '7 days'

# VCS configuration
vcs:
  provider: 'github'
  defaultBranch: 'main'
