name: doccell-simple
input_schema:
  directory:
    type: string
    required: true
    description: "Path to the cell directory to document"

sequence:
  # Step 1: Collect source files using git file collector
  - id: file_collector
    op: git_file_collector
    inputs:
      context_dir: "/Users/jnadeau/src/colony2/server/git/pkg/common"
      include_untracked: false
      use_gitignore: true