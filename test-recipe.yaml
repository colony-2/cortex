name: test-recipe
version: "1.0"
description: A test recipe for validation

inputs:
  - name: user_prompt
    type: string
    required: true
  - name: max_tokens
    type: number
    default: 1000

steps:
  - id: step1
    name: Generate response
    activity:
      type: llm_inference
      config:
        model: gpt-4
        max_tokens: "{{.Inputs.max_tokens}}"
        temperature: 0.7
      inputs:
        prompt: "{{.Inputs.user_prompt}}"
  
  - id: step2
    name: Process result
    activity:
      type: command_execution
      config:
        command: echo
        args: ["{{.Steps.step1.outputs.response}}"]
        timeout: 30s